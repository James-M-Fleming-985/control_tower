[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run dev -- --host 0.0.0.0 --port $PORT"

[[services]]
name = "feedback360-frontend"

[services.source]
repo = "James-M-Fleming-985/control_tower"
rootDirectory = "feedback-collector-mvp/frontend"

[services.variables]
NODE_ENV = "production"
VITE_API_URL = "${{feedback360-backend.RAILWAY_PUBLIC_DOMAIN}}"