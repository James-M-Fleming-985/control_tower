[build]
builder = "NIXPACKS"

[deploy]
buildCommand = "npm install && npm run build"
startCommand = "npx serve dist -s -p $PORT"

[[services]]
name = "feedback360-frontend"

[services.source]
repo = "James-M-Fleming-985/control_tower"
rootDirectory = "feedback-collector-mvp/frontend"

[services.variables]
VITE_API_URL = "https://energetic-purpose-production.up.railway.app"
NODE_ENV = "production"
