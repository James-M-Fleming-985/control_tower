[tool:pytest]
testpaths = tests/test_data_access_layer tests/test_business_logic tests/test_user_interface tests/test_integration_layer
python_paths = src
addopts = --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=50 -v --tb=short
filterwarnings = 
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
collect_ignore = 
    tests/test_all_months.py
    tests/test_all_months_resources.py
    tests/test_feature_integration_complete.py
    tests/test_requirements_parser.py
    tests/test_test_generator.py
    tests/unit/test_data_access_comprehensive.py
    tests/unit/user_interface/