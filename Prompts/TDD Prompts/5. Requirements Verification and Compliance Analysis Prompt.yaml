requirements_verification_framework:
  phase_1_requirements_identification:
    commands:
      load_requirements_document:
        command: 'cat "projects/PROJECT-003 TDD ENFORCER/SYSTEM-003-02 EXTENDED VALIDATION ENGINE/FEATURE-003-02-01 TESTING PYRAMID VALIDATION ENGINE/USER INTERFACE LAYER/LAYER-003-02-01-003_user_interface_requirements.md"'
        purpose: "Load User Interface Layer requirements document"
        
      extract_functional_requirements:
        command: 'grep -n "REQ-UI-" "LAYER-003-02-01-003_user_interface_requirements.md" > ui_requirements.txt'
        purpose: "Extract all REQ-UI requirements from document"
        
      extract_performance_requirements:
        command: 'grep -n "REQ-PERF-UI\|REQ-UX-UI" "LAYER-003-02-01-003_user_interface_requirements.md" > perf_ux_requirements.txt'
        purpose: "Extract non-functional (performance and UX) requirements"
        
      extract_integration_mobile_requirements:
        command: 'grep -n "REQ-MOB-UI\|REQ-RT-UI\|REQ-MOB-OPT\|REQ-MOB-SEC" "LAYER-003-02-01-003_user_interface_requirements.md" > mobile_requirements.txt'
        purpose: "Extract integration and mobile-specific requirements"
        
  phase_2_workspace_file_discovery:
    description: "Build comprehensive file index using workspace-wide search (robust for undisciplined file placement)"
    
    python_tracer_implementation:
      initialization:
        code: |
          def __init__(self, repo_root: str):
              self.repo_root = Path(repo_root)
              print("🔍 Indexing workspace files...")
              self.file_index = self._build_file_index()
              print(f"   Found {len(self.file_index)} Python files")
              self.requirements = {}
              self.evidence_log = []
              
      file_indexing:
        code: |
          def _build_file_index(self) -> Dict[str, str]:
              """Build index of all Python files in workspace."""
              file_index = {}
              exclude_dirs = {'.venv', '__pycache__', '.git', 'node_modules'}
              
              for root, dirs, files in os.walk(self.repo_root):
                  # Skip excluded directories
                  dirs[:] = [d for d in dirs if d not in exclude_dirs]
                  
                  for filename in files:
                      if filename.endswith('.py'):
                          full_path = os.path.join(root, filename)
                          # Store first occurrence (priority to earlier finds)
                          if filename not in file_index:
                              file_index[filename] = full_path
              
              return file_index
              
      file_lookup:
        code: |
          def _find_file(self, filename: str) -> Optional[str]:
              """Search for file anywhere in workspace using file index"""
              return self.file_index.get(filename)
              
          def _get_file_path(self, filename: str) -> str:
              """Returns first found path from index, or default location"""
              found = self._find_file(filename)
              if found:
                  return found
              # If not found, return default project UI location
              default_location = (
                  self.project_root / "src/user_interface" / filename
              )
              return str(default_location)
    
    benefits:
      - "Finds files in repo root, project root, src folders, test folders, or loose in directories"
      - "Handles 772+ Python files with instant dictionary lookup"
      - "No assumptions about folder structure - works with undisciplined file placement"
      - "First-occurrence priority prevents duplicate filename conflicts"
      - "Minimal overhead (~1-2 seconds for full workspace indexing)"
      
    example_usage:
      - "file_path = tracer._get_file_path('mobile_ui_dashboard.py')  # Finds anywhere"
      - "test_path = tracer._get_file_path('test_mobile_authentication.py')  # Finds anywhere"
      - "No need to specify src/ or test/ folders - automatic discovery"

