    step_1_requirements_discovery:
      description: "Execute requirements identification"
      commands:
        - 'echo "=== PHASE 1: REQUIREMENTS DISCOVERY ==="'
        - 'find . -name "*.md" | xargs grep -l "REQ-\\|SHALL\\|MUST\\|REQUIREMENT" > requirements_files.txt'
        - 'echo "Requirements files identified: $(wc -l < requirements_files.txt)"'
        - 'grep -n "REQ-\\|SHALL\\|MUST" $(cat requirements_files.txt) > all_requirements_statements.txt'
        - 'echo "Requirements statements found: $(wc -l < all_requirements_statements.txt)"'
        
    step_2_evidence_collection:
      description: "Execute comprehensive testing"
      commands:
        - 'echo "=== PHASE 2: EVIDENCE COLLECTION ==="'
        - "python -m pytest test_evidence_validator*.py -v --json-report --json-report-file=validation_results.json"
        - "python -m pytest test_*performance*.py -v --json-report --json-report-file=performance_results.json"
        - "python -m pytest test_*integration*.py -v --json-report --json-report-file=integration_results.json"
        - 'echo "Test evidence collected in JSON format"'
        
