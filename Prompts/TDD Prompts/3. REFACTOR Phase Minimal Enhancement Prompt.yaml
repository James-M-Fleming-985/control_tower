          implementation: |
            def merge_context_states(self, merge_request: dict) -> dict:
                from datetime import datetime
                
                base_context = merge_request.get('base_context', {})
                incoming_context = merge_request.get('incoming_context', {})
                merge_strategy = merge_request.get('merge_strategy', 'auto_resolve')
                
                base_state = base_context.get('state', {})
                incoming_state = incoming_context.get('state', {})
                
                # Implement actual merge strategy logic
                if merge_strategy == 'auto_resolve':
                    # Smart merge: detect conflicts, prefer newer timestamps
                    merged_state, conflicts = self._auto_resolve_merge(base_state, incoming_state)
                elif merge_strategy == 'last_write_wins':
                    # Simple merge: incoming always wins
                    merged_state = {**base_state, **incoming_state}
                    conflicts = 0
                elif merge_strategy == 'manual':
                    # Return both states for manual resolution
                    merged_state = {'base': base_state, 'incoming': incoming_state, 'requires_manual_merge': True}
                    conflicts = len(set(base_state.keys()) & set(incoming_state.keys()))
                else:
                    raise ValueError(f"Unknown merge strategy: {merge_strategy}")
                
                new_version = max(
                    base_context.get('version', 0),
                    incoming_context.get('version', 0)
                ) + 1
                
                return {
                    'merged_state': merged_state,
                    'version': new_version,
                    'conflicts_resolved': conflicts,
                    'merge_strategy_used': merge_strategy,
                    'timestamp': datetime.now().isoformat()
                }
            
            def _auto_resolve_merge(self, base: dict, incoming: dict) -> tuple[dict, int]:
                """Smart merge with conflict detection."""
                merged = base.copy()
                conflicts = 0
                
                for key, value in incoming.items():
                    if key in base and base[key] != value:
                        conflicts += 1
                        # Auto-resolve: prefer incoming value (could be enhanced with timestamps)
                    merged[key] = value
                
                return merged, conflicts

