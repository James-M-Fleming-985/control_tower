                "local": self._fetch_local_context(user_id),
                "remote": self._fetch_remote_context(user_id),
                "backup": self._fetch_backup_context(user_id)
            }
            
            inconsistencies = []
            for system_name, context in systems.items():
                validation = self._validate_context_structure(context)
                if not validation["valid"]:
                    inconsistencies.extend([
                        f"{system_name}: {error}" for error in validation["errors"]
