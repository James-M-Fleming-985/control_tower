            class PerformanceAlerting:
                def __init__(self, alert_channels: List[str] = None):
                    self.alert_channels = alert_channels or []
                    self.alert_history = []
                
                def check_and_alert(
                    self,
                    component: str,
                    actual_ms: float,
                    target_ms: float
                ) -> List[str]:
                    alerts = []
                    
                    # Check if threshold exceeded
                    if actual_ms > target_ms:
                        severity = self._calculate_severity(actual_ms, target_ms)
                        alert = {
                            "component": component,
                            "actual_ms": actual_ms,
                            "target_ms": target_ms,
                            "variance_ms": actual_ms - target_ms,
                            "severity": severity,
                            "timestamp": datetime.datetime.now(datetime.UTC).isoformat()
                        }
                        alerts.append(alert)
                        self.alert_history.append(alert)
                        
                        # Send to alert channels
                        for channel in self.alert_channels:
                            self._send_alert(channel, alert)
                    
                    return alerts
                
                def _calculate_severity(self, actual: float, target: float) -> str:
                    variance_pct = ((actual - target) / target) * 100
                    if variance_pct > 50:
                        return "critical"
                    elif variance_pct > 25:
                        return "warning"
                    else:
                        return "info"
                
