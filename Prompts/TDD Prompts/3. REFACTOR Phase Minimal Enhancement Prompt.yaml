            from functools import lru_cache
            from datetime import datetime, timedelta
            
            class ContextCache:
                def __init__(self, ttl_seconds: int = 300):
                    self.cache = {}
                    self.ttl = timedelta(seconds=ttl_seconds)
                
                def get(self, user_id: str) -> Optional[Dict[str, Any]]:
                    if user_id in self.cache:
                        data, timestamp = self.cache[user_id]
                        if datetime.now(datetime.UTC) - timestamp < self.ttl:
                            return data
                        del self.cache[user_id]
                    return None
                
                def set(self, user_id: str, data: Dict[str, Any]):
                    self.cache[user_id] = (data, datetime.now(datetime.UTC))
            
            # In class __init__:
            self.context_cache = ContextCache(ttl_seconds=300)
            
            # In sync method:
            cached = self.context_cache.get(user_id)
            if cached and sync_strategy == "pull":
                return cached
          rationale: "Reduce API calls and improve performance"
          files_to_modify: ["context_engine_api_integration_iteration_9.py"]

