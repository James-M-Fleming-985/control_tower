                def get(self, user_id: str) -> Optional[Dict]:
                    if user_id in self.cache:
                        data, timestamp = self.cache[user_id]
                        if datetime.now(datetime.UTC) - timestamp < self.ttl:
                            return data
                        del self.cache[user_id]
