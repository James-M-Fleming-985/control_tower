  refactor_implementation_details:
    authenticate_mobile_user_refactor:
      priority: "CRITICAL"
      current_issues:
        - "Simple string token instead of real JWT"
        - "Hardcoded secret key in class"
        - "No credential validation"
        - "In-memory session storage"

      refactor_steps:
        constants_extraction:
          description: "Extract magic strings and values to module-level constants"
          constants_to_add:
            - "JWT_ALGORITHM = 'HS256'"
            - "SESSION_ID_PREFIX = 'sess_'"
            - "JWT_TOKEN_PREFIX = 'jwt_'"
            - "DEFAULT_TOKEN_EXPIRY_HOURS = 24"
            - "ALLOWED_AUTH_METHODS = ['biometric', 'password', 'multi_factor']"
            - "ALLOWED_SECURITY_LEVELS = ['low', 'medium', 'high']"

        jwt_implementation:
          description: "Replace string-based token with real JWT using PyJWT"
          dependencies: "pip install PyJWT"
          implementation: |
            import jwt
            
            def _generate_jwt_token(self, username: str, device_id: str, 
                                   session_id: str, security_level: str) -> str:
                """Generate JWT token with proper claims and signature"""
                payload = {
                    "sub": username,
                    "device_id": device_id,
                    "session_id": session_id,
                    "security_level": security_level,
                    "iat": datetime.datetime.utcnow(),
                    "exp": datetime.datetime.utcnow() + datetime.timedelta(hours=DEFAULT_TOKEN_EXPIRY_HOURS)
                }
                return jwt.encode(payload, self._jwt_secret, algorithm=JWT_ALGORITHM)

        input_validation:
          description: "Add comprehensive input validation"
          implementation: |
            def _validate_auth_request(self, auth_request: Dict[str, Any]) -> None:
                """Validate authentication request structure and values"""
                if not isinstance(auth_request, dict):
                    raise TypeError("auth_request must be a dictionary")
                
                user_creds = auth_request.get("user_credentials", {})
                if not isinstance(user_creds, dict):
                    raise ValueError("user_credentials must be a dictionary")
                
                if not user_creds.get("username"):
                    raise ValueError("username is required in user_credentials")
                
                if not user_creds.get("device_id"):
                    raise ValueError("device_id is required in user_credentials")
                
                auth_method = auth_request.get("authentication_method", "password")
                if auth_method not in ALLOWED_AUTH_METHODS:
                    raise ValueError(f"Invalid authentication_method: {auth_method}")
                
                security_level = auth_request.get("security_level", "medium")
                if security_level not in ALLOWED_SECURITY_LEVELS:
                    raise ValueError(f"Invalid security_level: {security_level}")

        session_storage:
          description: "Add option for persistent session storage"
          implementation: |
            def __init__(self, session_store=None, jwt_secret=None):
                """
                Initialize mobile authentication integration
                
                Args:
                    session_store: Optional persistent session storage backend
                    jwt_secret: Optional JWT secret (defaults to env var or constant)
                """
                self._session_store = session_store or {}  # Default to in-memory
                self._jwt_secret = jwt_secret or os.getenv(
                    "JWT_SECRET", 
                    "SECRET_KEY_REPLACE_IN_PRODUCTION"
                )

        error_handling:
          description: "Add comprehensive error handling"
          error_scenarios:
            - "Invalid auth_request structure → ValueError with descriptive message"
            - "Missing required fields → ValueError with field name"
            - "Invalid authentication_method → ValueError with allowed values"
            - "Session storage failure → RuntimeError with storage details"

    sync_session_across_platforms_refactor:
      priority: "HIGH"
      current_issues:
        - "No actual API calls to platforms"
        - "Assumes all syncs succeed"
        - "No retry logic"
        - "No sync state persistence"

      refactor_steps:
        platform_registry:
          description: "Add platform endpoint registry and configuration"
          implementation: |
            PLATFORM_ENDPOINTS = {
                "mobile": "https://mobile-api.example.com/sync",
                "web": "https://web-api.example.com/sync",
                "api": "https://api.example.com/sync"
            }
            
            def __init__(self, session_store=None, jwt_secret=None, platform_config=None):
                # ... existing init code ...
                self._platform_endpoints = platform_config or PLATFORM_ENDPOINTS

        sync_implementation:
          description: "Implement actual platform sync with HTTP calls"
          dependencies: "requests library (already available)"
          implementation: |
            def _sync_to_platform(self, session_id: str, platform: str, 
                                session_data: Dict[str, Any]) -> bool:
                """Sync session to specific platform endpoint"""
                try:
                    endpoint = self._platform_endpoints.get(platform)
                    if not endpoint:
                        return False
                    
                    response = requests.post(
                        endpoint,
                        json={
                            "session_id": session_id,
                            "session_data": session_data
                        },
                        timeout=5.0
                    )
                    return response.status_code == 200
                except requests.RequestException as e:
                    # Log error and return False
                    return False

        retry_logic:
          description: "Add retry logic with exponential backoff"
          implementation: |
            def _sync_with_retry(self, session_id: str, platform: str, 
                               session_data: Dict[str, Any], max_retries: int = 3) -> bool:
                """Sync with retry logic and exponential backoff"""
                for attempt in range(max_retries):
                    if self._sync_to_platform(session_id, platform, session_data):
                        return True
                    
                    if attempt < max_retries - 1:
                        wait_time = 2 ** attempt  # Exponential backoff: 1s, 2s, 4s
                        time.sleep(wait_time)
                
                return False

    validate_mobile_security_context_refactor:
      priority: "HIGH"
      current_issues:
        - "Hardcoded security checks"
        - "No actual validation logic"
        - "Assumes all checks pass"
