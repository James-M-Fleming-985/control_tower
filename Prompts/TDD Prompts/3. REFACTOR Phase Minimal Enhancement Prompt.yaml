            class PerformanceTrendAnalyzer:
                def __init__(self, retention_days: int = 30):
                    self.retention_days = retention_days
                    self.history = {}
                
                def record_measurement(self, component: str, response_time_ms: float):
                    if component not in self.history:
                        self.history[component] = []
                    
                    self.history[component].append({
                        "response_time_ms": response_time_ms,
                        "timestamp": datetime.datetime.now(datetime.UTC)
                    })
                    
                    # Clean old data
                    self._cleanup_old_data(component)
                
                def analyze_trend(self, component: str) -> Dict[str, Any]:
                    if component not in self.history or not self.history[component]:
                        return {"trend": "insufficient_data"}
                    
                    data = self.history[component]
                    times = [d["response_time_ms"] for d in data]
                    
                    # Calculate statistics
                    avg = sum(times) / len(times)
                    p50 = sorted(times)[len(times) // 2]
                    p95 = sorted(times)[int(len(times) * 0.95)]
                    p99 = sorted(times)[int(len(times) * 0.99)]
                    
                    # Detect degradation
                    recent_avg = sum(times[-10:]) / min(10, len(times))
                    degradation = recent_avg > avg * 1.2
                    
                    return {
                        "component": component,
                        "avg_ms": avg,
                        "p50_ms": p50,
                        "p95_ms": p95,
                        "p99_ms": p99,
                        "recent_avg_ms": recent_avg,
                        "degradation_detected": degradation,
                        "samples": len(times)
                    }
          rationale: "Track performance trends and detect degradation over time"
