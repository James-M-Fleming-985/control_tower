# ==============================================================================
# VERIFICATION EXECUTION INSTRUCTIONS
# ==============================================================================
verification_execution:
  step_1_gather_evidence:
    instruction: "Locate and read all feature verification documents"
    files_to_read:
      - "FEATURE-004-01-02 Core Code Generation/Requirements Verification/feature_requirements_verification_20251009_133213.yaml"
      - "FEATURE-004-01-03 TDD Cycle Orchestration/Requirements Verification/FEATURE-004-01-03_verification_summary_20251010_181500.md"
    
    extract_data:
      - "Feature completion status"
      - "Total tests executed per feature"
      - "Test pass rates"
      - "Coverage percentages"
      - "Acceptance criteria verified"
      - "Quality gates passed"
  
  step_2_map_to_system_ac:
    instruction: "Map feature evidence to system acceptance criteria"
    for_each_system_ac:
      - "Identify contributing features"
      - "Extract relevant verification evidence from feature reports"
      - "Determine if system AC is satisfied"
      - "Document traceability linkage"
  
  step_3_aggregate_metrics:
    instruction: "Calculate system-level metrics"
    calculations:
      - "Total tests: Sum all feature tests"
      - "System coverage: Weighted average by feature size"
      - "Test pyramid ratio: Aggregate unit:integration:e2e"
      - "Success rate: Overall test pass rate"
  
  step_4_assess_completeness:
    instruction: "Assess system completeness"
    checks:
      - "All features implemented? (3/3 expected)"
      - "All system ACs verified? (8/8 expected)"
      - "All quality gates passed?"
      - "System success criteria met?"
  
  step_5_generate_report:
    instruction: "Generate comprehensive system verification report"
    output_format: "YAML (matching FEATURE verification format)"
    output_location: "projects/PROJECT-004 AI CODE GENERATOR/SYSTEM-004-01 AI CODE GENERATION SYSTEM/"
    output_filename: "SYSTEM-004-01_requirements_verification_[timestamp].yaml"
    
    report_sections:
      - metadata
      - feature_composition
      - acceptance_criteria_verification
      - testing_requirements_verification
      - quality_gates_verification
      - success_criteria_verification
      - cross_feature_integration_verification
      - system_test_coverage_analysis
      - requirements_traceability_matrix
      - system_certification
      - documentation_references
      - verification_summary

# ==============================================================================
# OUTPUT SPECIFICATIONS
# ==============================================================================
output_specifications:
  primary_deliverable:
    name: "System Requirements Verification Report"
    format: "YAML"
    structure: "Match FEATURE verification format (feature_requirements_verification_20251009_133213.yaml)"
    filename_pattern: "SYSTEM-004-01_requirements_verification_YYYYMMDD_HHMMSS.yaml"
    
  required_sections:
    - section: metadata
      content: "System ID, name, project, team size, risk level, verification date"
    
    - section: feature_composition
      content: "List of all features, their status, test counts, coverage"
    
    - section: acceptance_criteria_verification
      content: "All 8 system ACs with verification evidence from features"
    
    - section: testing_requirements_verification
      content: "System-level test metrics vs. requirements"
    
    - section: quality_gates_verification
      content: "AI code quality gates and performance gates compliance"
    
    - section: system_certification
      content: "Certification status, readiness assessment, authorization"

