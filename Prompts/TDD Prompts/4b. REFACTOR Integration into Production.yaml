---
# REFACTOR Integration into Production - Post-Refactor Production Testing

metadata:
  prompt_type: "post_refactor_production_testing"
  feature_id: "FEATURE-003-01-04"
  feature_name: "Stage Gate Evidence Collection"
  tdd_phase: "POST-REFACTOR-PRODUCTION"
  created_date: "2025-09-30"
  updated_date: "2025-09-30"

system_overview:
  description: "Comprehensive Unit→Integration→E2E validation for all layers"
  status: "REFACTOR phase completed for SimpleIntegrationHandler"
  
  implementation_status:
    integration_layer:
      status: "PRODUCTION_READY"
      description: "SimpleIntegrationHandler production-ready with enhanced error handling, configuration management, and logging"
      completion: "✅ COMPLETE"
      
    data_access_layer:
      status: "READY_FOR_TESTING"
      description: "Evidence storage and retrieval systems"
      completion: "🔄 PENDING"
      
    business_logic_layer:
      status: "READY_FOR_TESTING"
      description: "TDD compliance validation and stage gate enforcement"
      completion: "🔄 PENDING"
      
    user_interface_layer:
      status: "READY_FOR_TESTING"
      description: "Evidence display and progress tracking"
      completion: "🔄 PENDING"
      
  testing_philosophy:
    unit_tests: "70% - Method-level validation with comprehensive mocking"
    integration_tests: "20% - Layer boundaries and external dependency validation"
    e2e_tests: "10% - Complete workflows and user scenarios"

layer_testing_strategies:
  integration_layer:
    layer_id: "LAYER-003-01-04-004"
    status: "REFACTOR_COMPLETE"
    implementation: "SimpleIntegrationHandler with production enhancements"
    
    unit_tests:
      coverage_target: "70%"
      test_file: "/workspaces/control_tower/tests/integration_layer/unit/test_simple_integration_handler_unit.py"
      
      test_cases:
        save_evidence_locally_unit:
          description: "Test evidence saving with mocked file system"
          mocks: ["pathlib.Path.open", "json.dump"]
          validation: "Mock calls and return values"
          
        load_evidence_error_handling_unit:
          description: "Test file loading error conditions"
          scenario: "FileNotFoundError simulation"
          expected_exception: "FileOperationError"
          
        configuration_validation_unit:
          description: "Test configuration schema validation"
          config_structure:
            evidence_storage:
              base_directory: "./test"
            notifications:
              email_enabled: false
            logging:
              level: "INFO"
            reports:
              default_template: "standard"
          validation: "Configuration schema compliance"
          
        logging_system_unit:
          description: "Test logging infrastructure setup"
          validation: "Logger attribute existence and naming"
          
        email_notification_fallback_unit:
          description: "Test email notification with disabled configuration"
          scenario: "Email disabled configuration"
          expected_result: "Status in ['sent', 'logged']"
          
    integration_tests:
      coverage_target: "20%"
      test_file: "/workspaces/control_tower/tests/integration_layer/integration/test_simple_integration_handler_integration.py"
      
      test_cases:
        file_operations_integration:
          description: "Test actual file system operations"
          scenario: "Real file save and load operations"
          cleanup_required: true
          
        configuration_file_integration:
          description: "Test loading from actual configuration file"
          requires_temp_file: true
          config_validation: "Real config file processing"
          
        logging_file_creation_integration:
          description: "Test logging file creation and rotation"
          log_settings:
            file_enabled: true
            log_file: "./test_logs/integration_test.log"
            max_log_size_mb: 1
            backup_count: 3
          cleanup_required: true
          
    e2e_tests:
      coverage_target: "10%"
      test_file: "/workspaces/control_tower/tests/integration_layer/e2e/test_simple_integration_handler_e2e.py"
      
      test_cases:
        complete_evidence_workflow_e2e:
          description: "Test complete evidence collection workflow"
          phases:
            - name: "red_phase"
              evidence_type: "failing_tests"
              test_count: 7
              tests_passing: 0
              tests_failing: 7
            - name: "green_phase" 
              evidence_type: "passing_tests"
              test_count: 7
              tests_passing: 7
              tests_failing: 0
            - name: "refactor_phase"
              evidence_type: "enhancements"
              enhancements: ["error_handling", "configuration", "logging"]
              code_quality_score: 95
          validation: "Complete TDD cycle evidence collection"
          
  data_access_layer:
    layer_id: "LAYER-003-01-04-001"
    status: "READY_FOR_TESTING"
    components: ["Evidence persistence", "git operations", "file system management"]
    
    unit_tests:
      coverage_target: "70%"
      test_file: "/workspaces/control_tower/tests/data_access_layer/unit/"
      
      test_cases:
        evidence_repository_save_unit:
          description: "Test evidence repository save with mocked storage"
          mocks: ["_write_to_storage"]
          evidence_structure:
            id: "test_id"
            stage: "green"
            data:
              tests: 7
              
        evidence_query_builder_unit:
          description: "Test evidence query construction"
          query_parameters:
            stage: "green"
            date_range: "2025-09-26"
          validation: "Query object structure"
          
        git_operations_unit:
          description: "Test git operations with mocked git commands"
          mocks: ["subprocess.run"]
          mock_return:
            returncode: 0
          operation: "create_checkpoint"
          
        file_system_manager_unit:
          description: "Test file system operations with temporary directories"
          mocks: ["pathlib.Path.mkdir"]
          operation: "ensure_directory"
          
    integration_tests:
      coverage_target: "20%"
      test_file: "/workspaces/control_tower/tests/data_access_layer/integration/"
      
      test_cases:
        evidence_persistence_integration:
          description: "Test evidence persistence with real database"
          database: "sqlite:///test.db"
          operations: ["save", "retrieve", "query", "delete"]
          cleanup_required: true
          
        git_integration_real_repo:
          description: "Test git operations with actual git repository"
          setup_required: "Initialize test git repository"
          operations: ["create_checkpoint", "verify_checkpoint"]
          cleanup_required: true
          
    e2e_tests:
      coverage_target: "10%"
      test_file: "/workspaces/control_tower/tests/data_access_layer/e2e/"
      
      test_cases:
        complete_evidence_collection_e2e:
          description: "Test complete evidence collection and retrieval workflow"
          workflow_phases:
            - "RED phase evidence collection with git checkpoint"
            - "GREEN phase evidence collection with git checkpoint"
            - "REFACTOR phase evidence collection with git checkpoint"
          validation: "Complete TDD cycle evidence in database and git"
          
  business_logic_layer:
    layer_id: "LAYER-003-01-04-002"
    status: "READY_FOR_TESTING"
    components: ["TDD compliance validation", "stage gate enforcement", "rule engine"]
    
    unit_tests:
      coverage_target: "70%"
      test_file: "/workspaces/control_tower/tests/business_logic_layer/unit/"
      
      test_cases:
        red_phase_validation_unit:
          description: "Test RED phase compliance validation"
          scenarios:
            valid_red:
              test_results:
                passing: 0
                failing: 7
              expected_compliance: true
              expected_score: ">=90"
            invalid_red:
              test_results:
                passing: 7
                failing: 0
              expected_compliance: false
              
        green_phase_validation_unit:
          description: "Test GREEN phase compliance validation"
          implementation_metrics:
            lines_of_code: 150
            complexity: 8
            test_coverage: 100
          expected_compliance: true
          
        refactor_phase_validation_unit:
          description: "Test REFACTOR phase compliance validation"
          refactor_metrics:
            before:
              complexity: 12
              duplication: 15
            after:
              complexity: 8
              duplication: 5
            enhancements: ["error_handling", "logging", "configuration"]
          expected_improvements: ">=3"
          
        stage_gate_enforcement_unit:
          description: "Test stage gate blocking logic"
          scenarios:
            valid_transition:
              evidence_stage: "red"
              evidence_data:
                tests_failing: 7
              can_proceed_to_green: true
            invalid_transition:
              evidence_stage: "red"
              evidence_data:
                tests_failing: 0
              can_proceed_to_green: false
              
    integration_tests:
      coverage_target: "20%"
      test_file: "/workspaces/control_tower/tests/business_logic_layer/integration/"
      
      test_cases:
        complete_tdd_workflow_validation:
          description: "Test complete TDD workflow with business logic integration"
          workflow_steps:
            - "Start RED phase"
            - "Execute failing tests" 
            - "Validate RED phase compliance"
            - "Check stage gate for GREEN transition"
            - "Transition to GREEN phase"
            - "Implement minimal solution"
            - "Validate GREEN phase"
            - "Transition to REFACTOR"
            - "Apply refactoring enhancements"
            - "Validate REFACTOR phase"
          validation: "Complete TDD cycle with business rules"
          
    e2e_tests:
      coverage_target: "10%"
      test_file: "/workspaces/control_tower/tests/business_logic_layer/e2e/"
      
      test_cases:
        tdd_enforcement_complete_cycle_e2e:
          description: "Test complete TDD enforcement from start to finish"
          enforcement_scenarios:
            - "Block implementation without tests (TDDViolationError)"
            - "Allow test creation first"
            - "Validate RED phase execution"
            - "Allow minimal implementation"
            - "Validate GREEN phase execution"
            - "Allow refactoring"
            - "Validate REFACTOR phase completion"
          expected_quality_score: ">=90"
          
  user_interface_layer:
    layer_id: "LAYER-003-01-04-003"
    status: "READY_FOR_TESTING"
    components: ["Progress display", "evidence visualization", "user feedback"]
    
    unit_tests:
      coverage_target: "70%"
      test_file: "/workspaces/control_tower/tests/user_interface_layer/unit/"
      
      test_cases:
        progress_display_component_unit:
          description: "Test progress display component isolation"
          scenarios:
            red_phase:
              phase: "red"
              tests_total: 7
              tests_failing: 7
              percentage: 0
            green_phase:
              phase: "green"
              tests_total: 7
              tests_passing: 7
              percentage: 100
          mocks: ["_render_progress_bar"]
          
        evidence_visualization_unit:
          description: "Test evidence visualization components"
          evidence_data:
            stage: "refactor"
            enhancements: ["error_handling", "configuration", "logging"]
            metrics:
              complexity: 8
              coverage: 95
          expected_chart_type: "bar"
          
        user_feedback_unit:
          description: "Test user feedback and notification systems"
          message_types:
            success:
              message: "GREEN phase complete!"
              expected_type: "success"
            error:
              message: "TDD violation detected"
              expected_type: "error"
              expected_severity: "high"
              
    integration_tests:
      coverage_target: "20%"
      test_file: "/workspaces/control_tower/tests/user_interface_layer/integration/"
      
      test_cases:
        ui_backend_integration:
          description: "Test UI components with real backend services"
          workflow:
            - "Create real evidence data"
            - "Save evidence through backend"
            - "Display evidence through UI"
            - "Verify UI displays correct information"
            - "Test real-time updates"
          validation: "UI-backend data flow integrity"
          
        ui_responsiveness_integration:
          description: "Test UI responsiveness with concurrent updates"
          concurrency_test:
            thread_count: 10
            updates_per_thread: "progress percentage 0-100"
          validation: "UI state consistency under concurrent updates"
          
    e2e_tests:
      coverage_target: "10%"
      test_file: "/workspaces/control_tower/tests/user_interface_layer/e2e/"
      
      test_cases:
        complete_user_workflow_e2e:
          description: "Test complete user workflow from UI perspective"
          user_journey:
            - name: "Start new TDD cycle"
              ui_state: "Initial setup interface"
            - name: "RED phase interface"
              ui_elements: ["RED Phase indicator", "Write failing tests first", "red color scheme"]
            - name: "Execute tests from UI"
              result: "Failing tests display"
            - name: "GREEN phase transition"
              ui_elements: ["GREEN Phase indicator", "Implement minimal solution", "green color scheme"]
            - name: "Implementation tests pass"
              feedback: "All tests passing! success message"
            - name: "REFACTOR phase"
              ui_elements: ["REFACTOR Phase indicator", "Improve code quality", "blue color scheme"]
            - name: "Apply refactoring"
              result: "TDD Cycle Complete! with quality score >=90"
              
        error_handling_user_experience_e2e:
          description: "Test user experience during error conditions"
          error_scenarios:
            tdd_violation:
              trigger: "Implementation before tests"
              ui_response: "TDD Violation blocking message"
            file_system_error:
              trigger: "Permission error during evidence collection"
              ui_response: "Graceful error handling with retry options"
          validation: "User-friendly error recovery workflows"

execution_plan:
  testing_phases:
    phase_1:
      name: "Layer-by-Layer Unit Testing"
      duration: "4 days"
      commands:
        - "pytest tests/integration_layer/unit/ -v --cov=simple_integration_handler --cov-report=html"
        - "pytest tests/data_access_layer/unit/ -v --cov=src/data_access --cov-report=html"
        - "pytest tests/business_logic_layer/unit/ -v --cov=src/business_logic --cov-report=html"
        - "pytest tests/user_interface_layer/unit/ -v --cov=src/user_interface --cov-report=html"
        
    phase_2:
      name: "Layer-by-Layer Integration Testing"
      duration: "4 days"
      commands:
        - "pytest tests/integration_layer/integration/ -v --tb=short"
        - "pytest tests/data_access_layer/integration/ -v --tb=short"
        - "pytest tests/business_logic_layer/integration/ -v --tb=short"
        - "pytest tests/user_interface_layer/integration/ -v --tb=short"
        
    phase_3:
      name: "Layer-by-Layer End-to-End Testing"
      duration: "4 days"
      commands:
        - "pytest tests/integration_layer/e2e/ -v --tb=short --timeout=30"
        - "pytest tests/data_access_layer/e2e/ -v --tb=short --timeout=30"
        - "pytest tests/business_logic_layer/e2e/ -v --tb=short --timeout=30"
        - "pytest tests/user_interface_layer/e2e/ -v --tb=short --timeout=30"
        
    phase_4:
      name: "Cross-Layer Integration Testing"
      duration: "2 days"
      commands:
        - "pytest tests/cross_layer_integration/ -v --tb=short"
        - "pytest tests/contract_testing/ -v --tb=short"
        - "pytest tests/performance_integration/ -v --tb=short"
        
    phase_5:
      name: "Complete System End-to-End Testing"
      duration: "3 days"
      commands:
        - "pytest tests/system_e2e/ -v --tb=short --timeout=60"
        - "pytest tests/production_scenarios/ -v --tb=short --timeout=120"

success_criteria:
  layer_quality_gates:
