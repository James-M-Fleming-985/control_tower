                  description: "Strategy to resolve the conflict"
          returns:
            type: "Dict[str, Any]"
            fields:
              - "conflict_resolved: bool" # True if conflict was resolved
              - "resolution_method: str" # Method used to resolve conflict
              - "merged_version: int" # Version number after resolution
              - "data_preserved: bool" # Whether all data was preserved
              - "resolution_timestamp: str" # ISO 8601 timestamp
          implementation_notes:
            - "Extract conflict_type, versions, and resolution_strategy"
            - "Apply appropriate resolution strategy"
            - "For 'merge': combine local and remote changes"
            - "For 'local_wins': keep local version"
            - "For 'remote_wins': accept remote version"
            - "For 'manual': flag for manual resolution"
            - "Increment version number after resolution"
            - "Return resolution result"
          example_implementation: |
            import datetime
            
            def handle_context_conflicts(self, conflict_scenario: Dict[str, Any]) -> Dict[str, Any]:
                """Handle context conflicts detected during synchronization"""
                conflict_type = conflict_scenario.get("conflict_type")
                local_version = conflict_scenario.get("local_version", 0)
                remote_version = conflict_scenario.get("remote_version", 0)
                resolution_strategy = conflict_scenario.get("conflict_resolution_strategy", "merge")
                
                # Validate resolution strategy
                valid_strategies = ["merge", "local_wins", "remote_wins", "manual"]
                if resolution_strategy not in valid_strategies:
                    resolution_strategy = "merge"
                
                # Apply resolution strategy
                conflict_resolved = True
                data_preserved = True
                
                if resolution_strategy == "merge":
                    # Merge both versions - take higher version and increment
                    merged_version = max(local_version, remote_version) + 1
                    resolution_method = "automated_merge"
                elif resolution_strategy == "local_wins":
                    merged_version = local_version + 1
                    resolution_method = "local_priority"
                    data_preserved = False  # Remote changes discarded
                elif resolution_strategy == "remote_wins":
                    merged_version = remote_version + 1
                    resolution_method = "remote_priority"
                    data_preserved = False  # Local changes discarded
                else:  # manual
                    merged_version = max(local_version, remote_version)
                    resolution_method = "manual_review_required"
                    conflict_resolved = False
                
                return {
                    "conflict_resolved": conflict_resolved,
                    "resolution_method": resolution_method,
                    "merged_version": merged_version,
                    "data_preserved": data_preserved,
                    "resolution_timestamp": datetime.datetime.utcnow().isoformat()
                }

