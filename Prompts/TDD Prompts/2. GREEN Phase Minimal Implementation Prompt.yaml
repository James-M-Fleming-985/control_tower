          description: "Get real-time status of executing command"
          parameters:
            command_id:
              type: "str"
              description: "Command execution ID"
          returns:
            type: "Dict[str, Any]"
            fields:
              - "command_id: str"
              - "status: str" # acknowledged, executing, completed, failed
              - "progress_percentage: float" # 0.0 to 100.0
              - "result: Optional[Dict]" # Command result if completed
          implementation_notes:
            - "Look up command status in execution tracker"
            - "Return current execution state and progress"
            - "Include result data if command completed"
            - "Support real-time polling or WebSocket streaming"
          example_implementation: |
            def get_command_status(self, command_id):
                if command_id not in self._command_queue:
                    raise ValueError(f"Command {command_id} not found")
                
                command = self._command_queue[command_id]
                return {
                    "command_id": command_id,
                    "status": command["status"],
                    "progress_percentage": command.get("progress", 0.0),
                    "result": command.get("result")
                }

