            component_b_version:
              type: "str"
              description: "Component B version"
          returns:
            type: "Dict[str, Any]"
            fields:
              - "compatible: bool"
              - "compatibility_score: float" # 0.0 to 1.0, must be >= 0.98
              - "issues: List[str]" # Compatibility issues if any
          implementation_notes:
            - "Parse semantic version numbers"
            - "Check version compatibility matrix"
            - "Identify API breaking changes"
            - "Calculate compatibility score (98%+ for compatible)"
          example_implementation: |
            from packaging import version
            
            def analyze_compatibility(self, component_a_version, component_b_version):
                ver_a = version.parse(component_a_version)
                ver_b = version.parse(component_b_version)
                
                # Simple compatibility logic (major version must match)
                compatible = ver_a.major == ver_b.major
                
                # Calculate compatibility score
                if compatible:
                    # Minor version differences reduce score slightly
                    minor_diff = abs(ver_a.minor - ver_b.minor)
                    score = 1.0 - (minor_diff * 0.01)  # 1% penalty per minor version
                else:
                    score = 0.0
                
                issues = []
                if not compatible:
                    issues.append(f"Major version mismatch: {ver_a.major} vs {ver_b.major}")
                
                return {
                    "compatible": compatible and score >= 0.98,
                    "compatibility_score": max(score, 0.0),
                    "issues": issues
                }

        detect_conflicts:
          description: "Detect integration conflicts between components"
          parameters:
            components:
              type: "List[Dict[str, Any]]"
              description: "List of component specifications"
          returns:
            type: "Dict[str, Any]"
            fields:
              - "conflicts_detected: bool"
              - "conflict_details: List[Dict]" # List of conflict descriptions
              - "resolution_suggestions: List[str]" # Suggested resolutions
          implementation_notes:
            - "Check for duplicate resource definitions"
            - "Identify conflicting dependencies"
            - "Detect incompatible configuration requirements"
            - "Provide conflict resolution suggestions"
          example_implementation: |
            def detect_conflicts(self, components):
                conflicts = []
                suggestions = []
                
                # Check for port conflicts
                ports = {}
                for comp in components:
                    port = comp.get("port")
                    if port:
                        if port in ports:
                            conflicts.append({
                                "type": "port_conflict",
                                "components": [ports[port], comp["name"]],
                                "port": port
                            })
                            suggestions.append(f"Change port for {comp['name']}")
                        else:
                            ports[port] = comp["name"]
                
                # Check for dependency conflicts
                deps = {}
                for comp in components:
                    for dep_name, dep_ver in comp.get("dependencies", {}).items():
                        if dep_name in deps and deps[dep_name] != dep_ver:
                            conflicts.append({
                                "type": "dependency_conflict",
                                "dependency": dep_name,
                                "versions": [deps[dep_name], dep_ver]
                            })
                            suggestions.append(f"Align {dep_name} version across components")
                        else:
                            deps[dep_name] = dep_ver
                
                return {
                    "conflicts_detected": len(conflicts) > 0,
                    "conflict_details": conflicts,
                    "resolution_suggestions": suggestions
                }

        validate_compatibility_performance:
          description: "Validate compatibility analysis meets <30s target"
          parameters: {}
          returns:
            type: "Dict[str, Any]"
            fields:
              - "analysis_time: float" # Must be < 30s
              - "meets_target: bool" # Must be True
          implementation_notes:
            - "Execute compatibility analysis for 10 component pairs"
            - "Measure total analysis time"
            - "Validate completion within 30 seconds"
          example_implementation: |
            def validate_compatibility_performance(self):
                start = time.time()
                
                # Analyze 10 component pairs
                for i in range(10):
                    self.analyze_compatibility(f"1.{i}.0", f"1.{i+1}.0")
                
                analysis_time = time.time() - start
                return {
                    "analysis_time": analysis_time,
                    "meets_target": analysis_time < 30.0
                }

