critical_changes:
  
  # --------------------------------------------------------------------------
  # CHANGE 1: Import AI Provider Abstraction (REQ-ORCH-INT-001)
  # --------------------------------------------------------------------------
  import_statements:
    priority: "PHASE 1: FOUNDATION"
    file_path: "src/layer/orchestrator/ai_code_generator_orchestrator.py"
    requirement: "REQ-ORCH-INT-001: Initialize AI Provider from Config"
    impact: "Enables AI provider factory access"
    
    failing_tests:
      - "test_orchestrator_initializes_ai_provider_from_config"
      - "test_orchestrator_validates_provider_configuration"
      - "test_orchestrator_fails_with_invalid_provider_type"
    
    current_imports: |
      from pathlib import Path
      from typing import Dict, Any, List, Optional
      from datetime import datetime, timezone
      import yaml
    
    required_additions: |
      # Add these imports:
      import sys
      from pathlib import Path as PathLib
      
      # Add src to path for AI provider import
      project_root = Path(__file__).parent.parent.parent
      if str(project_root) not in sys.path:
          sys.path.insert(0, str(project_root))
      
      # Import AI Provider Abstraction Layer
      from src.layer.ai_provider_abstraction import AIProviderFactory
      
      # Import subprocess for pytest execution
      import subprocess
    
    validation:
      how_tests_verify: "Mock patch 'src.layer.orchestrator.ai_code_generator_orchestrator.AIProviderFactory'"
      cannot_fake_because: "Patch requires attribute to exist in module"
  
  # --------------------------------------------------------------------------
  # CHANGE 2: Initialize AI Provider in Constructor (REQ-ORCH-INT-001)
  # --------------------------------------------------------------------------
  constructor_changes:
    priority: "PHASE 1: FOUNDATION"
    method: "__init__"
    requirement: "REQ-ORCH-INT-001"
    
    current_implementation: |
      def __init__(self, config: Dict[str, Any]):
          self.config = config
          self.current_phase: Optional[str] = None
          self.phase_results: Dict[str, Any] = {}
    
    required_implementation: |
      def __init__(self, config: Dict[str, Any]):
          self.config = config
          self.current_phase: Optional[str] = None
          self.phase_results: Dict[str, Any] = {}
          
          # NEW: Initialize AI Provider
          provider_type = config.get('provider', 'anthropic')
          
          # Validate provider type
          supported_providers = ['anthropic', 'openai']
          if provider_type not in supported_providers:
              raise ValueError(
                  f"Unsupported provider type: {provider_type}. "
                  f"Supported providers: {', '.join(supported_providers)}"
              )
          
          # Create AI provider instance
          self.ai_provider = AIProviderFactory.create_provider(provider_type)
          
          # Validate configuration
          if not self.ai_provider.validate_configuration():
              raise ValueError(
                  f"AI provider '{provider_type}' is not properly configured. "
                  f"Please set {provider_type.upper()}_API_KEY environment variable."
              )
    
    validation:
      test_1: "test_orchestrator_initializes_ai_provider_from_config"
      verifies: "mock_factory.create_provider.assert_called_once_with('anthropic')"
      
      test_2: "test_orchestrator_validates_provider_configuration"
      verifies: "mock_provider.validate_configuration.assert_called_once()"
      
      test_3: "test_orchestrator_fails_with_invalid_provider_type"
      verifies: "pytest.raises(ValueError, match='Unsupported provider type')"
  
  # --------------------------------------------------------------------------
  # CHANGE 3: RED Phase AI Integration (REQ-ORCH-INT-002)
  # --------------------------------------------------------------------------
  red_phase_changes:
    priority: "PHASE 2: TEST GENERATION"
    method: "execute_red_phase"
    requirement: "REQ-ORCH-INT-002: Generate Tests Using AI Provider"
    
    failing_tests:
      - "test_red_phase_calls_ai_provider_for_test_generation"
      - "test_red_phase_writes_generated_tests_to_files"
      - "test_red_phase_executes_generated_tests_with_pytest"
    
    current_stub: |
      def execute_red_phase(self, requirements: Dict[str, Any]) -> Dict[str, Any]:
          self.current_phase = 'RED'
          result = {
              'phase': 'RED',
              'status': 'PASS',
              'tests_generated': [],
              'tests_failed': 0
          }
          ac_list = requirements.get('acceptance_criteria', [])
          test_count = len(ac_list) * 2
          result['tests_generated'] = [f"test_file_{i}.py" for i in range(test_count)]  # FAKE!
          result['tests_failed'] = test_count
          return result
    
    required_implementation: |
      def execute_red_phase(self, requirements: Dict[str, Any]) -> Dict[str, Any]:
          """Execute RED phase: Generate tests that should fail."""
          self.current_phase = 'RED'
          
          # Build prompt for test generation
          ac_list = requirements.get('acceptance_criteria', [])
          prompt = self._build_test_generation_prompt(requirements, ac_list)
          
          # REAL: Call AI provider to generate test code
          test_code = self.ai_provider.generate_code(prompt)
          
          # REAL: Write test code to files
          output_base = Path(self.config['output_base_path'])
          test_dir = output_base / 'tests'
          test_dir.mkdir(parents=True, exist_ok=True)
          
          # Create test file with timestamp
          timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
          test_file = test_dir / f'test_generated_{timestamp}.py'
          test_file.write_text(test_code)
          
          # REAL: Execute pytest
          pytest_result = subprocess.run(
              ['python', '-m', 'pytest', str(test_file), '-v'],
              capture_output=True,
              text=True,
              cwd=str(output_base)
          )
          
          # Return REAL results
          result = {
              'phase': 'RED',
              'status': 'PASS',
              'tests_generated': [str(test_file)],
              'tests_failed': pytest_result.returncode,  # Non-zero = tests failed
              'pytest_output': pytest_result.stdout + pytest_result.stderr
          }
          
          self.phase_results['RED'] = result
          return result
    
    helper_method_required: |
      def _build_test_generation_prompt(
          self,
          requirements: Dict[str, Any],
          acceptance_criteria: List[Dict[str, Any]]
      ) -> str:
          """Build prompt for AI to generate test code."""
          prompt = f"""Generate pytest test code for the following requirements:

      Layer: {requirements.get('layer_id', 'UNKNOWN')}
      Feature: {requirements.get('feature_name', 'UNKNOWN')}

      Acceptance Criteria:
      """
          for i, ac in enumerate(acceptance_criteria, 1):
              criterion = ac.get('criterion', ac.get('description', 'No description'))
              prompt += f"\n{i}. {criterion}"
          
          prompt += """

      Generate a complete Python test file with:
      - Import statements (pytest, unittest.mock, etc.)
      - Test class for each acceptance criterion
      - At least 2 test methods per criterion
      - Tests should initially FAIL (RED phase requirement)
      - Use pytest.raises() for expected failures
      - Include docstrings

      Output only valid Python code, no explanations.
      """
          return prompt
    
    validation:
      test_1_verification: "assert mock_provider.generate_code.called"
      test_2_verification: "test_files = list(Path(tmpdir).glob('**/test_*.py')); assert len(test_files) > 0"
      test_3_verification: "assert mock_run.called  # subprocess.run for pytest"
      
      anti_pattern_protection:
        cannot_fake_test_2: "Uses Path.glob() on actual filesystem"
        cannot_fake_test_3: "Mocks subprocess.run and verifies it was called"
  
  # --------------------------------------------------------------------------
  # CHANGE 4: GREEN Phase AI Integration (REQ-ORCH-INT-003)
  # --------------------------------------------------------------------------
  green_phase_changes:
    priority: "PHASE 3: IMPLEMENTATION GENERATION"
    method: "execute_green_phase"
    requirement: "REQ-ORCH-INT-003: Generate Implementation Using AI Provider"
    
    failing_tests:
      - "test_green_phase_calls_ai_provider_for_implementation"
      - "test_green_phase_writes_implementation_to_src_files"
      - "test_green_phase_reruns_tests_and_verifies_passing"
    
    required_implementation: |
      def execute_green_phase(
          self,
          requirements: Dict[str, Any],
          red_results: Dict[str, Any]
      ) -> Dict[str, Any]:
          """Execute GREEN phase: Generate implementation to pass tests."""
          self.current_phase = 'GREEN'
          
          # Build prompt for implementation generation
          prompt = self._build_implementation_prompt(requirements, red_results)
          
          # REAL: Call AI provider to generate implementation
          impl_code = self.ai_provider.generate_code(prompt)
          
          # REAL: Write implementation to src/ directory
          output_base = Path(self.config['output_base_path'])
          src_dir = output_base / 'src'
          src_dir.mkdir(parents=True, exist_ok=True)
          
          # Determine filename from requirements
          layer_id = requirements.get('layer_id', 'implementation')
          impl_file = src_dir / f'{layer_id.lower().replace("-", "_")}.py'
          impl_file.write_text(impl_code)
          
          # REAL: Rerun tests to verify they pass
          test_files = red_results.get('tests_generated', [])
          if test_files:
              pytest_result = subprocess.run(
                  ['python', '-m', 'pytest'] + test_files + ['-v', '--cov=src'],
                  capture_output=True,
                  text=True,
                  cwd=str(output_base)
              )
              
              tests_passed = 0 if pytest_result.returncode == 0 else pytest_result.returncode
              coverage = self._extract_coverage_from_output(pytest_result.stdout)
          else:
              tests_passed = 0
              coverage = 0.0
          
          result = {
              'phase': 'GREEN',
              'status': 'PASS' if pytest_result.returncode == 0 else 'FAIL',
              'implementation_generated': [str(impl_file)],
              'tests_passed': tests_passed,
              'coverage': coverage,
              'pytest_output': pytest_result.stdout + pytest_result.stderr
          }
          
          self.phase_results['GREEN'] = result
          return result
    
    helper_methods_required: |
      def _build_implementation_prompt(
          self,
          requirements: Dict[str, Any],
          red_results: Dict[str, Any]
      ) -> str:
          """Build prompt for AI to generate implementation code."""
          prompt = f"""Generate Python implementation code to make the following tests pass:

      Layer: {requirements.get('layer_id', 'UNKNOWN')}
      Tests Failed: {red_results.get('tests_failed', 0)}
      Test Files: {', '.join(red_results.get('tests_generated', []))}

      Requirements:
      """
          for ac in requirements.get('acceptance_criteria', []):
              criterion = ac.get('criterion', ac.get('description', ''))
              prompt += f"\n- {criterion}"
          
          prompt += """

      Generate complete, working Python implementation that:
      - Makes all tests pass
      - Follows best practices
      - Includes proper error handling
      - Has clear docstrings
      - Is production-ready code

      Output only valid Python code, no explanations.
      """
          return prompt
      
      def _extract_coverage_from_output(self, pytest_output: str) -> float:
          """Extract coverage percentage from pytest output."""
          import re
          match = re.search(r'TOTAL\s+\d+\s+\d+\s+(\d+)%', pytest_output)
          if match:
              return float(match.group(1)) / 100.0
          return 0.0
    
    validation:
      test_1_verification: "assert mock_provider.generate_code.called"
      test_2_verification: "src_files = list(Path(tmpdir).glob('**/src/**/*.py')); assert len(src_files) > 0"
      test_3_verification: "assert mock_run.called  # pytest rerun"
  
  # --------------------------------------------------------------------------
  # CHANGE 5: Verification Report Generation (REQ-ORCH-INT-004)
  # --------------------------------------------------------------------------
  verification_changes:
    priority: "PHASE 4: REPORTING"
    method: "generate_all_reports"
    requirement: "REQ-ORCH-INT-004: Generate Verification Reports"
    
    failing_tests:
      - "test_generate_all_reports_creates_yaml_files"
      - "test_verification_reports_contain_actual_evidence"
    
    required_implementation: |
      def generate_all_reports(
          self,
          phases: Dict[str, Any],
          requirements: Dict[str, Any]
      ) -> List[Path]:
          """Generate comprehensive verification reports."""
          output_base = Path(self.config['output_base_path'])
          report_dir = output_base / 'Requirements Verification'
          report_dir.mkdir(parents=True, exist_ok=True)
          
          timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
          reports = []
          
          # 1. Requirements Verification Report
          req_report = self._generate_requirements_verification(
              report_dir, timestamp, phases, requirements
          )
          reports.append(req_report)
          
          # 2. Test Pyramid Report
          pyramid_report = self._generate_test_pyramid_report(
              report_dir, timestamp, phases
          )
          reports.append(pyramid_report)
          
          # 3. Traceability Matrix
          trace_report = self._generate_traceability_matrix(
              report_dir, timestamp, requirements, phases
          )
          reports.append(trace_report)
          
          # 4. Quality Gates Report
          quality_report = self._generate_quality_gates_report(
              report_dir, timestamp, phases
          )
          reports.append(quality_report)
          
          return reports
      
      def _generate_requirements_verification(
          self,
          report_dir: Path,
          timestamp: str,
          phases: Dict[str, Any],
          requirements: Dict[str, Any]
      ) -> Path:
          """Generate requirements verification YAML report."""
          report_file = report_dir / f'requirements_verification_{timestamp}.yaml'
          
          red_phase = phases.get('RED', {})
          green_phase = phases.get('GREEN', {})
          
          report_data = {
              'layer_metadata': {
                  'requirement_id': requirements.get('layer_id', 'UNKNOWN'),
                  'timestamp': timestamp,
                  'feature_name': requirements.get('feature_name', 'UNKNOWN')
              },
              'test_verification': {
                  'total_tests': green_phase.get('tests_passed', 0),
                  'tests_passed': green_phase.get('tests_passed', 0),
                  'tests_failed': red_phase.get('tests_failed', 0),
                  'coverage': green_phase.get('coverage', 0.0)
              },
              'acceptance_criteria_verification': [
                  {
                      'criterion_id': ac.get('criterion_id', f'AC-{i:03d}'),
                      'criterion': ac.get('criterion', ''),
                      'status': 'VERIFIED'
                  }
                  for i, ac in enumerate(requirements.get('acceptance_criteria', []), 1)
              ],
              'artifacts': {
                  'tests': red_phase.get('tests_generated', []),
                  'implementation': green_phase.get('implementation_generated', [])
              }
          }
          
          report_file.write_text(yaml.dump(report_data, default_flow_style=False))
          return report_file
      
      def _generate_test_pyramid_report(
          self,
          report_dir: Path,
          timestamp: str,
          phases: Dict[str, Any]
      ) -> Path:
          """Generate test pyramid report."""
          report_file = report_dir / f'test_pyramid_report_{timestamp}.yaml'
          
          report_data = {
              'timestamp': timestamp,
              'pyramid_structure': {
                  'unit_tests': 0,  # Analyze test files to categorize
                  'integration_tests': 0,
                  'e2e_tests': 0
              },
              'total_tests': phases.get('GREEN', {}).get('tests_passed', 0)
          }
          
          report_file.write_text(yaml.dump(report_data, default_flow_style=False))
          return report_file
      
      def _generate_traceability_matrix(
          self,
          report_dir: Path,
          timestamp: str,
          requirements: Dict[str, Any],
          phases: Dict[str, Any]
      ) -> Path:
          """Generate traceability matrix."""
          report_file = report_dir / f'traceability_matrix_{timestamp}.yaml'
          
          report_data = {
              'timestamp': timestamp,
              'requirement_to_test_mapping': [
                  {
                      'requirement': ac.get('criterion', ''),
                      'tests': phases.get('RED', {}).get('tests_generated', [])
                  }
                  for ac in requirements.get('acceptance_criteria', [])
              ]
          }
          
          report_file.write_text(yaml.dump(report_data, default_flow_style=False))
          return report_file
      
      def _generate_quality_gates_report(
          self,
          report_dir: Path,
          timestamp: str,
          phases: Dict[str, Any]
      ) -> Path:
          """Generate quality gates report."""
          report_file = report_dir / f'quality_gates_report_{timestamp}.yaml'
          
          coverage = phases.get('GREEN', {}).get('coverage', 0.0)
          tests_passed = phases.get('GREEN', {}).get('tests_passed', 0)
          
          report_data = {
              'timestamp': timestamp,
              'quality_gates': {
                  'coverage_threshold': 0.95,
                  'actual_coverage': coverage,
                  'coverage_pass': coverage >= 0.95,
                  'all_tests_pass': tests_passed > 0
              },
              'overall_status': 'PASS' if coverage >= 0.95 and tests_passed > 0 else 'FAIL'
          }
          
          report_file.write_text(yaml.dump(report_data, default_flow_style=False))
          return report_file
    
    validation:
      test_1_verification: "yaml_files = list(report_dir.glob('*.yaml')); assert len(yaml_files) > 0"
      test_2_verification: "report_data = yaml.safe_load(report_file.read_text()); assert report_data['layer_metadata']['requirement_id'] == 'LAYER-TEST-01'"
      
      anti_pattern_protection:
        cannot_fake: "Tests read actual YAML files from disk and parse them"

