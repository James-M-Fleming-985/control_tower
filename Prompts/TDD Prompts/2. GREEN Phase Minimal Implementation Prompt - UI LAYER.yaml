# ============================================================================
# CRITICAL COMPONENT - TerminalUI Class with 6 Display Methods
# ============================================================================

critical_component:
  # --------------------------------------------------------------------------
  # TerminalUI Class - Display pyramid validation results to terminal
  # --------------------------------------------------------------------------
  terminal_ui:
    priority: "PHASE 1: TERMINAL DISPLAY IMPLEMENTATION"
    file_path: "/workspaces/control_tower/projects/PROJECT-003 TDD ENFORCER/src/user_interface/terminal_ui.py"
    status: "STUB EXISTS - NEEDS IMPLEMENTATION"
    requirement_coverage: "REQ-UI-001 through REQ-UI-006 (all 6 UI requirements)"
    impact: "Enables terminal-based display of pyramid validation results"

    failing_tests:
      - "test_display_counts_all_levels"
      - "test_display_counts_with_zeros"
      - "test_display_counts_formatting"
      - "test_display_ratios_percentages"
      - "test_display_ratios_proper_pyramid"
      - "test_display_ratios_inverted_pyramid"
      - "test_display_pass_rates_all_passing"
      - "test_display_pass_rates_with_failures"
      - "test_display_pass_rates_below_threshold"
      - "test_display_compliant_status"
      - "test_display_non_compliant_status"
      - "test_display_compliance_with_multiple_failures"
      - "test_display_warning_inverted_pyramid"
      - "test_display_no_warning_proper_pyramid"
      - "test_display_warning_formatting"
      - "test_display_recommendations_for_inverted_pyramid"
      - "test_display_recommendations_for_low_pass_rates"
      - "test_display_recommendations_for_minimum_counts"

    minimal_implementation:
      description: "Display pyramid validation results to terminal using simple print() statements"
      class_name: "TerminalUI"
      purpose: "Format and display pyramid validation data in human-readable terminal output"

      constructor:
        parameters: {}
        initialization:
          - "No initialization required - all methods are stateless"
          - "No external connections needed"
          - "No configuration required"

      required_methods:
        # METHOD 1: Display Test Counts (REQ-UI-001)
        display_test_counts:
          signature: "def display_test_counts(self, test_counts: Dict[str, int]) -> None"
          requirement: "REQ-UI-001"
          description: "Display test counts by pyramid level (Unit/Integration/E2E)"
          parameters:
            test_counts:
              type: "Dict[str, int]"
              description: "Dictionary with keys 'Unit', 'Integration', 'E2E' and integer counts"
              example: {"Unit": 70, "Integration": 20, "E2E": 10}
          returns:
            type: "None"
            description: "Prints to stdout"
          implementation_approach:
            - "Print section header 'TEST COUNTS:'"
            - "Print each level with count: '  Unit Tests:        70'"
            - "Calculate and print total count"
            - "Use consistent alignment for readability"
          example_implementation: |
            def display_test_counts(self, test_counts: Dict[str, int]) -> None:
                print("TEST COUNTS:")
                print(f"  Unit Tests:        {test_counts.get('Unit', 0)}")
                print(f"  Integration Tests: {test_counts.get('Integration', 0)}")
                print(f"  E2E Tests:         {test_counts.get('E2E', 0)}")
                total = sum(test_counts.values())
                print(f"  Total:             {total}")
          edge_cases:
            - "Handle missing keys gracefully with get(key, 0)"
            - "Handle zero counts (display as 0)"
            - "Handle empty dictionary (all zeros)"

        # METHOD 2: Display Pyramid Ratios (REQ-UI-002)
        display_pyramid_ratios:
          signature: "def display_pyramid_ratios(self, ratios: Dict[str, float]) -> None"
          requirement: "REQ-UI-002"
          description: "Display pyramid ratios as percentages"
          parameters:
            ratios:
              type: "Dict[str, float]"
              description: "Dictionary with pyramid level percentages"
              example: {"Unit": 70.0, "Integration": 20.0, "E2E": 10.0}
          returns:
            type: "None"
            description: "Prints to stdout"
          implementation_approach:
            - "Print section header 'PYRAMID RATIOS:'"
            - "Print each level with percentage: '  Unit:        70.0%'"
            - "Format percentages to 1 decimal place"
            - "Align output for readability"
          example_implementation: |
            def display_pyramid_ratios(self, ratios: Dict[str, float]) -> None:
                print("PYRAMID RATIOS:")
                print(f"  Unit:        {ratios.get('Unit', 0.0):.1f}%")
                print(f"  Integration: {ratios.get('Integration', 0.0):.1f}%")
                print(f"  E2E:         {ratios.get('E2E', 0.0):.1f}%")
          edge_cases:
            - "Handle missing keys with get(key, 0.0)"
            - "Format percentages consistently (:.1f)"
            - "Handle proper pyramid (70:20:10) and inverted pyramid (10:20:70)"

        # METHOD 3: Display Pass Rates (REQ-UI-003)
        display_pass_rates:
          signature: "def display_pass_rates(self, pass_rates: Dict[str, float]) -> None"
          requirement: "REQ-UI-003"
          description: "Display pass rates for each pyramid level"
          parameters:
            pass_rates:
              type: "Dict[str, float]"
              description: "Dictionary with pass rate percentages per level"
              example: {"Unit": 95.0, "Integration": 90.0, "E2E": 85.0}
          returns:
            type: "None"
            description: "Prints to stdout"
          implementation_approach:
            - "Print section header 'PASS RATES:'"
            - "Print each level with pass rate percentage"
            - "Optionally add checkmark (✓) for rates ≥80%"
            - "Format percentages to 1 decimal place"
          example_implementation: |
            def display_pass_rates(self, pass_rates: Dict[str, float]) -> None:
                print("PASS RATES:")
                for level in ["Unit", "Integration", "E2E"]:
                    rate = pass_rates.get(level, 0.0)
                    check = "✓" if rate >= 80.0 else "✗"
                    print(f"  {level:12} {rate:5.1f}% {check}")
          edge_cases:
            - "Handle missing keys with get(key, 0.0)"
            - "Handle 100% pass rates"
            - "Handle 0% pass rates"
            - "Optional: Highlight rates below threshold"

        # METHOD 4: Display Compliance Status (REQ-UI-004)
        display_compliance_status:
          signature: "def display_compliance_status(self, compliance_result: Dict[str, Any]) -> None"
          requirement: "REQ-UI-004"
          description: "Display overall compliance status (pass/fail with reasons)"
          parameters:
            compliance_result:
              type: "Dict[str, Any]"
              description: "Compliance result with is_compliant flag and reasons list"
              example:
                passing: {"is_compliant": true, "reasons": ["All validations passed"]}
                failing: {"is_compliant": false, "reasons": ["Pyramid shape invalid", "Minimum test counts not met"]}
          returns:
            type: "None"
            description: "Prints to stdout"
          implementation_approach:
            - "Print section header with status (PASSING/FAILING)"
            - "Print each reason with appropriate prefix (✓ or ✗)"
            - "Display all reasons from list"
            - "Clear visual distinction between passing and failing"
          example_implementation: |
            def display_compliance_status(self, compliance_result: Dict[str, Any]) -> None:
                is_compliant = compliance_result.get("is_compliant", False)
                reasons = compliance_result.get("reasons", [])
                
                status = "✓ PASSING" if is_compliant else "✗ FAILING"
                print(f"COMPLIANCE STATUS: {status}")
                
                prefix = "  ✓" if is_compliant else "  ✗"
                for reason in reasons:
                    print(f"{prefix} {reason}")
          edge_cases:
            - "Handle empty reasons list"
            - "Handle multiple reasons (3+)"
            - "Handle missing is_compliant key (default False)"

        # METHOD 5: Display Pyramid Shape Warning (REQ-UI-005)
        display_pyramid_shape_warning:
          signature: "def display_pyramid_shape_warning(self, is_inverted: bool) -> None"
          requirement: "REQ-UI-005"
          description: "Display warning if pyramid shape is inverted"
          parameters:
            is_inverted:
              type: "bool"
              description: "True if pyramid is inverted (more E2E than Unit tests)"
          returns:
            type: "None"
            description: "Prints to stdout"
          implementation_approach:
            - "If inverted, print warning message"
            - "If not inverted, print no warning (or success message)"
            - "Use clear visual indicator (⚠ or WARNING:)"
            - "Keep message concise and actionable"
          example_implementation: |
            def display_pyramid_shape_warning(self, is_inverted: bool) -> None:
                if is_inverted:
                    print("⚠ WARNING: Inverted Pyramid Detected!")
                    print("  Your test suite has more E2E tests than Unit tests.")
                    print("  Consider adding more unit tests for better maintainability.")
                else:
                    print("✓ Pyramid shape is healthy")
          edge_cases:
            - "Handle is_inverted=True (display warning)"
            - "Handle is_inverted=False (no warning or success message)"

        # METHOD 6: Display Recommendations (REQ-UI-006)
        display_recommendations:
          signature: "def display_recommendations(self, validation_context: Dict[str, Any]) -> None"
          requirement: "REQ-UI-006"
          description: "Display actionable recommendations for improvement"
          parameters:
            validation_context:
              type: "Dict[str, Any]"
              description: "Validation context with pyramid validity flags and test data"
              example:
                inverted_pyramid: {"pyramid_valid": false, "test_counts": {"Unit": 10, "Integration": 20, "E2E": 30}}
                low_pass_rates: {"pass_rates_valid": false, "pass_rates": {"Unit": 60.0, "Integration": 50.0, "E2E": 40.0}}
                low_counts: {"minimum_counts_valid": false, "test_counts": {"Unit": 5, "Integration": 2, "E2E": 1}}
          returns:
            type: "None"
            description: "Prints to stdout"
          implementation_approach:
            - "Print section header 'RECOMMENDATIONS:'"
            - "Analyze validation_context to determine issues"
            - "Generate specific, actionable recommendations"
            - "Prioritize recommendations (most critical first)"
          example_implementation: |
            def display_recommendations(self, validation_context: Dict[str, Any]) -> None:
                print("RECOMMENDATIONS:")
                
                # Check for inverted pyramid
                if not validation_context.get("pyramid_valid", True):
                    print("  1. Add more unit tests to fix inverted pyramid")
                    print("     - Aim for 70% unit, 20% integration, 10% E2E")
                
                # Check for low pass rates
                if not validation_context.get("pass_rates_valid", True):
                    pass_rates = validation_context.get("pass_rates", {})
                    print("  2. Fix failing tests to improve pass rates")
                    for level, rate in pass_rates.items():
                        if rate < 80.0:
                            print(f"     - {level}: {rate:.1f}% (target: ≥80%)")
                
                # Check for minimum counts
                if not validation_context.get("minimum_counts_valid", True):
                    print("  3. Add more tests to meet minimum requirements")
                    print("     - Minimum: 10 unit, 5 integration, 2 E2E tests")
          edge_cases:
            - "Handle multiple validation failures"
            - "Handle single validation failure"
            - "Handle no issues (all validations pass)"
            - "Handle missing validation_context keys"

