test_updates:
  description: "Tests must be updated from RED phase (expecting NotImplementedError) to GREEN phase (verifying output)"
  approach: "Use pytest capsys fixture to capture stdout and verify printed content"
  
  red_phase_test_pattern: |
    def test_display_counts_all_levels(self):
        ui = TerminalUI()
        test_counts = {"Unit": 50, "Integration": 20, "E2E": 10}
        
        with pytest.raises(NotImplementedError):
            ui.display_test_counts(test_counts)
  
  green_phase_test_pattern: |
    def test_display_counts_all_levels(self, capsys):
        ui = TerminalUI()
        test_counts = {"Unit": 50, "Integration": 20, "E2E": 10}
        
        ui.display_test_counts(test_counts)
        
        captured = capsys.readouterr()
        assert "Unit" in captured.out
        assert "50" in captured.out
        assert "Integration" in captured.out
        assert "20" in captured.out
        assert "E2E" in captured.out
        assert "10" in captured.out
  
  required_changes:
    - "Add capsys parameter to all test methods"
    - "Remove pytest.raises(NotImplementedError) wrapper"
    - "Call display methods directly"
    - "Capture output with capsys.readouterr()"
    - "Assert expected strings in captured.out"
    - "Verify key data appears in output (counts, percentages, messages)"

