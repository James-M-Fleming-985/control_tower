    execution_command: "python -m pytest {test_directory}/test_contextual_pyramid_ui.py -v"
    scope_validation: "LAYER_ONLY - No repository-wide execution"
    expected_test_count: 24
    prevention_measures:
      - "Use specific file path, not directory recursion"
