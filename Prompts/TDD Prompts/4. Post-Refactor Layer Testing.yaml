        - scenario: "Network interruption mid-workflow"
          expected: "Workflow resumes from last checkpoint"
        
        - scenario: "Session expires during validation"
          expected: "Validation aborted, re-authentication required"
    
    multi_user_context_workflow:
      test_file: "test_multi_user_context_workflow_e2e.py"
      services: ["context_engine_service", "security_protocol_service"]
      repositories: ["ContextEngineRepository", "AuditTrailRepository"]
      focus: "Multiple users with concurrent context operations"
      
      workflow_steps:
        1_user_a_creates_context:
          description: "User A initializes context"
          action: "process_context_changes(user_a, changes_a)"
          assertion: "Context A created"
        
        2_user_b_creates_context:
          description: "User B initializes context"
          action: "process_context_changes(user_b, changes_b)"
          assertion: "Context B created independently"
        
        3_user_a_updates_context:
          description: "User A updates their context"
          action: "process_context_changes(user_a, updates_a)"
          assertion: "Context A updated, version 2"
        
        4_user_b_updates_context:
          description: "User B updates their context"
          action: "process_context_changes(user_b, updates_b)"
          assertion: "Context B updated, version 2"
        
        5_concurrent_updates:
          description: "Both users update simultaneously"
          action: "Concurrent process_context_changes calls"
          assertion: "Both updates succeed, no conflicts"
        
        6_context_isolation:
          description: "Verify context isolation"
          action: "Retrieve context_a and context_b"
          assertion: "Contexts separate, no data leakage"
      
      end_to_end_assertions:
