          - "Trend direction detected (improving/stable/degrading)"
          - "Alerts sorted by severity"
          - "Real-time metrics refreshed"
        test_file: "test_performance_dashboard_integration.py"

    ui_to_data_access:
      description: "Test UI component interactions with data access layer"
      
      scenario_1_mobile_ui_data_access:
        name: "Mobile UI ↔ Mobile Command History Repository"
        components:
          ui: "mobile_ui_components.py"
          data_access: "mobile_command_history_repository.py"
        test_flow:
          - step: "UI requests mobile dashboard data"
          - step: "Repository retrieves command history"
          - step: "UI receives command list with sync status"
          - step: "UI displays touch-optimized controls"
        assertions:
          - "Command history retrieved correctly"
          - "Offline sync status accurate"
          - "Touch controls responsive"
          - "Data persistence verified"
        test_file: "test_mobile_ui_data_access_integration.py"
          
      scenario_2_pyramid_ui_data_access:
        name: "Pyramid UI ↔ Test Repository"
        components:
          ui: "contextual_pyramid_ui.py"
          data_access: "test_repository.py"
        test_flow:
          - step: "UI requests pyramid validation results"
          - step: "Repository retrieves test metadata"
          - step: "UI receives test coverage data"
          - step: "UI renders pyramid visualization"
        assertions:
          - "Test metadata retrieved"
          - "Coverage calculations correct"
          - "Pyramid layers displayed"
          - "Test results aggregated"
        test_file: "test_pyramid_ui_data_access_integration.py"

    end_to_end_workflows:
      description: "Test complete user workflows spanning all three layers"
      
      workflow_1_tdd_cycle_execution:
        name: "Complete TDD Cycle (RED → GREEN → REFACTOR)"
        layers_involved:
          - "User Interface: tdd_workflow_interface.py"
          - "Business Logic: tdd_cycle_enforcer.py"
          - "Data Access: tdd_phase_repository.py"
        test_flow:
          - step: "User initiates RED phase via UI"
          - step: "UI calls business logic to enforce RED phase rules"
          - step: "Business logic validates phase transition"
          - step: "Data access persists phase state"
          - step: "UI displays RED phase status"
          - step: "User executes tests (failing)"
          - step: "User transitions to GREEN phase via UI"
          - step: "Business logic enforces GREEN phase rules"
          - step: "Data access updates phase state"
          - step: "UI displays GREEN phase status"
          - step: "User implements minimal code"
          - step: "User executes tests (passing)"
          - step: "User transitions to REFACTOR phase via UI"
          - step: "Business logic enforces REFACTOR phase rules"
          - step: "Data access updates phase state"
          - step: "UI displays REFACTOR phase status"
        assertions:
          - "Phase transitions follow TDD rules"
          - "UI reflects current phase accurately"
          - "Test execution results displayed"
          - "Phase history tracked"
          - "Enforcement rules applied"
        test_file: "test_tdd_cycle_end_to_end.py"
          
      workflow_2_security_audit_trail:
        name: "Security Event Monitoring and Audit"
        layers_involved:
          - "User Interface: security_dashboard_interface.py"
          - "Business Logic: security_protocol_service.py"
          - "Data Access: (audit storage)"
        test_flow:
          - step: "Security event occurs (data access attempt)"
          - step: "Business logic audits security event"
          - step: "Business logic validates access permissions"
          - step: "Data access stores audit record"
          - step: "UI requests security overview"
          - step: "Business logic retrieves audit trail"
          - step: "UI displays threat matrix and compliance status"
        assertions:
          - "Audit trail complete"
          - "Access permissions enforced"
          - "Compliance status accurate"
          - "Threat matrix displays active threats"
          - "Security metrics aggregated correctly"
        test_file: "test_security_audit_end_to_end.py"
          
      workflow_3_performance_monitoring:
        name: "Real-Time Performance Monitoring"
        layers_involved:
          - "User Interface: performance_monitoring_dashboard.py"
          - "Business Logic: verification_service.py"
          - "Data Access: test_repository.py"
        test_flow:
          - step: "UI initiates real-time monitoring"
          - step: "Business logic calculates performance metrics"
          - step: "Data access retrieves test execution times"
          - step: "UI displays performance overview"
          - step: "Performance degradation detected"
          - step: "Business logic triggers performance alert"
          - step: "UI shows alert with recommended actions"
          - step: "UI displays performance trends over time"
        assertions:
          - "Performance metrics accurate (<200ms target)"
          - "Trends calculated correctly"
          - "Alerts triggered at correct thresholds"
          - "Real-time updates functional"
          - "Historical trend data displayed"
        test_file: "test_performance_monitoring_end_to_end.py"

  integration_test_patterns:
    mock_strategy:
      description: "Use mocking for external dependencies only"
      rules:
        - "Mock external APIs, file systems, databases"
        - "Do NOT mock internal layer interfaces"
        - "Use real implementations for layer integration"
        - "Mock only at system boundaries"
      
    test_data_strategy:
      description: "Use realistic test data for integration tests"
      rules:
        - "Create test fixtures matching production data structure"
        - "Include edge cases (empty, null, large datasets)"
        - "Use consistent test data across layers"
        - "Maintain test data in shared fixtures"
      
    assertion_strategy:
      description: "Verify both individual and integrated behavior"
      rules:
        - "Assert on data passed between layers"
        - "Verify layer interface contracts"
        - "Check state changes across layers"
        - "Validate error propagation"

ui_layer_e2e_testing:
  objective: "Validate complete user scenarios from UI to data persistence"
  
  e2e_test_scenarios:
    scenario_1_new_developer_onboarding:
      name: "New Developer First TDD Iteration"
      user_story: "As a new developer, I want to execute my first TDD iteration with guidance"
      test_steps:
        - step: "Launch TDD workflow interface"
          expected: "Welcome screen with TDD cycle overview"
        - step: "Select 'Start New Iteration'"
          expected: "RED phase prompt displayed"
        - step: "Create failing test"
          expected: "Test execution shows failure"
        - step: "UI displays RED phase checklist"
          expected: "Checklist items: write test, verify failure, commit"
        - step: "Transition to GREEN phase"
          expected: "GREEN phase prompt displayed"
        - step: "Implement minimal code"
          expected: "Test execution shows passing"
        - step: "UI displays GREEN phase checklist"
          expected: "Checklist items: minimal implementation, all tests pass, commit"
        - step: "Transition to REFACTOR phase"
          expected: "REFACTOR phase prompt displayed"
        - step: "Apply refactoring"
          expected: "Tests still passing, coverage improved"
        - step: "Complete iteration"
          expected: "Success summary with iteration report"
      verification:
        - "All phase transitions validated"
        - "Test results displayed accurately"
        - "Iteration report generated"
        - "Data persisted correctly"
      test_file: "test_e2e_developer_onboarding.py"
      
    scenario_2_mobile_offline_workflow:
      name: "Mobile Developer Offline Command Execution"
      user_story: "As a mobile developer, I want to work offline and sync when online"
      test_steps:
        - step: "Launch mobile UI in offline mode"
          expected: "Offline indicator displayed"
        - step: "Execute TDD commands locally"
          expected: "Commands queued for sync"
        - step: "UI shows offline sync status"
          expected: "Pending commands count displayed"
        - step: "Network connection restored"
          expected: "Auto-sync initiated"
        - step: "UI shows sync progress"
          expected: "Progress bar with command count"
        - step: "Sync completes successfully"
          expected: "All commands persisted, status updated"
        - step: "View command history"
