      test_steps:
        - step: "Launch performance monitoring dashboard"
          expected: "Performance overview displayed"
        - step: "View current performance metrics"
          expected: "Response times, throughput, error rates shown"
        - step: "Execute test suite with performance regression"
          expected: "Performance degradation detected"
        - step: "UI displays performance alert"
          expected: "Alert with affected components and recommended actions"
        - step: "View performance trends"
          expected: "Trend chart shows degradation over time"
        - step: "Drill into component performance"
