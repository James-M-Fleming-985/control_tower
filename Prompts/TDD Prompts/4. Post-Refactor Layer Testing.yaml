integration_test_suites:
  # =============================================================================
  # UNIT TESTING: Single-Iteration TDD Services
  # =============================================================================

  unit_testing_single_iteration:
    description: "Validate individual services implemented in single TDD iteration"
    priority: "HIGH"
    location: "BUSINESS LOGIC LAYER/tests/"

    contextual_pyramid_validator_unit:
      test_file: "test_contextual_pyramid_validator.py"
      service: "contextual_pyramid_validator.py"
      focus: "Core pyramid validation logic in isolation"

      test_categories:
        basic_functionality:
          - name: "test_contextual_pyramid_analyzer_exists"
            description: "Verify ContextualPyramidAnalyzer class instantiation"
            assertion: "Class exists and can be instantiated"

          - name: "test_analyze_pyramid_distribution_with_context"
            description: "Verify pyramid distribution analysis with context"
            assertion: "Returns distribution dict with accuracy >95%"

        validation_logic:
          - name: "test_context_aware_validator_exists"
            description: "Verify ContextAwareValidator class instantiation"
            assertion: "Class exists and can be instantiated"

          - name: "test_validate_tests_with_context_requirements"
            description: "Verify context-aware test validation"
            assertion: "Returns validation result with context requirements"

        edge_cases:
          - name: "test_empty_test_suite"
            description: "Handle empty test suite gracefully"
            assertion: "Returns appropriate error or empty result"

          - name: "test_invalid_test_data"
            description: "Handle malformed test data"
            assertion: "Raises TypeError or ValueError with clear message"

      success_criteria:
        - "All existing tests pass (maintain baseline)"
        - "No regressions from dependency updates"
        - "Performance maintained (sub-1s execution)"

    mobile_session_manager_unit:
      test_file: "test_mobile_session_security.py"
      service: "mobile_session_manager.py"
      focus: "Mobile session management in isolation"

      test_categories:
        basic_functionality:
          - name: "test_mobile_command_interpreter_exists"
            description: "Verify MobileCommandInterpreter instantiation"
            assertion: "Class exists and can be instantiated"

          - name: "test_interpret_mobile_validation_commands"
            description: "Verify mobile command processing"
            assertion: "Returns interpreted command with authentication"

        session_management:
          - name: "test_session_creation"
            description: "Create mobile session with valid credentials"
            assertion: "Returns session ID and metadata"

          - name: "test_session_validation"
            description: "Validate active session"
            assertion: "Returns True for valid session, False for invalid"

        security:
          - name: "test_session_expiration"
            description: "Handle expired sessions"
            assertion: "Returns False for expired sessions"

          - name: "test_invalid_credentials"
            description: "Reject invalid credentials"
            assertion: "Raises authentication error"

      success_criteria:
        - "All existing tests pass (maintain baseline)"
        - "Security validations working"
        - "Mobile workflows functional"

  # =============================================================================
  # UNIT TESTING: Multi-Iteration TDD Services
  # =============================================================================

  unit_testing_multi_iteration:
    description: "Validate services developed through multiple TDD iterations"
    priority: "HIGH"
    location: "BUSINESS LOGIC LAYER/tests/"

    context_engine_service_unit:
      test_file: "test_context_engine_business_logic.py"
      service: "context_engine_service.py"
      tdd_iterations: ["Iteration 6"]
      focus: "Context state management in isolation"

      test_categories:
        positive_tests:
          - name: "test_process_context_changes"
            description: "Process context changes with user tracking"
            input:
              user_id: "user_123"
              changes: [{ "key": "value1" }, { "key": "value2" }]
            assertions:
              - "Returns dict with context, changes_processed=True"
              - "changes key contains input changes"
              - "timestamp present and ISO format"

          - name: "test_validate_context_consistency"
            description: "Validate context structure"
            input:
              context: { "user_id": "user_123", "state": {}, "version": 1 }
            assertions:
              - "Returns True for valid context"
              - "Checks required keys (user_id, state, version)"
              - "Validates user_id non-empty, version is int"

          - name: "test_merge_context_states_auto_resolve"
            description: "Merge with auto_resolve strategy"
            input:
              base:
                {
                  "user_id": "user_123",
                  "state": { "key": "old" },
                  "version": 1,
                }
              incoming:
                {
                  "user_id": "user_123",
                  "state": { "key": "new" },
                  "version": 2,
                }
              strategy: "auto_resolve"
            assertions:
              - "Returns dict with merged_state"
              - "conflicts_resolved=True for auto-resolve"
              - "version incremented"
              - "timestamp present"

          - name: "test_merge_context_states_last_write_wins"
            description: "Merge with last_write_wins strategy"
            assertions:
              - "incoming overwrites base completely"
              - "conflicts_resolved=True"

          - name: "test_merge_context_states_manual"
            description: "Merge with manual strategy"
            assertions:
              - "merged_state contains both base and incoming"
              - "conflicts_resolved=False (requires manual resolution)"

        negative_tests:
          - name: "test_process_context_changes_invalid_user_id"
            description: "Reject empty user_id"
            assertion: "Raises ValueError with 'user_id cannot be empty'"

          - name: "test_validate_context_consistency_missing_keys"
            description: "Reject context missing required keys"
            assertion: "Returns False for missing user_id, state, or version"

          - name: "test_merge_context_states_invalid_strategy"
            description: "Reject unknown merge strategy"
            assertion: "Raises ValueError with 'Unknown merge strategy'"

        helper_method_tests:
          - name: "test_initialize_user_context"
            description: "Verify user context initialization"
            assertion: "Returns dict with user_id, empty state, version 1"

          - name: "test_auto_resolve_merge_no_conflicts"
            description: "Merge without conflicts"
            assertion: "Returns merged state, no conflicts detected"

          - name: "test_auto_resolve_merge_with_conflicts"
            description: "Merge with conflicting keys"
            assertion: "Returns merged state with conflict resolution applied"

      logging_validation:
        - "INFO: 'Processing {n} context changes for user {user_id}'"
        - "INFO: 'Merging context states using {strategy} strategy'"
        - "DEBUG: User tracking and version details logged"

      success_criteria:
        - "3/3 original tests passing"
        - "All negative tests passing"
        - "Helper method tests passing"
        - "Coverage ≥72% (baseline maintained)"
        - "Logging visible in test output"

    security_protocol_service_unit:
      test_file: "test_security_protocol_enforcement.py"
      test_file_negative: "test_security_protocol_enforcement_negative.py"
      service: "security_protocol_service.py"
      tdd_iterations: ["Iteration 7"]
      focus: "Security protocol enforcement in isolation"

      test_categories:
        positive_tests:
          - name: "test_enforce_data_encryption"
            description: "Encrypt sensitive data fields"
            input:
              sensitive_data:
                user_credentials: { "username": "user_123", "token": "abc123" }
                session_data: { "session_id": "sess_789", "permissions": [] }
                audit_trail: { "events": [] }
            assertions:
              - "encrypted=True"
              - "encryption_method='AES-256'"
              - "encrypted_data contains all 3 input fields"
              - "encryption_timestamp in ISO format"
              - "key_id present"

          - name: "test_validate_access_permissions"
            description: "Validate user access permissions"
            input:
              access_request:
                user_id: "user_123"
                requested_operation: "execute_validation"
                resource: "testing_pyramid_engine"
            assertions:
              - "Returns bool (True for valid user_id)"
              - "Returns False for empty/whitespace user_id"

          - name: "test_audit_security_event"
            description: "Audit security event"
            input:
              security_event:
                event_type: "permission_granted"
                user_id: "user_123"
                resource: "validation_engine"
                timestamp: "2025-10-02T14:00:00Z"
                risk_level: "low"
            assertions:
              - "audited=True"
              - "audit_id unique (timestamp-based)"
              - "event_type from input"
              - "audit_timestamp in ISO format"
              - "compliance_status='compliant'"
              - "stored=True"

        negative_tests:
          - name: "test_enforce_data_encryption_invalid_input_type"
            description: "TypeError for non-dict input"
            assertion: "Raises TypeError: 'sensitive_data must be dict'"

          - name: "test_enforce_data_encryption_empty_dict"
            description: "ValueError for empty dict"
            assertion: "Raises ValueError: 'cannot be empty'"

          - name: "test_validate_access_permissions_invalid_input_type"
            description: "TypeError for non-dict input"
            assertion: "Raises TypeError: 'access_request must be dict'"

          - name: "test_validate_access_permissions_no_user_id"
            description: "ValueError for missing user_id"
            assertion: "Raises ValueError: 'must contain user_id'"

          - name: "test_validate_access_permissions_empty_user_id"
            description: "Returns False for empty user_id"
            assertion: "result is False"

          - name: "test_validate_access_permissions_whitespace_user_id"
            description: "Returns False for whitespace user_id"
            assertion: "result is False"

          - name: "test_audit_security_event_invalid_input_type"
            description: "TypeError for non-dict input"
            assertion: "Raises TypeError: 'security_event must be dict'"

          - name: "test_audit_security_event_no_event_type"
            description: "ValueError for missing event_type"
            assertion: "Raises ValueError: 'must contain event_type'"

        helper_method_tests:
          - name: "test_encrypt_field"
            description: "Verify single field encryption (base64)"
            assertion: "Returns base64-encoded string"

          - name: "test_generate_audit_id"
            description: "Verify unique audit ID generation"
            assertion: "Returns 'audit_{timestamp}' format, unique per call"

          - name: "test_validate_security_event"
            description: "Verify security event validation"
            assertion: "Raises TypeError/ValueError for invalid input"

      logging_validation:
        - "INFO: 'Starting encryption for {n} fields'"
        - "INFO: 'Encryption complete: {n} fields encrypted'"
        - "INFO: 'Validating access: user={user_id}, operation={operation}'"
        - "DEBUG: 'Access validation result: {result}'"
        - "INFO: 'Auditing event: type={event_type}, user={user_id}'"
        - "DEBUG: 'Audit complete: audit_id={audit_id}'"

      success_criteria:
        - "11/11 tests passing (3 positive + 8 negative)"
        - "Coverage ≥93% (baseline maintained)"
        - "No DeprecationWarnings"
        - "Logging visible in test output"
        - "All negative test assertions correct"

  # =============================================================================
  # INTEGRATION TESTING: Service-to-Service
  # =============================================================================

  integration_testing_service_to_service:
    integration_testing_service_to_service:
    description: "Test interactions between Business Logic services"
    priority: "HIGH"
    location: "BUSINESS LOGIC LAYER/tests/integration/"
    
    context_engine_security_integration:
      test_file: "test_context_engine_security_integration.py"
      services: ["context_engine_service.py", "security_protocol_service.py"]
      focus: "Context state encryption and security"
      
      integration_scenarios:
        encrypt_context_before_storage:
          description: "Encrypt context state before storing"
          flow:
            - "ContextEngineService.process_context_changes() creates context"
            - "SecurityProtocolService.enforce_data_encryption() encrypts context"
            - "Verify encrypted context structure"
            - "Verify encryption metadata (timestamp, key_id)"
          assertions:
            - "Context data encrypted successfully"
            - "Encryption method matches expectation"
            - "Encrypted context can be retrieved"
        
        validate_permissions_for_context_operations:
          description: "Validate access before context operations"
          flow:
            - "User requests context update"
            - "SecurityProtocolService.validate_access_permissions() checks access"
            - "If granted: ContextEngineService.process_context_changes()"
            - "If denied: Reject with permission error"
          assertions:
            - "Valid user_id grants access"
            - "Empty/invalid user_id denies access"
            - "Context only updated when access granted"
        
        audit_context_change_events:
          description: "Audit all context change operations"
          flow:
            - "ContextEngineService.process_context_changes() processes changes"
            - "SecurityProtocolService.audit_security_event() logs event"
            - "Verify audit trail created"
          assertions:
            - "Audit record created for each context change"
            - "Audit includes user_id, operation, timestamp"
            - "Audit marked as 'compliant'"
      
      error_handling_integration:
        - scenario: "Encryption fails during context processing"
          expected: "RuntimeError raised, context change rolled back"
        
        - scenario: "Permission denied for context operation"
          expected: "Context not modified, audit event logged"
        
        - scenario: "Invalid context structure rejected"
          expected: "ValueError raised before encryption attempted"
      
      success_criteria:
        - "All integration scenarios passing"
        - "Error handling working across services"
        - "No data leakage between services"
        - "Performance: integration <100ms overhead"
    
    mobile_session_security_integration:
      test_file: "test_mobile_session_security_integration.py"
      services: ["mobile_session_manager.py", "security_protocol_service.py"]
      focus: "Mobile session encryption and audit"
      
      integration_scenarios:
        encrypt_session_tokens:
          description: "Encrypt session tokens for secure storage"
          flow:
            - "MobileSessionManager creates session"
            - "SecurityProtocolService.enforce_data_encryption() encrypts token"
            - "Store encrypted session"
            - "Retrieve and decrypt for validation"
          assertions:
            - "Session tokens encrypted at rest"
            - "Encryption doesn't break session validation"
            - "Session metadata preserved"
        
        validate_mobile_command_permissions:
          description: "Validate permissions for mobile commands"
          flow:
            - "Mobile client sends command"
            - "MobileSessionManager.interpret_mobile_validation_commands()"
            - "SecurityProtocolService.validate_access_permissions()"
            - "Execute command only if permissions granted"
          assertions:
            - "Valid session grants command execution"
            - "Expired session denies command"
            - "Invalid credentials reject command"
        
        audit_mobile_session_events:
          description: "Audit mobile session lifecycle"
          flow:
            - "Session created → audit event"
            - "Command executed → audit event"
            - "Session expired → audit event"
          assertions:
            - "All session events audited"
            - "Audit trail shows session lifecycle"
            - "Risk levels tracked appropriately"
      
      success_criteria:
        - "Mobile workflows secure end-to-end"
        - "Session encryption transparent to clients"
        - "Audit trail complete for compliance"
        - "Performance: session operations <50ms"
    
    context_engine_mobile_session_integration:
      test_file: "test_context_engine_mobile_integration.py"
      services: ["context_engine_service.py", "mobile_session_manager.py"]
      focus: "Context state synchronization with mobile sessions"
      
      integration_scenarios:
        sync_context_with_mobile_session:
          description: "Keep context state synced with mobile session"
          flow:
            - "Mobile session created"
            - "ContextEngineService.process_context_changes() initializes context"
            - "Mobile commands update context"
            - "Context changes reflected in session state"
          assertions:
            - "Context initialized when session created"
            - "Context updates propagate to session"
            - "Session state reflects latest context"
        
        mobile_context_merge_scenarios:
          description: "Handle context merges from mobile devices"
          flow:
            - "Mobile device A updates context (offline)"
            - "Mobile device B updates context (offline)"
            - "Both sync to server"
            - "ContextEngineService.merge_context_states() resolves conflicts"
          assertions:
            - "auto_resolve strategy merges cleanly"
            - "Conflicts detected when necessary"
            - "Mobile devices receive merged context"
      
      success_criteria:
        - "Context-session sync reliable"
        - "Offline scenarios handled gracefully"
        - "Conflict resolution works for mobile clients"
  
  # =============================================================================
  # INTEGRATION TESTING: Business Logic ↔ Data Access Layer
  # =============================================================================
  
  integration_testing_cross_layer:
    description: "Test Business Logic Layer integration with Data Access Layer"
    priority: "CRITICAL"
    location: "BUSINESS LOGIC LAYER/tests/integration/"
    
    context_engine_repository_integration:
      test_file: "test_context_engine_repository_integration.py"
      services: ["context_engine_service.py"]
      repositories: ["ContextEngineRepository (Data Access Layer)"]
      focus: "Context state persistence"
      
      integration_scenarios:
        persist_context_state:
          description: "Save context state to data access layer"
          flow:
            - "ContextEngineService.process_context_changes() creates context"
            - "Call ContextEngineRepository.sync_context_state()"
            - "Verify context stored in file system"
            - "Retrieve context and validate structure"
          assertions:
            - "Context persisted correctly"
            - "File format matches expected structure"
            - "Timestamps preserved"
        
        retrieve_context_for_merging:
          description: "Load context for merge operations"
          flow:
            - "Load base context from ContextEngineRepository"
            - "ContextEngineService.merge_context_states() merges with incoming"
            - "Save merged context back to repository"
          assertions:
            - "Base context loaded correctly"
            - "Merge operates on persisted data"
            - "Merged result persisted"
        
        context_versioning:
          description: "Track context version history"
          flow:
            - "Create context v1"
            - "Update to v2, v3"
            - "Query version history from repository"
          assertions:
            - "Version increments correctly"
