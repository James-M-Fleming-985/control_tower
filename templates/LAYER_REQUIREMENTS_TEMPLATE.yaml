# ====================================================================================
# LAYER REQUIREMENT TEMPLATE
# ====================================================================================
# This template defines layer-level requirements that implement feature capabilities.
# Layers are the LOWEST level in the requirements hierarchy: Project→System→Feature→Layer
#
# CRITICAL: This file is typically AUTO-GENERATED by build_feature.py --init-layers
# Manual creation should follow the same structure and traceability patterns.
# ====================================================================================
# REQUIREMENTS TRACEABILITY CHAIN:
#   PROJECT Requirements (business goals)
#     ↓ decomposed into
#   SYSTEM Requirements (technical systems)
#     ↓ decomposed into
#   FEATURE Requirements (user-facing features)
#     ↓ decomposed into
#   LAYER Requirements (implementation components) ← YOU ARE HERE
# ====================================================================================
# FOLDER NAMING CONVENTION - CRITICAL FOR PYTHON IMPORTS:
#
# Format: LAYER_{layer_id_underscores}_{layer_name_underscores}
# Example: LAYER_003_001_001_YAML_XML_Reader
#
# Conversion Rules:
#   - Layer ID: LAYER-003-001-001 → LAYER_003_001_001 (hyphens to underscores)
#   - Layer Name: "YAML XML Reader" → YAML_XML_Reader (spaces to underscores)
#
# WHY THIS MATTERS:
#   - Python cannot import modules with spaces or hyphens in names
#   - ModuleNotFoundError if naming doesn't follow convention
#   - build_feature.py enforces this via standardize_layer_folder_name()
#   - No fallback logic exists - violations cause immediate build failures
#
# AUTOMATED CREATION (RECOMMENDED):
#   Command: python build_feature.py --init-layers FEATURE_REQUIREMENTS.yaml
#   Result: Auto-generated folders + YAMLs with correct naming + traceability
#
# MANUAL CREATION (NOT RECOMMENDED):
#   1. Create folder: LAYER_XXX_YYY_ZZZ_LayerName/
#   2. Copy this template to: LAYER_XXX_YYY_ZZZ_LayerName/REQ-XXX-YYY-ZZZ.yaml
#   3. Update ALL [PLACEHOLDER] values
#   4. Ensure metadata.layer_folder EXACTLY matches actual folder name
# ====================================================================================

# ====================================================================================
# METADATA - Identifies this requirement uniquely
# ====================================================================================
metadata:
  requirement_id: "[REQ-XXX-YYY-ZZZ]"           # e.g., REQ-003-001-001
  requirement_title: "[Brief Layer Title]"       # e.g., "YAML File Reader"
  layer_id: "[LAYER-XXX-YYY-ZZZ]"               # e.g., LAYER-003-001-001 (with hyphens)
  layer_name: "[Layer Name]"                     # e.g., "YAML XML Reader" (human-readable with spaces)
  layer_folder: "[LAYER_XXX_YYY_ZZZ_LayerName]" # e.g., LAYER_003_001_001_YAML_XML_Reader (MUST match actual folder name EXACTLY)
  
  parent_feature: "[FEATURE-XXX-YYY_FeatureName]"  # e.g., FEATURE-003-001_Data_Reader_Parser
  parent_feature_file: "../FEATURE-XXX-YYY.yaml"    # Relative path to parent feature YAML
  
  version: "1.0.0"
  status: "Active"                               # Active | Draft | Deprecated
  priority: "MUST HAVE"                          # MUST HAVE | SHOULD HAVE | COULD HAVE | WONT HAVE
  created_date: "2025-10-20"
  updated_date: "2025-10-20"
  owner: "[Your Name]"
  target_date: "[YYYY-MM-DD]"
  
  change_log:
    - version: "1.0.0"
      date: "2025-10-20"
      changes: "Initial version - auto-generated by build_feature.py --init-layers"
      author: "[Your Name or 'AI-derived']"

# ====================================================================================
# TRACEABILITY - Shows requirement lineage
# ====================================================================================
traceability:
  parent_feature_requirements:
    - "FEAT-REQ-XXX: [Brief description of feature requirement this implements]"
    - "FEAT-REQ-YYY: [Brief description of feature requirement this implements]"
  
  parent_system_requirements:
    - "SYS-REQ-XXX: [Brief description of system requirement this traces to]"
  
  parent_project_requirements:
    - "PRJ-REQ-XXX: [Brief description of project requirement this traces to]"
  
  derivation_rationale: |
    [Explain how this layer was derived from parent feature requirements.
    Show the logical connection between feature capabilities and layer implementation.]
    
    Example:
    "This layer implements FEAT-REQ-001 (File Format Support) by providing
    concrete readers for YAML and XML. The feature requires data ingestion
    from multiple formats; this layer delivers the YAML/XML portion."

# ====================================================================================
# TECHNICAL CONSTRAINTS - CRITICAL: Tells AI orchestrator which language to generate
# ====================================================================================
# This section is READ BY THE AI CODE GENERATOR to determine output language!
# If missing, defaults to Python. Must match your project's tech stack.
technical_constraints:
  language: "[Python|TypeScript|JavaScript|etc]"        # CRITICAL: Primary language (defaults to Python if missing!)
  framework: "[Framework name and version]"             # e.g., "React 18.2.0" or "FastAPI 0.104.0"
  output_file_type: "[.py|.tsx|.ts|.js|.jsx|etc]"      # CRITICAL: File extension for generated code
  runtime: "[Execution environment]"                    # e.g., "Browser (Node.js 18+)" or "Python 3.10+"
  
  # Example for Python projects:
  # language: "Python"
  # framework: "FastAPI 0.104.0"
  # output_file_type: ".py"
  # runtime: "Python 3.10+"
  
  # Example for React/TypeScript projects:
  # language: "TypeScript"
  # framework: "React 18.2.0"
  # output_file_type: ".tsx"
  # runtime: "Browser (Node.js 18+ for build)"

# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "[Layer Title - Same as requirement_title above]"
  
  description: |
    [Detailed description of what this layer does]
    
    Example:
    Reads YAML and XML files from project folders, parses content into 
    Python dictionaries, handles encoding issues (UTF-8/UTF-16), and 
    validates basic file structure before passing to data model validator.
  
  rationale: |
    [Why this layer exists and its business value]
    
    Example:
    Project data is stored in YAML files across the repository. This layer
    provides centralized file reading logic with error handling, enabling
    other layers to work with structured data without worrying about file
    I/O details.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # Technology Stack - CRITICAL: Defines programming language and frameworks
  # This section determines what language the AI code generator will use
  technology_stack:
    programming_language: "[Python|TypeScript|JavaScript|etc]"  # PRIMARY language for this layer
    file_extensions: ["[.py|.ts|.tsx|.js|.jsx|etc]"]           # File types to generate
    runtime_environment: "[Python 3.10+|Node.js 18+|Browser|etc]"  # Execution environment
    
    # For Python projects:
    # programming_language: "Python"
    # file_extensions: [".py"]
    # runtime_environment: "Python 3.10+"
    # primary_framework: "N/A (standard library)"
    
    # For React/TypeScript projects:
    # programming_language: "TypeScript"
    # file_extensions: [".tsx", ".ts"]
    # runtime_environment: "React Browser Environment (Node.js 18+)"
    # primary_framework: "React 18.2.0 (functional components with hooks)"
    # ui_framework: "Material-UI 5.x"
    # type_checking: "TypeScript 5.0+ strict mode"
    
    primary_framework: "[Framework name and version]"  # e.g., "FastAPI 0.104.0" or "React 18.2.0"
    additional_libraries:
      - "[library1]"  # e.g., "pyyaml" or "@react-three/fiber"
      - "[library2]"  # e.g., "pathlib" or "three.js"
  
  # File/module structure
  structure:
    entry_point: "src/[module_name]/[main_file].[ext]"    # e.g., src/data_reader/yaml_reader.py OR src/components/Visualization.tsx
    modules:
      - "[module1].[ext]"        # Brief description
      - "[module2].[ext]"        # Brief description
      - "[module3].[ext]"        # Brief description
  
  # Main classes/functions to implement
  classes:
    - name: "[ClassName]"
      purpose: "[What this class does]"
      methods:
        - name: "[method_name]"
          signature: "[method_name](param1: Type, param2: Type) -> ReturnType"
          purpose: "[What this method does]"
          example: |
            # Example usage
            reader = YAMLReader()
            data = reader.read_file('path/to/file.yaml')
  
  # Key technical details
  implementation_details:
    libraries: ["[library1]", "[library2]"]     # e.g., ["pyyaml", "pathlib"]
    patterns: ["[pattern1]", "[pattern2]"]      # e.g., ["Repository Pattern", "Factory Pattern"]
    error_handling:
      - error_type: "[ErrorType]"
        handling: "[How to handle]"
  
  # Input/output contract
  inputs:
    - name: "[input_name]"
      type: "[data_type]"
      description: "[What is this input]"
      example: "path/to/file.yaml"
  
  outputs:
    - name: "[output_name]"
      type: "[data_type]"
      description: "[What is this output]"
      example: "{'project': 'name', 'tasks': []}"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "[What must be true]"
    test: "[How to test it]"
    example: |
      # Example test command
      pytest tests/unit/test_yaml_reader.py::test_read_valid_yaml -v
  
  - criterion: "[Another requirement]"
    test: "[How to verify]"
  
  - criterion: "[Performance requirement]"
    test: "[Performance test]"

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build [Layer Name] (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_[module_name].py"
      tests:
        - "test_[specific_behavior_1]"
        - "test_[specific_behavior_2]"
        - "test_[error_handling_scenario]"
      duration: "[estimated time]"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_[module_name].py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement [ClassName] (GREEN phase)"
      file: "src/[module_name]/[file_name].py"
      methods:
        - "[method1]() → ReturnType"
        - "[method2](param: Type) → ReturnType"
      duration: "[estimated time]"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_[module_name].py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "[Improvement 1]"
        - "[Improvement 2]"
      duration: "[estimated time]"
    
    - step: 6
      action: "Integration test with next layer"
      file: "tests/integration/test_[integration_scenario].py"
      duration: "[estimated time]"
  
  total_time: "[total estimated hours/minutes]"
  
  deliverable: "[What is the end result]"

# ====================================================================================
# INTEGRATION POINTS - How this layer connects to others
# ====================================================================================
integration:
  input_from:
    - layer: "[Previous Layer ID]"
      data_type: "[Type of data received]"
      interface: "[Method/function used to receive]"
  
  output_to:
    - layer: "[Next Layer ID]"
      data_type: "[Type of data provided]"
      interface: "[Method/function used to provide]"
  
  shared_dependencies:
    - "[Shared module/class used by multiple layers]"

# ================================================================================
# TESTING STRATEGY - Different test levels for this layer
# ================================================================================
testing_strategy:
  unit_tests:
    location: "tests/unit/test_[module_name].py"
    coverage_target: "90%"
    key_scenarios:
      - "[Scenario 1]"
      - "[Scenario 2]"
  
  integration_tests:
    location: "tests/integration/test_[integration_name].py"
    scenarios:
      - "[Integration scenario 1]"
      - "[Integration scenario 2]"
  
  fixtures:
    location: "tests/fixtures/[fixture_type]/"
    files:
      - "[sample_data_1.yaml]"
      - "[sample_data_2.yaml]"

# ================================================================================
# DEPLOYMENT NOTES - How to deploy/use this layer
# ================================================================================
deployment:
  dependencies:
    - package: "[package_name]"
      version: "[version]"
      purpose: "[why needed]"
  
  configuration:
    - setting: "[config_key]"
      value: "[default_value]"
      location: "config/[config_file].yaml"
  
  usage_example: |
    # Example of how to use this layer
    from src.[module_name] import [ClassName]
    
    reader = [ClassName]()
    result = reader.[method_name](param)

# ================================================================================
# CODE GENERATION CONSTRAINTS - CRITICAL for AI Code Generation Quality
# ================================================================================
# These constraints MUST be followed when AI generates implementation code
# Violations will cause runtime errors and integration failures
# ================================================================================
code_generation_constraints:
  
  # Language Specification - CRITICAL: Must match specification.technology_stack
  # This MUST be filled in to ensure correct language generation
  programming_language: "[COPY from specification.technology_stack.programming_language]"
  file_extensions: ["[COPY from specification.technology_stack.file_extensions]"]
  runtime_environment: "[COPY from specification.technology_stack.runtime_environment]"
  primary_framework: "[COPY from specification.technology_stack.primary_framework]"
  
  # EXAMPLES:
  # Python project:
  #   programming_language: "Python"
  #   file_extensions: [".py"]
  #   runtime_environment: "Python 3.10+"
  #   primary_framework: "FastAPI 0.104.0"
  
  # TypeScript/React project:
  #   programming_language: "TypeScript"
  #   file_extensions: [".tsx", ".ts"]
  #   runtime_environment: "React Browser Environment (Node.js 18+)"
  #   primary_framework: "React 18.2.0 (functional components with hooks)"
  #   rendering_library: "@react-three/fiber (latest)"
  #   graphics_library: "Three.js (latest)"
  #   ui_framework: "Material-UI 5.x"
  #   type_checking: "TypeScript 5.0+ strict mode"
  
  # Output Format Rules - Prevents markdown wrapping
  output_format:
    - "Return ONLY raw code in the specified programming language - NO explanations or commentary"
    - "NO markdown code fences (```python, ```typescript, or ```)"
    - "First line MUST be valid code (import statement, class definition, interface, or function)"
    - "Last line MUST be valid code (NOT a closing markdown fence)"
    - "File must be directly executable/compilable without any preprocessing"
  
  # API Usage Rules - Prevents method invention
  api_usage:
    - "ONLY call methods that are explicitly defined in this layer's interface"
    - "DO NOT invent method variations, aliases, or similar names"
    - "Use EXACT method names as specified in requirements"
    - "If a method is not listed in the interface, DO NOT create or call it"
    - "Method signatures must match exactly (parameter names, types, return types)"
  
  # Import Completeness Rules - Prevents missing imports
  import_completeness:
    - "Import ALL types used in type hints (Dict, List, Optional, Tuple, Any, Union, etc.)"
    - "Import ALL third-party libraries before use"
    - "Import ALL standard library modules before use"
    - "Verify all imported names are actually used in the code"
    - "Remove unused imports to maintain clean code"
  
  # Naming Convention Rules - Ensures consistency
  naming_conventions:
    - "Primary class/component name MUST match the layer name or be clearly related"
    - "Use descriptive, unambiguous names for methods/functions and variables"
    - "Follow language conventions: PEP 8 for Python (snake_case functions, PascalCase classes) OR TypeScript/React (camelCase functions, PascalCase components)"
    - "React components use PascalCase: VisualizationManager, SceneController"
    - "React hooks start with 'use': useVisualizationMode, usePerformance"
    - "Event handlers start with 'handle': handleModeChange, handleSliderUpdate"
    - "Avoid generic names like 'process', 'handle', 'do' without context"
  
  # Code Quality Rules - Prevents stub/placeholder code
  quality_requirements:
    - "NO stub implementations (pass statements without logic)"
    - "NO placeholder comments like TODO, FIXME, NOT IMPLEMENTED"
    - "NO fake/mock data unless explicitly required for testing"
    - "ALL methods must have complete, working implementations"
    - "Code must be production-ready, not a prototype"
  
  # Validation Requirements - Ensures code correctness
  validation_requirements:
    - "Code MUST be syntactically valid in the specified programming language"
    - "For Python: Must be valid Python 3.10+ syntax"
    - "For TypeScript: Must compile with TypeScript 5.0+ in strict mode"
    - "For React: Components must handle mounting/unmounting properly"
    - "All referenced attributes/properties MUST exist on their objects"
    - "All method/function calls MUST match actual signatures"
    - "Type hints/annotations must be accurate and complete"
    - "Code must pass basic static analysis (no obvious errors)"

# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - [Key point 1]
  - [Key point 2]
  - [Known limitation or gotcha]
  
  DESIGN DECISIONS:
  - [Why approach X was chosen over Y]
  - [Trade-offs considered]
  
  FUTURE ENHANCEMENTS:
  - [Potential improvement 1]
  - [Potential improvement 2]

# ================================================================================
# END OF LAYER REQUIREMENT
# ================================================================================
