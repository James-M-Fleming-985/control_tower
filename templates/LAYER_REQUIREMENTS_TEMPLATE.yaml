# ====================================================================================
# LAYER REQUIREMENT TEMPLATE
# ====================================================================================
# This template defines layer-level requirements that implement feature capabilities.
# Layers are the LOWEST level in the requirements hierarchy: Project→System→Feature→Layer
#
# CRITICAL: This file is typically AUTO-GENERATED by build_feature.py --init-layers
# Manual creation should follow the same structure and traceability patterns.
# ====================================================================================
# REQUIREMENTS TRACEABILITY CHAIN:
#   PROJECT Requirements (business goals)
#     ↓ decomposed into
#   SYSTEM Requirements (technical systems)
#     ↓ decomposed into
#   FEATURE Requirements (user-facing features)
#     ↓ decomposed into
#   LAYER Requirements (implementation components) ← YOU ARE HERE
# ====================================================================================
# FOLDER NAMING CONVENTION - CRITICAL FOR PYTHON IMPORTS:
#
# Format: LAYER_{layer_id_underscores}_{layer_name_underscores}
# Example: LAYER_003_001_001_YAML_XML_Reader
#
# Conversion Rules:
#   - Layer ID: LAYER-003-001-001 → LAYER_003_001_001 (hyphens to underscores)
#   - Layer Name: "YAML XML Reader" → YAML_XML_Reader (spaces to underscores)
#
# WHY THIS MATTERS:
#   - Python cannot import modules with spaces or hyphens in names
#   - ModuleNotFoundError if naming doesn't follow convention
#   - build_feature.py enforces this via standardize_layer_folder_name()
#   - No fallback logic exists - violations cause immediate build failures
#
# AUTOMATED CREATION (RECOMMENDED):
#   Command: python build_feature.py --init-layers FEATURE_REQUIREMENTS.yaml
#   Result: Auto-generated folders + YAMLs with correct naming + traceability
#
# MANUAL CREATION (NOT RECOMMENDED):
#   1. Create folder: LAYER_XXX_YYY_ZZZ_LayerName/
#   2. Copy this template to: LAYER_XXX_YYY_ZZZ_LayerName/REQ-XXX-YYY-ZZZ.yaml
#   3. Update ALL [PLACEHOLDER] values
#   4. Ensure metadata.layer_folder EXACTLY matches actual folder name
# ====================================================================================

# ====================================================================================
# METADATA - Identifies this requirement uniquely
# ====================================================================================
metadata:
  requirement_id: "[REQ-XXX-YYY-ZZZ]"           # e.g., REQ-003-001-001
  requirement_title: "[Brief Layer Title]"       # e.g., "YAML File Reader"
  layer_id: "[LAYER-XXX-YYY-ZZZ]"               # e.g., LAYER-003-001-001 (with hyphens)
  layer_name: "[Layer Name]"                     # e.g., "YAML XML Reader" (human-readable with spaces)
  layer_folder: "[LAYER_XXX_YYY_ZZZ_LayerName]" # e.g., LAYER_003_001_001_YAML_XML_Reader (MUST match actual folder name EXACTLY)
  
  parent_feature: "[FEATURE-XXX-YYY_FeatureName]"  # e.g., FEATURE-003-001_Data_Reader_Parser
  parent_feature_file: "../FEATURE-XXX-YYY.yaml"    # Relative path to parent feature YAML
  
  version: "1.0.0"
  status: "Active"                               # Active | Draft | Deprecated
  priority: "MUST HAVE"                          # MUST HAVE | SHOULD HAVE | COULD HAVE | WONT HAVE
  created_date: "2025-10-20"
  updated_date: "2025-10-20"
  owner: "[Your Name]"
  target_date: "[YYYY-MM-DD]"
  
  change_log:
    - version: "1.0.0"
      date: "2025-10-20"
      changes: "Initial version - auto-generated by build_feature.py --init-layers"
      author: "[Your Name or 'AI-derived']"

# ====================================================================================
# TRACEABILITY - Shows requirement lineage
# ====================================================================================
traceability:
  parent_feature_requirements:
    - "FEAT-REQ-XXX: [Brief description of feature requirement this implements]"
    - "FEAT-REQ-YYY: [Brief description of feature requirement this implements]"
  
  parent_system_requirements:
    - "SYS-REQ-XXX: [Brief description of system requirement this traces to]"
  
  parent_project_requirements:
    - "PRJ-REQ-XXX: [Brief description of project requirement this traces to]"
  
  derivation_rationale: |
    [Explain how this layer was derived from parent feature requirements.
    Show the logical connection between feature capabilities and layer implementation.]
    
    Example:
    "This layer implements FEAT-REQ-001 (File Format Support) by providing
    concrete readers for YAML and XML. The feature requires data ingestion
    from multiple formats; this layer delivers the YAML/XML portion."

# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "[Layer Title - Same as requirement_title above]"
  
  description: |
    [Detailed description of what this layer does]
    
    Example:
    Reads YAML and XML files from project folders, parses content into 
    Python dictionaries, handles encoding issues (UTF-8/UTF-16), and 
    validates basic file structure before passing to data model validator.
  
  rationale: |
    [Why this layer exists and its business value]
    
    Example:
    Project data is stored in YAML files across the repository. This layer
    provides centralized file reading logic with error handling, enabling
    other layers to work with structured data without worrying about file
    I/O details.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/[module_name]/[main_file].py"    # e.g., src/data_reader/yaml_reader.py
    modules:
      - "[module1].py"        # Brief description
      - "[module2].py"        # Brief description
      - "[module3].py"        # Brief description
  
  # Main classes/functions to implement
  classes:
    - name: "[ClassName]"
      purpose: "[What this class does]"
      methods:
        - name: "[method_name]"
          signature: "[method_name](param1: Type, param2: Type) -> ReturnType"
          purpose: "[What this method does]"
          example: |
            # Example usage
            reader = YAMLReader()
            data = reader.read_file('path/to/file.yaml')
  
  # Key technical details
  implementation_details:
    libraries: ["[library1]", "[library2]"]     # e.g., ["pyyaml", "pathlib"]
    patterns: ["[pattern1]", "[pattern2]"]      # e.g., ["Repository Pattern", "Factory Pattern"]
    error_handling:
      - error_type: "[ErrorType]"
        handling: "[How to handle]"
  
  # Input/output contract
  inputs:
    - name: "[input_name]"
      type: "[data_type]"
      description: "[What is this input]"
      example: "path/to/file.yaml"
  
  outputs:
    - name: "[output_name]"
      type: "[data_type]"
      description: "[What is this output]"
      example: "{'project': 'name', 'tasks': []}"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "[What must be true]"
    test: "[How to test it]"
    example: |
      # Example test command
      pytest tests/unit/test_yaml_reader.py::test_read_valid_yaml -v
  
  - criterion: "[Another requirement]"
    test: "[How to verify]"
  
  - criterion: "[Performance requirement]"
    test: "[Performance test]"

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build [Layer Name] (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_[module_name].py"
      tests:
        - "test_[specific_behavior_1]"
        - "test_[specific_behavior_2]"
        - "test_[error_handling_scenario]"
      duration: "[estimated time]"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_[module_name].py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement [ClassName] (GREEN phase)"
      file: "src/[module_name]/[file_name].py"
      methods:
        - "[method1]() → ReturnType"
        - "[method2](param: Type) → ReturnType"
      duration: "[estimated time]"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_[module_name].py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "[Improvement 1]"
        - "[Improvement 2]"
      duration: "[estimated time]"
    
    - step: 6
      action: "Integration test with next layer"
      file: "tests/integration/test_[integration_scenario].py"
      duration: "[estimated time]"
  
  total_time: "[total estimated hours/minutes]"
  
  deliverable: "[What is the end result]"

# ====================================================================================
# INTEGRATION POINTS - How this layer connects to others
# ====================================================================================
integration:
  input_from:
    - layer: "[Previous Layer ID]"
      data_type: "[Type of data received]"
      interface: "[Method/function used to receive]"
  
  output_to:
    - layer: "[Next Layer ID]"
      data_type: "[Type of data provided]"
      interface: "[Method/function used to provide]"
  
  shared_dependencies:
    - "[Shared module/class used by multiple layers]"

# ================================================================================
# TESTING STRATEGY - Different test levels for this layer
# ================================================================================
testing_strategy:
  unit_tests:
    location: "tests/unit/test_[module_name].py"
    coverage_target: "90%"
    key_scenarios:
      - "[Scenario 1]"
      - "[Scenario 2]"
  
  integration_tests:
    location: "tests/integration/test_[integration_name].py"
    scenarios:
      - "[Integration scenario 1]"
      - "[Integration scenario 2]"
  
  fixtures:
    location: "tests/fixtures/[fixture_type]/"
    files:
      - "[sample_data_1.yaml]"
      - "[sample_data_2.yaml]"

# ================================================================================
# DEPLOYMENT NOTES - How to deploy/use this layer
# ================================================================================
deployment:
  dependencies:
    - package: "[package_name]"
      version: "[version]"
      purpose: "[why needed]"
  
  configuration:
    - setting: "[config_key]"
      value: "[default_value]"
      location: "config/[config_file].yaml"
  
  usage_example: |
    # Example of how to use this layer
    from src.[module_name] import [ClassName]
    
    reader = [ClassName]()
    result = reader.[method_name](param)

# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - [Key point 1]
  - [Key point 2]
  - [Known limitation or gotcha]
  
  DESIGN DECISIONS:
  - [Why approach X was chosen over Y]
  - [Trade-offs considered]
  
  FUTURE ENHANCEMENTS:
  - [Potential improvement 1]
  - [Potential improvement 2]

# ================================================================================
# END OF LAYER REQUIREMENT
# ================================================================================
