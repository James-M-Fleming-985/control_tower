# ====================================================================================
# FEATURE REQUIREMENTS INDEX: [Feature Name]
# ====================================================================================
# FEATURE ID: FEATURE-XXX-XXX
# VERSION: 1.0.0
# LAST UPDATED: YYYY-MM-DD
# OWNER: [Your Name]
# ====================================================================================
# This template defines feature-level requirements that are decomposed into layers.
# Features must follow parent SYSTEM's naming conventions and response structures.
# Use build_feature.py --init-layers to auto-generate layer folders with traceability.
# ====================================================================================

metadata:
  requirement_id: "FEATURE-XXX-XXX"
  requirement_name: "[Feature Name]"
  feature_id: "FEATURE-XXX-XXX"  # Required by build_feature.py
  feature_name: "[Feature Name]"  # Required by build_feature.py
  feature_code: "[SHORT_CODE]"
  version: "1.0.0"
  status: "Active"
  created_date: "YYYY-MM-DD"
  last_modified: "YYYY-MM-DD"
  owner: "[Your Name]"
  priority: "MUST HAVE"
  target_date: "YYYY-MM-DD"
  
  traceability:
    parent_system: "SYSTEM-XXX-XXX"
    parent_system_file: "../SYSTEM-XXX.yaml"
    parent_system_requirements:
      - "SYS-REQ-XXX: [Brief description of traced system requirement]"
      - "SYS-REQ-YYY: [Brief description of traced system requirement]"
    
    derivation_rationale: |
      [Explain how this feature was derived from parent system requirements.
      Show the logical connection between system capabilities and feature implementation.]

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    [Detailed description of what this feature does and why it exists.
    Explain the problem it solves and how it fits into the larger system.]
  
  business_value:
    - "[Business benefit 1]"
    - "[Business benefit 2]"
    - "[Business benefit 3]"
  
  user_story: |
    As a [user role],
    I want to [action],
    So that [benefit].
  
  acceptance_criteria:
    - "[Acceptance criterion 1]"
    - "[Acceptance criterion 2]"
    - "[Acceptance criterion 3]"

# ====================================================================================
# SHARED INTERFACES - MUST MATCH PARENT SYSTEM
# ====================================================================================
# CRITICAL: This feature MUST use the response structure defined in the parent
# SYSTEM requirements file. Inconsistent response structures cause integration failures.
# 
# Lesson from SYSTEM-003: Features with different FeatureResponse structures required
# brittle workarounds (hasattr() type detection) in orchestrators. This is now prevented
# by requiring ALL features in a system to use identical response structures.
#
# Reference: ../SYSTEM-XXX.yaml -> shared_interfaces section
#
# For CLI systems: Use cli_response_structure (ResponseStatus enum)
# For API systems: Use api_response_structure (Pydantic with success bool)
# ====================================================================================

shared_interfaces:
  response_structure: "[MUST match parent system's shared_interfaces definition]"
  
  parent_system_reference:
    file: "../SYSTEM-XXX_system_name/SYSTEM-XXX.yaml"
    section: "shared_interfaces.cli_response_structure OR shared_interfaces.api_response_structure"
  
  implementation_requirement: |
    CRITICAL RULES:
    1. Copy EXACT response structure from parent SYSTEM requirements
    2. Use IDENTICAL class names (FeatureResponse, ResponseStatus)
    3. Use IDENTICAL field names and types
    4. Import from shared module OR duplicate exactly
    5. ALL layers in this feature must use this response structure
    
    Why this matters:
    - System orchestrators depend on consistent responses
    - Type detection workarounds are brittle and error-prone
    - Tests verify response structure compliance
    - Future maintainers expect consistency
  
  verification:
    - "feature_integration.py returns FeatureResponse instances"
    - "All public methods return FeatureResponse"
    - "Response structure matches parent system exactly"
    - "ResponseStatus enum values match parent system"

# ====================================================================================
# LAYER ARCHITECTURE - AUTOMATED CREATION RECOMMENDED
# ====================================================================================
# CRITICAL: Use build_feature.py --init-layers to auto-generate layer folders!
# 
# Command: python build_feature.py --init-layers FEATURE_REQUIREMENTS.yaml
#
# This will:
#   1. Create standardized layer folders (LAYER_XXX_XXX_XXX_Layer_Name_With_Underscores)
#   2. Generate layer YAML files with AI-derived requirements
#   3. Maintain full traceability from feature → layer requirements
#   4. Create src/ and tests/ subdirectories
#   5. Ensure Python import compatibility (no spaces/hyphens in folder names)
#
# Manual folder creation is NOT RECOMMENDED - use automation to prevent:
#   - Naming mismatches (spaces/hyphens break Python imports)
#   - Missing traceability
#   - Inconsistent folder structures
# ====================================================================================

layers:
  # ---------------------------------------------------------------------------------
  # Layer definitions - Used by --init-layers to generate folders
  # ---------------------------------------------------------------------------------
  # Format:
  #   layer_id: "LAYER-XXX-XXX-XXX" (with hyphens - will be converted to underscores)
  #   name: "Layer Name" (with spaces - will be converted to underscores)
  #   Resulting folder: LAYER_XXX_XXX_XXX_Layer_Name
  # ---------------------------------------------------------------------------------
  
  - layer_id: "LAYER-XXX-XXX-001"
    name: "Layer Name 1"
    responsibility: "Brief description of what this layer does"
    technology: "Technologies/libraries used"
    requirement_file: "REQ-XXX-XXX-001.yaml"
    requirements:
      - REQ-XXX-XXX-001
    
    traceability_note: |
      Layer requirements will be AI-derived from feature requirements when using
      --init-layers. Manual layer requirements should explicitly map to feature
      requirements in the traceability section.
  
  - layer_id: "LAYER-XXX-XXX-002"
    name: "Layer Name 2"
    responsibility: "Brief description of what this layer does"
    technology: "Technologies/libraries used"
    requirement_file: "REQ-XXX-XXX-002.yaml"
    requirements:
      - REQ-XXX-XXX-002
  
  - layer_id: "LAYER-XXX-XXX-003"
    name: "Layer Name 3"
    responsibility: "Brief description of what this layer does"
    technology: "Technologies/libraries used"
    requirement_file: "REQ-XXX-XXX-003.yaml"
    requirements:
      - REQ-XXX-XXX-003

# ====================================================================================
# FEATURE REQUIREMENTS
# ====================================================================================

requirements:
  - id: "FEAT-REQ-001"
    title: "[Requirement Title]"
    description: "[Detailed description of what this requirement specifies]"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      project_requirements: ["PRJ-REQ-XXX"]
      system_requirements: ["SYS-REQ-XXX"]
      layer_requirements: ["REQ-XXX-XXX-001"]
  
  - id: "FEAT-REQ-002"
    title: "[Requirement Title]"
    description: "[Detailed description]"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      project_requirements: ["PRJ-REQ-XXX"]
      system_requirements: ["SYS-REQ-XXX"]
      layer_requirements: ["REQ-XXX-XXX-002"]

# ====================================================================================
# INTEGRATION POINTS
# ====================================================================================

integration:
  upstream_features: 
    - "[Feature ID that this feature depends on]"
  
  downstream_features:
    - "[Feature ID that depends on this feature]"
  
  shared_components:
    - "src/shared/models"
    - "src/shared/exceptions"
    - "src/shared/utils"

# ====================================================================================
# IMPLEMENTATION NOTES
# ====================================================================================

implementation:
  week_1_deliverables:
    - "[Deliverable 1]"
    - "[Deliverable 2]"
    - "[Deliverable 3]"
  
  dependencies:
    - "[External dependency 1]"
    - "[External dependency 2]"
  
  testing_approach:
    - "[Test approach 1]"
    - "[Test approach 2]"

# ====================================================================================
# TESTING STRATEGY
# ====================================================================================

testing:
  unit_tests:
    location: "tests/unit/"
    coverage_target: "90%"
  
  integration_tests:
    location: "tests/integration/"
    scenarios:
      - "Layer-to-layer integration"
      - "Error propagation"
      - "Data transformation pipeline"
  
  e2e_tests:
    location: "tests/e2e/"
    scenarios:
      - "Complete feature workflow"

# ====================================================================================
# TRACEABILITY
# ====================================================================================

traceability:
  implements_project_requirements:
    - PRJ-REQ-XXX
    - PRJ-REQ-YYY
  
  implements_system_requirements:
    - SYS-REQ-XXX
    - SYS-REQ-YYY
  
  distills_to_layers:
    - LAYER-001: REQ-XXX-XXX-001 ([Layer 1 Name])
    - LAYER-002: REQ-XXX-XXX-002 ([Layer 2 Name])
    - LAYER-003: REQ-XXX-XXX-003 ([Layer 3 Name])

# ====================================================================================
# DEPLOYMENT
# ====================================================================================
# NOTE: The 'deployment' section below covers package dependencies and manual steps.
# For AUTOMATIC wiring into the production app (router registration, endpoint
# creation), see the 'production_integration' section further down.
# ====================================================================================

deployment:
  dependencies:
    - package: "[package_name]"
      version: "[version]"
      purpose: "[why needed]"
  
  configuration_required:
    - setting: "[config_key]"
      value: "[default_value]"
      location: "config/settings.yaml"
  
  deployment_steps:
    - "Run layer unit tests"
    - "Run integration tests"
    - "Deploy feature module"
    - "Verify E2E tests"

# ====================================================================================
# FEATURE-LEVEL VERIFICATION
# ====================================================================================
# After all layers are built, the build system must generate feature-level
# verification artifacts that validate the complete integrated feature.
# ====================================================================================

feature_level_verification:
  required: true
  description: |
    After all layers complete, generate feature-level test pyramid and 
    requirements verification artifacts that validate the integrated feature.
  
  artifacts:
    location: "Requirements Verification/"
    required_files:
      - name: "feature_requirements_verification_{timestamp}.yaml"
        description: "Validates all feature requirements are satisfied"
        contents:
          - "Feature requirement traceability"
          - "Cross-layer integration validation"
          - "Feature acceptance criteria status"
          - "Feature-level quality metrics"
      
      - name: "feature_test_pyramid_{timestamp}.yaml"
        description: "Feature-level test pyramid report"
        contents:
          - "Feature integration test count"
          - "Feature E2E test count"
          - "Feature test coverage percentage"
          - "Cross-layer test statistics"
      
      - name: "feature_traceability_matrix_{timestamp}.yaml"
        description: "Complete feature traceability"
        contents:
          - "Feature → Layer mapping"
          - "Feature → System requirements mapping"
          - "Feature → Project requirements mapping"
          - "Feature acceptance test results"
      
      - name: "feature_quality_gates_{timestamp}.yaml"
        description: "Feature-level quality gate results"
        contents:
          - "All layers quality gate status"
          - "Feature integration quality gate"
          - "Feature E2E quality gate"
          - "Overall feature readiness score"
  
  test_execution:
    integration_tests:
      description: "Run feature-level integration tests across all layers"
      test_directory: "tests/integration/"
      required: true
    
    e2e_tests:
      description: "Run feature-level end-to-end tests"
      test_directory: "tests/e2e/"
      required: true
  
  quality_gates:
    - gate: "All layers passed individual quality gates"
      required: true
    
    - gate: "Feature integration tests pass"
      required: true
    
    - gate: "Feature E2E tests pass"
      required: true
    
    - gate: "Feature test coverage >= 85%"
      required: true
    
    - gate: "No critical integration issues"
      required: true

# ====================================================================================
# PRODUCTION INTEGRATION - Auto-wiring into the live application
# ====================================================================================
# CRITICAL: Without this section, the AI Feature Builder generates code that sits
# orphaned in the feature directory — never imported or served by the running app.
#
# When present, the builder automatically patches the target router/app file after
# building so the feature's FeatureOrchestrator is imported and its operations are
# exposed as API endpoints (or CLI commands, depending on your architecture).
#
# The wiring is idempotent — re-running the build will skip if already connected.
# ====================================================================================

production_integration:
  # Path to the router/app file to patch (relative to repo root)
  target_router_file: "[e.g. src/backend/app/my_router.py]"

  # Production entry point that Railway/uvicorn runs (relative to repo root).
  # The builder will verify the target_router is include_router()'d here,
  # and auto-mount it if missing. Default: main.py
  app_entry_point: "main.py"
  
  # Unique alias for the imported FeatureOrchestrator (used in generated code)
  import_alias: "[e.g. MyFeatureService]"
  
  # Unique module name for importlib loading (avoids collisions between features
  # that all export FeatureOrchestrator)
  module_name: "[e.g. feature_integration_XX]"
  
  # URL path prefix for all endpoints (appended to the router's existing prefix)
  endpoint_prefix: "[e.g. /my-feature]"
  
  # Auto-generate a GET <prefix>/health endpoint (recommended: true)
  health_endpoint: true
  
  # Pydantic request models that the builder will generate in the target file
  # Omit this if all operations are simple GETs with no request body
  pydantic_models:
    - name: "[e.g. MyFeatureRequest]"
      fields:
        - name: "[field_name]"
          type: "[e.g. str, int, List[float], Dict[str, Any]]"
          default: "[e.g. ..., None, 10, 'default_value']"  # Use ... for required
          description: "[What this field is for]"
  
  # Operations to expose as API endpoints
  # Each operation maps to a method on the FeatureOrchestrator
  operations:
    - name: "[endpoint_function_name]"      # Python function name for the endpoint
      http_method: "[get|post|put|delete]"   # HTTP method
      path: "[e.g. /analyze]"               # Path suffix (appended to endpoint_prefix)
      description: "[What this endpoint does]"
      request_model: "[e.g. MyFeatureRequest]"  # Omit for GET endpoints with no body
      orchestrator_method: "[e.g. execute]"     # Method to call on FeatureOrchestrator
      orchestrator_args: "[e.g. request.data, request.params]"  # Args to pass
    
    - name: "[status_endpoint_name]"
      http_method: "get"
      path: "/status"
      description: "Get feature service status"
      orchestrator_method: "get_status"

# ====================================================================================
# FRONTEND INTEGRATION - For features that include a UI/dashboard layer
# ====================================================================================
# If the feature includes a React/JSX dashboard layer, this section tells the
# builder where the frontend app lives and how to wire the component into it.
# The builder will:
#   1. Copy the layer's implementation.jsx → pages/<page_component_name>.jsx
#   2. Add an import + <Route> to App.jsx
#   3. Add a nav link to Layout.jsx (if nav_label is provided)
#   4. Fix API URLs in the component to match the production_integration endpoints
#   5. Rebuild the Vite/webpack bundle and copy output to static/
#
# OMIT this entire section if the feature has no frontend/UI layer.
# ====================================================================================
frontend_integration:
  # Path to the React app directory (relative to repo root), containing
  # package.json, src/App.jsx, and src/components/Layout.jsx
  target_app_dir: "[e.g. path/to/dashboard-app]"

  # Route path where the page will be accessible (e.g. /predictions)
  route_path: "[e.g. /my-feature]"

  # Label for the navigation link (shown in the top nav bar)
  nav_label: "[e.g. My Feature]"

  # Emoji icon for the nav link (optional)
  nav_icon: "[e.g. 📊]"

  # React component name — the component's default export name, also used as the
  # filename: pages/<page_component_name>.jsx
  page_component_name: "[e.g. MyFeatureDashboard]"

# ====================================================================================
# FEATURE INTEGRATION CODE CONSTRAINTS - For feature_integration.py generation
# ====================================================================================
# These constraints apply when AI generates the feature_integration.py file that
# orchestrates all layers. Critical for preventing method name mismatches.
# ====================================================================================
feature_integration_constraints:
  
  # Output Format Rules
  output_format:
    - "Return ONLY raw Python code for feature_integration.py"
    - "NO markdown code fences (```python or ```)"
    - "File must start with import statements"
    - "File must be directly executable Python"
  
  # Layer Method Usage - CRITICAL: Prevents calling non-existent methods
  layer_api_usage:
    - "ONLY call methods that exist in the actual layer implementations"
    - "Layer method names will be provided in: 'Available Layer Methods' section"
    - "DO NOT invent method names like validate_strict, process_all, etc."
    - "DO NOT create variations of listed methods"
    - "Use EXACT method names from layer implementations"
    - "If unsure, refer back to Available Layer Methods list"
  
  # Config Field Usage - CRITICAL: Prevents config instantiation errors
  config_field_usage:
    - "FeatureConfig dataclass fields will be listed in generation prompt"
    - "ONLY use field names from the provided FeatureConfig field list"
    - "DO NOT invent new config fields"
    - "Field names must match EXACTLY (case-sensitive)"
    - "settings.yaml must use same field names as FeatureConfig dataclass"
  
  # Standard Class Names - Ensures consistency across features
  naming_conventions:
    - "Main orchestrator class MUST be named: FeatureOrchestrator"
    - "Config class MUST be named: FeatureConfig (using @dataclass)"
    - "Response class MUST be named: FeatureResponse"
    - "Status enum SHOULD be named: ResponseStatus"
  
  # Import Requirements
  import_completeness:
    - "Import ALL layer implementation modules"
    - "Import ALL types used in type hints (Tuple, Dict, List, Optional, Any, Union)"
    - "Import dataclasses decorator: from dataclasses import dataclass"
    - "Import Enum if using response status enums"
  
  # Code Quality
  quality_requirements:
    - "Complete implementation - NO stub methods"
    - "Proper error handling with try/except where appropriate"
    - "Return FeatureResponse objects with proper status and data"
    - "Initialize all layers in __init__ method"
    - "NO placeholder TODOs or FIXME comments"

# ====================================================================================
# END OF FEATURE REQUIREMENTS INDEX
# ====================================================================================
