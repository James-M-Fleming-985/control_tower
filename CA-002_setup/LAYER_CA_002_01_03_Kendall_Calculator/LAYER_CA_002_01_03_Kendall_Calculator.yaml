# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Kendall Tau Correlation Calculator"
  
  description: |
    Implements Kendall's tau correlation coefficient calculation for measuring
    the ordinal association between two continuous or ordinal variables. This
    layer computes both tau-a (without tie correction) and tau-b (with tie
    correction), provides significance testing via p-values, and handles edge
    cases such as perfect monotonic relationships and datasets with extensive
    tied values. The implementation optimizes for performance using vectorized
    operations while maintaining numerical stability.
  
  rationale: |
    Kendall tau correlation is essential for financial analysis because it:
    1. Is robust to outliers unlike Pearson correlation
    2. Captures monotonic relationships without assuming linearity
    3. Works well with ordinal data (e.g., credit ratings, rankings)
    4. Provides meaningful results even with non-normal distributions
    5. Offers interpretable concordance/discordance measures
    
    This makes it particularly valuable for analyzing relationships in financial
    markets where data often violates normality assumptions and contains outliers.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/correlation_analysis/kendall_calculator.py"
    modules:
      - "kendall_calculator.py  # Main Kendall tau calculation implementation"
      - "kendall_utils.py      # Utility functions for concordance/discordance"
      - "__init__.py           # Package initialization"
  
  # Main classes/functions to implement
  classes:
    - name: "KendallCalculator"
      purpose: "Calculate Kendall tau correlation coefficients with tie handling"
      methods:
        - name: "__init__"
          signature: "__init__(self, method: str = 'auto')"
          purpose: "Initialize calculator with computation method selection"
          example: |
            # Example usage
            calculator = KendallCalculator(method='exact')
        
        - name: "calculate"
          signature: "calculate(x: np.ndarray, y: np.ndarray, variant: str = 'b') -> Tuple[float, float]"
          purpose: "Compute Kendall tau coefficient and p-value"
          example: |
            # Example usage
            tau, p_value = calculator.calculate(series1, series2, variant='b')
        
        - name: "calculate_batch"
          signature: "calculate_batch(data: np.ndarray, pairs: List[Tuple[int, int]]) -> Dict[Tuple[int, int], Tuple[float, float]]"
          purpose: "Efficiently calculate multiple pairwise correlations"
          example: |
            # Example usage
            results = calculator.calculate_batch(data_matrix, [(0,1), (0,2), (1,2)])
        
        - name: "_count_concordant_discordant"
          signature: "_count_concordant_discordant(x: np.ndarray, y: np.ndarray) -> Tuple[int, int, int, int]"
          purpose: "Count concordant, discordant, and tied pairs"
          example: |
            # Internal method
            c, d, tx, ty = self._count_concordant_discordant(x, y)
        
        - name: "_calculate_tau_a"
          signature: "_calculate_tau_a(concordant: int, discordant: int, n: int) -> float"
          purpose: "Calculate Kendall tau-a (no tie correction)"
          example: |
            # Internal method
            tau_a = self._calculate_tau_a(c, d, n)
        
        - name: "_calculate_tau_b"
          signature: "_calculate_tau_b(concordant: int, discordant: int, ties_x: int, ties_y: int, n: int) -> float"
          purpose: "Calculate Kendall tau-b (with tie correction)"
          example: |
            # Internal method
            tau_b = self._calculate_tau_b(c, d, tx, ty, n)
        
        - name: "_calculate_p_value"
          signature: "_calculate_p_value(tau: float, n: int) -> float"
          purpose: "Calculate two-tailed p-value for hypothesis testing"
          example: |
            # Internal method
            p_value = self._calculate_p_value(tau, n)
  
  # Key technical details
  implementation_details:
    libraries: ["numpy", "scipy.stats", "numba", "pandas"]
    patterns: ["Strategy Pattern", "Factory Pattern", "Memoization"]
    error_handling:
      - error_type: "ValueError"
        handling: "Raise when input arrays have different lengths or less than 2 elements"
      - error_type: "TypeError"
        handling: "Raise when inputs are not numeric arrays"
      - error_type: "RuntimeWarning"
        handling: "Warn when all values are tied (undefined correlation)"
  
  # Input/output contract
  inputs:
    - name: "x"
      type: "np.ndarray"
      description: "First variable array (1D numeric values)"
      example: "np.array([1.2, 3.4, 2.1, 4.5, 3.2])"
    
    - name: "y"
      type: "np.ndarray"
      description: "Second variable array (1D numeric values)"
      example: "np.array([2.1, 3.8, 1.9, 4.2, 3.5])"
    
    - name: "variant"
      type: "str"
      description: "Kendall tau variant: 'a' (no ties) or 'b' (with ties)"
      example: "'b'"
  
  outputs:
    - name: "tau"
      type: "float"
      description: "Kendall tau correlation coefficient [-1, 1]"
      example: "0.8"
    
    - name: "p_value"
      type: "float"
      description: "Two-tailed p-value for hypothesis test"
      example: "0.0167"

