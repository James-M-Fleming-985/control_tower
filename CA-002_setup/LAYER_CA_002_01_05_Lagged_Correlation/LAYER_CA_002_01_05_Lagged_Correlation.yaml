# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Lagged Correlation Calculator"
  
  description: |
    Computes correlation coefficients between time series with temporal lags,
    identifying lead-lag relationships where one series precedes another. Supports
    multiple lag windows, handles missing data alignment, and provides statistical
    significance testing for lagged correlations. Optimized for financial time series
    with irregular timestamps and gaps.
  
  rationale: |
    Financial markets often exhibit lead-lag relationships where price movements
    in one asset precede movements in another. Traditional correlation only measures
    simultaneous relationships. This layer provides lagged correlation analysis to:
    - Identify predictive relationships between assets
    - Detect market microstructure patterns
    - Enable lead-lag arbitrage strategy development
    - Support risk forecasting based on leading indicators

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/correlation_analysis/lagged_correlation.py"
    modules:
      - "lagged_correlation.py"     # Main lagged correlation calculator
      - "lag_optimizer.py"          # Optimal lag detection algorithms
      - "significance_tests.py"     # Statistical significance for lagged correlations
  
  # Main classes/functions to implement
  classes:
    - name: "LaggedCorrelationCalculator"
      purpose: "Calculates correlation coefficients at various time lags"
      methods:
        - name: "calculate_lagged_correlation"
          signature: "calculate_lagged_correlation(x: np.ndarray, y: np.ndarray, lags: List[int], timestamps_x: np.ndarray = None, timestamps_y: np.ndarray = None) -> Dict[int, float]"
          purpose: "Compute correlation at specified lag intervals"
          example: |
            # Example usage
            calc = LaggedCorrelationCalculator()
            correlations = calc.calculate_lagged_correlation(
                x=price_series_1,
                y=price_series_2,
                lags=[-10, -5, 0, 5, 10],
                timestamps_x=timestamps_1,
                timestamps_y=timestamps_2
            )
            # Returns: {-10: 0.45, -5: 0.72, 0: 0.85, 5: 0.68, 10: 0.41}
        
        - name: "find_optimal_lag"
          signature: "find_optimal_lag(x: np.ndarray, y: np.ndarray, max_lag: int = 50, timestamps_x: np.ndarray = None, timestamps_y: np.ndarray = None) -> Tuple[int, float]"
          purpose: "Identify lag with maximum absolute correlation"
          example: |
            optimal_lag, max_corr = calc.find_optimal_lag(x, y, max_lag=20)
            # Returns: (7, 0.92) - maximum correlation of 0.92 at lag 7
        
        - name: "calculate_cross_correlation"
          signature: "calculate_cross_correlation(x: np.ndarray, y: np.ndarray, max_lag: int = None) -> Tuple[np.ndarray, np.ndarray]"
          purpose: "Compute full cross-correlation function"
          example: |
            lags, correlations = calc.calculate_cross_correlation(x, y)
    
    - name: "LagSignificanceTester"
      purpose: "Test statistical significance of lagged correlations"
      methods:
        - name: "test_significance"
          signature: "test_significance(correlation: float, n_samples: int, lag: int, method: str = 'bartlett') -> Tuple[float, bool]"
          purpose: "Calculate p-value and significance of lagged correlation"
        
        - name: "confidence_intervals"
          signature: "confidence_intervals(correlation: float, n_samples: int, lag: int, confidence: float = 0.95) -> Tuple[float, float]"
          purpose: "Compute confidence intervals for lagged correlation"
    
    - name: "TimeAlignedLagCalculator"
      purpose: "Handle time series with irregular timestamps and missing data"
      methods:
        - name: "align_and_lag"
          signature: "align_and_lag(x: np.ndarray, y: np.ndarray, timestamps_x: np.ndarray, timestamps_y: np.ndarray, lag_seconds: int, method: str = 'linear') -> Tuple[np.ndarray, np.ndarray]"
          purpose: "Align irregular time series with specified lag in seconds"
  
  # Key technical details
  implementation_details:
    libraries: ["numpy", "scipy", "pandas", "numba"]
    patterns: ["Strategy Pattern", "Builder Pattern", "Caching"]
    error_handling:
      - error_type: "InsufficientDataError"
        handling: "Raise when series too short for requested lag"
      - error_type: "TimestampAlignmentError"
        handling: "Raise when timestamps cannot be aligned"
      - error_type: "InvalidLagError"
        handling: "Raise when lag exceeds series length"
  
  # Input/output contract
  inputs:
    - name: "x_series"
      type: "np.ndarray"
      description: "First time series data array"
      example: "np.array([100.5, 101.2, 99.8, ...])"
    
    - name: "y_series"
      type: "np.ndarray"
      description: "Second time series data array"
      example: "np.array([50.1, 50.8, 49.5, ...])"
    
    - name: "lag_values"
      type: "List[int] or int"
      description: "Lag periods to calculate (negative = x leads y)"
      example: "[-10, -5, 0, 5, 10] or 7"
    
    - name: "timestamps"
      type: "Optional[np.ndarray]"
      description: "Unix timestamps for irregular time series"
      example: "np.array([1640995200, 1640995260, ...])"
  
  outputs:
    - name: "lagged_correlations"
      type: "Dict[int, float] or float"
      description: "Correlation coefficient(s) at specified lag(s)"
      example: "{-5: 0.72, 0: 0.85, 5: 0.68}"
    
    - name: "significance_results"
      type: "Dict[str, Any]"
      description: "Statistical significance test results"
      example: "{'p_value': 0.001, 'significant': True, 'confidence_interval': (0.65, 0.79)}"

