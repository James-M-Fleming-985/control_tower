acceptance_criteria:
  - criterion: "Correctly calculates lagged correlations for various lag values"
    test: "Unit test with known synthetic data where correlation patterns are predetermined"
    example: |
      # Create sine waves with known phase shift
      pytest tests/unit/test_lagged_correlation.py::test_known_phase_shift -v
  
  - criterion: "Handles irregular timestamps and missing data appropriately"
    test: "Test with real market data containing gaps and irregular intervals"
    example: |
      pytest tests/unit/test_lagged_correlation.py::test_irregular_timestamps -v
  
  - criterion: "Finds optimal lag that maximizes absolute correlation"
    test: "Verify optimal lag detection on data with known lead-lag relationship"
    example: |
      pytest tests/unit/test_lagged_correlation.py::test_optimal_lag_detection -v
  
  - criterion: "Provides accurate statistical significance testing"
    test: "Compare p-values against reference statistical packages"
    example: |
      pytest tests/unit/test_lagged_correlation.py::test_significance_accuracy -v
  
  - criterion: "Achieves sub-second performance for 10,000 data points"
    test: "Performance benchmark with various data sizes"
    example: |
      pytest tests/performance/test_lagged_correlation_performance.py -v

