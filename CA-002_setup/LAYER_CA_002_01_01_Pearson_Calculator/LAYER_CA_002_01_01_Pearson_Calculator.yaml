# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Pearson Correlation Calculator"
  
  description: |
    Calculates Pearson correlation coefficients between pairs of time series data.
    Implements the standard Pearson product-moment correlation coefficient formula
    with proper handling of missing values, edge cases, and numerical stability.
    Provides p-values for hypothesis testing and confidence intervals for the
    correlation estimates. Optimized for both small and large datasets.
  
  rationale: |
    Pearson correlation is fundamental for identifying linear relationships between
    engineering metrics. This layer provides a robust, tested implementation that
    handles real-world data challenges like missing values and numerical precision.
    It serves as the core correlation method for the analytics system, enabling
    engineers to discover relationships between metrics like response time and
    error rate, CPU usage and throughput, etc.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/pearson_calculator/calculator.py"
    modules:
      - "calculator.py"        # Main PearsonCalculator class implementation
      - "validators.py"        # Input validation and data quality checks
      - "statistics.py"        # Statistical helper functions (p-values, confidence intervals)
      - "__init__.py"         # Package initialization
  
  # Main classes/functions to implement
  classes:
    - name: "PearsonCalculator"
      purpose: "Calculate Pearson correlation coefficients with statistical significance"
      methods:
        - name: "calculate"
          signature: "calculate(x: np.ndarray, y: np.ndarray, confidence_level: float = 0.95) -> CorrelationResult"
          purpose: "Compute Pearson correlation with p-value and confidence interval"
          example: |
            # Example usage
            calculator = PearsonCalculator()
            result = calculator.calculate(
                x=np.array([1.2, 2.3, 3.1, 4.5, 5.2]),
                y=np.array([2.1, 4.2, 6.3, 8.1, 10.4]),
                confidence_level=0.95
            )
            # result.coefficient = 0.998
            # result.p_value = 0.0001
            # result.confidence_interval = (0.985, 0.999)
        
        - name: "calculate_matrix"
          signature: "calculate_matrix(data: pd.DataFrame, columns: List[str] = None) -> pd.DataFrame"
          purpose: "Calculate correlation matrix for multiple variables"
          example: |
            # Example usage
            df = pd.DataFrame({
                'cpu': [45, 50, 55, 60, 65],
                'memory': [70, 72, 75, 78, 82],
                'response_time': [120, 125, 130, 140, 145]
            })
            corr_matrix = calculator.calculate_matrix(df)
        
        - name: "validate_inputs"
          signature: "validate_inputs(x: np.ndarray, y: np.ndarray) -> Tuple[np.ndarray, np.ndarray]"
          purpose: "Validate and clean input arrays, handle missing values"
    
    - name: "CorrelationResult"
      purpose: "Data class to hold correlation calculation results"
      methods:
        - name: "__init__"
          signature: "__init__(coefficient: float, p_value: float, confidence_interval: Tuple[float, float], n_samples: int)"
          purpose: "Initialize correlation result object"
  
  # Key technical details
  implementation_details:
    libraries: ["numpy", "scipy", "pandas", "numba"]
    patterns: ["Strategy Pattern", "Builder Pattern", "Value Object Pattern"]
    error_handling:
      - error_type: "InsufficientDataError"
        handling: "Raise when n < 3 samples provided"
      - error_type: "ConstantVariableError"
        handling: "Raise when variable has zero variance"
      - error_type: "NumericalInstabilityError"
        handling: "Use alternative formula for near-perfect correlations"
  
  # Input/output contract
  inputs:
    - name: "x"
      type: "np.ndarray"
      description: "First variable time series data"
      example: "[1.2, 2.3, 3.1, 4.5, 5.2]"
    
    - name: "y"
      type: "np.ndarray"
      description: "Second variable time series data"
      example: "[2.1, 4.2, 6.3, 8.1, 10.4]"
    
    - name: "confidence_level"
      type: "float"
      description: "Confidence level for interval estimation (0-1)"
      example: "0.95"
  
  outputs:
    - name: "correlation_result"
      type: "CorrelationResult"
      description: "Object containing correlation coefficient, p-value, and confidence interval"
      example: "CorrelationResult(coefficient=0.998, p_value=0.0001, confidence_interval=(0.985, 0.999), n_samples=5)"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "Correctly calculates Pearson correlation for perfect positive correlation"
    test: "Test with x=[1,2,3,4,5] and y=[2,4,6,8,10], expect r=1.0"
    example: |
      # Example test command
      pytest tests/unit/test_pearson_calculator.py::test_perfect_positive_correlation -v
  
  - criterion: "Correctly calculates Pearson correlation for perfect negative correlation"
    test: "Test with x=[1,2,3,4,5] and y=[10,8,6,4,2], expect r=-1.0"
  
  - criterion: "Handles missing values appropriately"
    test: "Test with arrays containing NaN values, verify pairwise deletion"
  
  - criterion: "Raises appropriate errors for invalid inputs"
    test: "Test with constant arrays, empty arrays, mismatched lengths"
  
  - criterion: "Performance requirement: Calculate correlation for 10,000 points in <100ms"
    test: "Benchmark test with large datasets"
  
  - criterion: "Numerical stability for high-magnitude values"
    test: "Test with values in range 1e6 to 1e9"

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build Pearson Calculator (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_pearson_calculator.py"
      tests:
        - "test_perfect_positive_correlation"
        - "test_perfect_negative_correlation"
        - "test_no_correlation"
        - "test_missing_values_handling"
        - "test_insufficient_data_error"
        - "test_constant_variable_error"
      duration: "2 hours"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_pearson_calculator.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement PearsonCalculator class (GREEN phase)"
      file: "src/pearson_calculator/calculator.py"
      methods:
        - "calculate() → CorrelationResult"
        - "validate_inputs() → Tuple[np.ndarray, np.ndarray]"
        - "_compute_correlation() → float"
        - "_compute_p_value() → float"
        - "_compute_confidence_interval() → Tuple[float, float]"
      duration: "3 hours"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_pearson_calculator.py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "Extract validation logic to validators.py"
        - "Optimize correlation calculation using numba JIT"
        - "Add comprehensive docstrings"
        - "Implement calculate_matrix method"
      duration: "2 hours"
    
    - step: 6
      action: "Integration test with data preprocessor"
      file: "tests/integration/test_pearson_with_preprocessor.py"
      duration: "1 hour"
  
  total_time: "8 hours"
  
  deliverable: "Fully tested PearsonCalculator class with >90% coverage"

