# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Spearman Rank Correlation Calculator"
  
  description: |
    Calculates the Spearman rank correlation coefficient between pairs of crypto
    asset price series. Converts raw price data to rank order, then computes
    correlation on ranks using the formula: ρ = 1 - (6Σd²)/(n(n²-1)) where d is
    the difference between ranks. Handles tied values using average rank method.
    Provides p-values for statistical significance testing.
  
  rationale: |
    Spearman correlation is essential for crypto asset analysis because it:
    1. Works well with non-linear monotonic relationships common in crypto
    2. Is robust to outliers and extreme price movements
    3. Doesn't assume normal distribution of returns
    4. Captures directional relationships even when not linear
    This complements Pearson correlation by providing alternative perspective
    on asset relationships.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/spearman_calculator/spearman.py"
    modules:
      - "spearman.py"        # Main Spearman correlation calculator implementation
      - "ranking.py"         # Ranking utilities for converting values to ranks
      - "significance.py"    # Statistical significance testing for correlations
  
  # Main classes/functions to implement
  classes:
    - name: "SpearmanCalculator"
      purpose: "Calculates Spearman rank correlation coefficients"
      methods:
        - name: "calculate_correlation"
          signature: "calculate_correlation(x: np.ndarray, y: np.ndarray) -> Tuple[float, float]"
          purpose: "Calculate Spearman correlation and p-value for two series"
          example: |
            # Example usage
            calculator = SpearmanCalculator()
            rho, p_value = calculator.calculate_correlation(btc_prices, eth_prices)
        
        - name: "calculate_matrix"
          signature: "calculate_matrix(data: pd.DataFrame) -> Tuple[pd.DataFrame, pd.DataFrame]"
          purpose: "Calculate correlation matrix for multiple assets"
          example: |
            # Example usage
            corr_matrix, p_matrix = calculator.calculate_matrix(price_df)
        
        - name: "rank_data"
          signature: "rank_data(data: np.ndarray, method: str = 'average') -> np.ndarray"
          purpose: "Convert raw values to ranks with tie handling"
          example: |
            # Example usage
            ranks = calculator.rank_data(prices, method='average')
  
  # Key technical details
  implementation_details:
    libraries: ["numpy", "scipy.stats", "pandas"]
    patterns: ["Strategy Pattern", "Builder Pattern"]
    error_handling:
      - error_type: "InsufficientDataError"
        handling: "Raise when series length < 3 (minimum for correlation)"
      - error_type: "DataMismatchError"
        handling: "Raise when input series have different lengths"
      - error_type: "NaNError"
        handling: "Handle missing values with configurable strategies"
  
  # Input/output contract
  inputs:
    - name: "price_series_x"
      type: "np.ndarray or pd.Series"
      description: "First asset's price time series"
      example: "[100.5, 102.3, 99.8, 103.1, 101.2]"
    
    - name: "price_series_y"
      type: "np.ndarray or pd.Series"
      description: "Second asset's price time series"
      example: "[2000.1, 2050.5, 1980.3, 2100.2, 2030.7]"
    
    - name: "price_dataframe"
      type: "pd.DataFrame"
      description: "DataFrame with multiple asset price columns"
      example: "DataFrame with columns ['BTC', 'ETH', 'SOL'] and datetime index"
  
  outputs:
    - name: "correlation_coefficient"
      type: "float"
      description: "Spearman rho value between -1 and 1"
      example: "0.823"
    
    - name: "p_value"
      type: "float"
      description: "Statistical significance of correlation"
      example: "0.0023"
    
    - name: "correlation_matrix"
      type: "pd.DataFrame"
      description: "Matrix of pairwise Spearman correlations"
      example: "3x3 DataFrame with asset pairs and correlation values"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "Correctly calculates Spearman correlation for perfect monotonic relationships"
    test: "Test with perfectly ranked data yields rho = 1.0 or -1.0"
    example: |
      # Example test command
      pytest tests/unit/test_spearman_calculator.py::test_perfect_correlation -v
  
  - criterion: "Handles tied ranks using average rank method"
    test: "Verify tied values receive average of ranks they would occupy"
    example: |
      # Test with data containing ties
      pytest tests/unit/test_ranking.py::test_tied_ranks -v
  
  - criterion: "Produces valid p-values for significance testing"
    test: "P-values between 0 and 1, consistent with scipy.stats.spearmanr"
    example: |
      # Compare against scipy reference implementation
      pytest tests/unit/test_significance.py::test_p_value_validity -v
  
  - criterion: "Performance meets requirements (< 100ms for 1000 data points)"
    test: "Benchmark correlation calculation speed"
    example: |
      # Performance test
      pytest tests/performance/test_spearman_performance.py -v

