# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Partial Correlation Calculator"
  
  description: |
    Calculates partial correlations between variables while controlling for the
    effects of one or more other variables. This layer implements both first-order
    (controlling for one variable) and higher-order (controlling for multiple
    variables) partial correlations using matrix algebra and statistical methods.
    
    The layer handles:
    - First-order partial correlations using direct formula
    - Higher-order partial correlations using recursive computation
    - Partial correlation matrices for multiple variable pairs
    - Statistical significance testing for partial correlations
    - Handling of missing data and edge cases
  
  rationale: |
    In financial markets, variables are often interconnected through complex
    relationships. Simple correlations can be misleading when confounding
    variables influence both variables of interest. Partial correlation analysis
    removes these confounding effects, revealing true relationships between
    variables. This is critical for risk assessment, portfolio construction,
    and understanding market dynamics where multiple factors interact simultaneously.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/partial_correlation/calculator.py"
    modules:
      - "calculator.py          # Main partial correlation calculator class"
      - "algorithms.py          # Core mathematical algorithms"
      - "matrix_operations.py   # Matrix algebra utilities"
      - "significance_tests.py  # Statistical significance testing"
  
  # Main classes/functions to implement
  classes:
    - name: "PartialCorrelationCalculator"
      purpose: "Main class for computing partial correlations"
      methods:
        - name: "calculate_first_order"
          signature: "calculate_first_order(x: np.ndarray, y: np.ndarray, z: np.ndarray) -> float"
          purpose: "Calculate partial correlation between x and y controlling for z"
          example: |
            # Example usage
            calculator = PartialCorrelationCalculator()
            partial_corr = calculator.calculate_first_order(x_data, y_data, control_var)
            
        - name: "calculate_higher_order"
          signature: "calculate_higher_order(data: pd.DataFrame, x_col: str, y_col: str, control_cols: List[str]) -> float"
          purpose: "Calculate partial correlation controlling for multiple variables"
          example: |
            # Example usage
            partial_corr = calculator.calculate_higher_order(
                df, 'var1', 'var2', ['control1', 'control2', 'control3']
            )
            
        - name: "calculate_matrix"
          signature: "calculate_matrix(data: pd.DataFrame, control_vars: List[str], method: str = 'pearson') -> pd.DataFrame"
          purpose: "Calculate partial correlation matrix for all variable pairs"
          example: |
            # Example usage
            partial_corr_matrix = calculator.calculate_matrix(
                data_df, control_vars=['market_index', 'volatility']
            )
            
        - name: "test_significance"
          signature: "test_significance(partial_corr: float, n: int, k: int) -> Tuple[float, float]"
          purpose: "Test statistical significance of partial correlation"
          example: |
            # Example usage
            t_stat, p_value = calculator.test_significance(0.65, 100, 3)
  
  # Key technical details
  implementation_details:
    libraries: ["numpy", "pandas", "scipy", "statsmodels"]
    patterns: ["Strategy Pattern", "Factory Pattern for different correlation methods"]
    error_handling:
      - error_type: "InsufficientDataError"
        handling: "Raise when n <= k + 3 (insufficient degrees of freedom)"
      - error_type: "SingularMatrixError"
        handling: "Handle singular correlation matrices with regularization"
      - error_type: "InvalidControlVariableError"
        handling: "Validate control variables exist and have sufficient variance"
  
  # Input/output contract
  inputs:
    - name: "data"
      type: "pd.DataFrame or np.ndarray"
      description: "Input data containing variables for analysis"
      example: "DataFrame with columns ['stock_A', 'stock_B', 'market_index', 'volatility']"
    
    - name: "x_variable"
      type: "str or np.ndarray"
      description: "First variable of interest"
      example: "'stock_A' or array([1.2, 1.3, 1.1, ...])"
    
    - name: "y_variable"
      type: "str or np.ndarray"
      description: "Second variable of interest"
      example: "'stock_B' or array([2.1, 2.3, 2.0, ...])"
    
    - name: "control_variables"
      type: "List[str] or List[np.ndarray]"
      description: "Variables to control for in partial correlation"
      example: "['market_index', 'volatility', 'sector_performance']"
  
  outputs:
    - name: "partial_correlation"
      type: "float or pd.DataFrame"
      description: "Partial correlation coefficient(s) between -1 and 1"
      example: "0.456 or DataFrame with partial correlation matrix"
    
    - name: "significance_results"
      type: "Dict[str, float]"
      description: "Statistical significance test results"
      example: "{'t_statistic': 4.82, 'p_value': 0.0001, 'df': 96}"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "Correctly calculates first-order partial correlations"
    test: "Compare results with R's pcor.test() function on known datasets"
    example: |
      # Example test command
      pytest tests/unit/test_partial_correlation.py::test_first_order_accuracy -v
  
  - criterion: "Handles higher-order partial correlations with multiple control variables"
    test: "Verify recursive algorithm matches theoretical values"
    example: |
      pytest tests/unit/test_partial_correlation.py::test_higher_order_calculation -v
  
  - criterion: "Produces symmetric partial correlation matrices"
    test: "Verify matrix[i,j] == matrix[j,i] for all i,j"
    example: |
      pytest tests/unit/test_partial_correlation.py::test_matrix_symmetry -v
  
  - criterion: "Correctly identifies statistical significance"
    test: "Verify p-values match theoretical t-distribution"
    example: |
      pytest tests/unit/test_partial_correlation.py::test_significance_testing -v
  
  - criterion: "Performance meets requirements for large datasets"
    test: "Process 1000x1000 correlation matrix in under 2 seconds"
    example: |
      pytest tests/performance/test_partial_corr_performance.py -v

