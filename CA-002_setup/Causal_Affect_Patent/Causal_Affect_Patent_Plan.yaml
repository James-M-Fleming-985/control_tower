          words: 100
        - name: "BACKGROUND ART"
          words: 600
          notes: "4+ named competitors with explicit limitation statements"
        - name: "SUMMARY OF INVENTION"
          words: 700
          notes: "6 innovations enumerated"
        - name: "DETAILED DESCRIPTION"
          words: 8000
          subsections:
            - "System Architecture Overview (9-phase autonomous loop)"
