# ============================================================================
# VERIFICATION CRITERIA
# ============================================================================
verification:
  cross_reference: "Every claim number appears in description + drawings"
  formula_accuracy: "Patent coefficients match source code exactly"
  prior_art: "≥4 named systems with limitation statements"
  claims_count: "30-35 total (4 independent + 26-31 dependent)"
  word_counts:
    abstract: ~200
    description: ~10000
    claims: ~2500
    drawings_info: ~1200
  innovation_coverage: "All 6 innovations referenced in ≥3 claims each"

# ============================================================================
# KEY DECISIONS
# ============================================================================
decisions:
  jurisdiction: "UK patent application (matching existing template)"
  claim_strategy: >
    Anchor on integrated autonomous closed-loop — no single component
    novel alone, but the system combination is unprecedented.
  prior_art_approach: "Name commercial products (not academic papers) to show practical gap"
  scope_in: "Full pipeline from data ingestion → deployed MVP → outcome measurement"
  scope_out: "Individual API integrations, specific UI designs, database schema details"

# ============================================================================
# FURTHER CONSIDERATIONS
# ============================================================================
considerations:
  - title: "Provisional filing recommended"
    detail: "Establish priority date immediately, convert to full within 12 months"
  - title: "PCT international filing"
    detail: "UK gives 12-month priority for international application"
  - title: "Trade secret vs patent for coefficients"
    detail: >
      Since weights are in codebase (public repo), patent protection
      is stronger than trade secret.
