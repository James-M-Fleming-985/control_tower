# ============================================================================
# CAUSAL AFFECT PATENT APPLICATION — MASTER PLAN
# ============================================================================
# Platform: Causal Affect — Level 5 Autonomous Company System
# Jurisdiction: UK Patent Application
# Template: Modelled on existing Communication Patent (31 claims, 14 figures)
# Created: 2026-03-27
# ============================================================================

overview:
  title: "Causal Affect Patent Application Plan"
  description: >
    Create a full UK patent application for the Causal Affect platform — a
    Level 5 autonomous company system that discovers cross-domain causal
    relationships, generates AI predictions, autonomously builds MVPs via TDD,
    and deploys them without human intervention.
  template_source: "CA-002_setup/Causal_Affect_Patent/ (Communication Patent PDFs)"
  template_stats:
    claims: 31
    figures: 14
    word_count: ~13500
    independent_claims: 4
  target_stats:
    claims: 30-35
    figures: 14
    word_count: ~14000
    independent_claims: 4

# ============================================================================
# 6 PATENTABLE INNOVATIONS
# ============================================================================
innovations:
  - id: 1
    symbol: "①"
    title: "Variable-Level Cross-Domain Causal Discovery"
    description: >
      Discovers causal relationships at the individual variable level across
      unrelated domains (e.g., Wikipedia page views → stock price), not
      domain-level aggregates.
    key_differentiator: "Granularity — variable-to-variable, not domain-to-domain"

  - id: 2
    symbol: "②"
    title: "Three-Model Ensemble with Automatic Weight Calibration"
    description: >
      Combines Granger causality (40%), OLS regression (35%), and ARIMA
      time-series (25%) into a single ensemble prediction with confidence
      scoring derived from historical accuracy.
    key_differentiator: "Weights calibrated from real outcome feedback, not fixed"

  - id: 3
    symbol: "③"
    title: "Autonomous TDD-Driven MVP Generation from Statistical Signals"
    description: >
      Converts statistical causal signals directly into deployed web
      applications via a 5-phase TDD pipeline (SPEC → RED → GREEN →
      REFACTOR → VALIDATE) with AI-generated code.
    key_differentiator: "Signal-to-software with no human coding"

  - id: 4
    symbol: "④"
    title: "Closed-Loop Autonomous Business Pipeline"
    description: >
      Full cycle: data ingestion → correlation → causality → prediction →
      MVP build → deployment → outcome measurement → weight recalibration.
      Runs on APScheduler cron (01:00–05:00 UTC daily).
    key_differentiator: "End-to-end autonomy with feedback loop"

  - id: 5
    symbol: "⑤"
    title: "Cross-Layer Enforcement Architecture"
    description: >
      Enforces that Layer 1 (behavioural data: Wikipedia, Reddit) predicts
      Layer 2 (exploitable outcomes: stocks, crypto). LAYER1_SOURCES
      constraint prevents trivial same-domain correlations.
    key_differentiator: "Architectural constraint ensuring cross-domain only"

  - id: 6
    symbol: "⑥"
    title: "Build-Iterate Loop with Failure Diagnosis"
    description: >
      When a build fails any TDD phase, the system diagnoses the failure,
      generates an iterate_reason, and spawns a child build with adjusted
      parameters — no human intervention required.
    key_differentiator: "Self-healing code generation pipeline"

# ============================================================================
# PHASE 1: DEEP CODE AUDIT & NOVELTY IDENTIFICATION
# ============================================================================
phase_1_code_audit:
  purpose: >
    Extract exact algorithms, formulas, and coefficients from the codebase
    to ensure patent claims are precise and defensible.

  tasks:
    - id: "1.1"
      title: "Audit all scoring formulas"
      details:
        - "Opportunity Score (5 weighted components) from exploitation logic"
        - "Build Viability Score (5 weighted components)"
        - "Ensemble confidence = sqrt(mean_historical_accuracy)"
        - "Ensemble weights: Granger 40%, OLS 35%, ARIMA 25%"
        - "Cross-layer rule: LAYER1_SOURCES = ('wikipedia', 'reddit')"
        - "TDD pass-rate threshold (≥80%)"

    - id: "1.2"
      title: "Audit the autonomous loop"
      details: >
        Map APScheduler cron jobs from scheduled_tasks.py to document
        the closed-loop cycle with precise timing and dependencies
        (01:00 → 01:30 → 02:00 → 02:30 → 05:00 UTC daily).

    - id: "1.3"
      title: "Audit TDD pipeline"
      details: >
        Extract 5-phase spec: prompt templates, validation criteria,
        retry logic, complexity tiers (LOW=4 AC, MEDIUM=7, HIGH=12).

    - id: "1.4"
      title: "Prior art identification"
      contrasts:
        - system: "Quantitative Trading (Alpaca, QuantConnect)"
          limitation: "Predict but don't build products"
        - system: "AI Code Generation (GitHub Copilot, Devin, Replit Agent)"
          limitation: "Build but don't discover opportunities"
        - system: "BI Platforms (Palantir, Tableau)"
          limitation: "Correlate but don't act autonomously"
        - system: "AutoML (H2O, DataRobot)"
          limitation: "Model but don't deploy products"
      gap: >
        No existing system combines discovery → causality → prediction →
        code generation → deployment → outcome measurement.

    - id: "1.5"
      title: "Confirm 6 patentable innovations"
      reference: "See innovations section above"

  key_files_to_audit:
    - path: "services/ensemble_model.py"
      purpose: "Ensemble algorithm, weights, LAYER1_SOURCES"
    - path: "services/granger_causality_service.py"
      purpose: "Bidirectional Granger, optimal lag selection"
    - path: "services/correlation_analyzer.py"
      purpose: "N×N cross-domain correlation engine"
    - path: "services/ai_code_generator_orchestrator.py"
      purpose: "5-phase TDD cycle orchestration"
    - path: "services/spec_generator.py"
      purpose: "AI-driven YAML spec generation"
    - path: "services/mvp_builder_service.py"
      purpose: "Build orchestration and viability scoring"
    - path: "services/exploitation_backtester.py"
      purpose: "Outcome measurement and accuracy tracking"
    - path: "services/walk_forward_validator.py"
      purpose: "Expanding-window backtesting"
    - path: "services/github_service.py"
      purpose: "Autonomous repo creation and push"
    - path: "services/railway_service.py"
      purpose: "GraphQL deployment pipeline"
    - path: "scheduled_tasks.py"
      purpose: "Cron job definitions for autonomous loop"
    - path: "models.py"
      purpose: "Full data schema"
    - path: "routers/dashboard_real.py"
      purpose: "Build/iterate/portfolio endpoints"
    - path: "data_fetcher.py"
      purpose: "Multi-source data ingestion"
    - path: "data_ingestion_service.py"
      purpose: "Data standardisation pipeline"

