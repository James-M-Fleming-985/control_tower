            from pathlib import Path
            from src.layer.orchestrator.ai_code_generator_orchestrator import AICodeGeneratorOrchestrator
            
            def test_orchestrator_initializes_ai_provider_from_config():
                """RED: Orchestrator should initialize AI provider from config"""
                config = {
