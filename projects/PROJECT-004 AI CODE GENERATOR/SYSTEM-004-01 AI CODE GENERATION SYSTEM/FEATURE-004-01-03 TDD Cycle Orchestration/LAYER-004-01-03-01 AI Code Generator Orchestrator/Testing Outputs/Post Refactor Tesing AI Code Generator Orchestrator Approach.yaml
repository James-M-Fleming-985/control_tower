testing_strategy:
  overview: |
    Comprehensive testing approach for AI Code Generator Orchestrator after REFACTOR phase.
    Focus on unit, integration, and end-to-end testing with real AI provider integration.
    ALL TESTS MUST FOLLOW ANTI-PATTERN PROTECTION PRINCIPLES.
  
  scope:
    - Unit tests: Individual methods in isolation (with mocks)
    - Integration tests: Layer interactions with AI Provider Abstraction
    - End-to-end tests: Complete TDD cycle workflows (RED → GREEN → REFACTOR)
  
  pragmatic_approach: |
    Small team approach - focus on tests that provide value:
    - Unit tests for business logic and edge cases
    - Integration tests for critical dependencies (AI provider)
    - E2E tests for happy path workflows
    - Skip tests that don't catch real bugs
  
  anti_pattern_protection:
    pattern_eliminated: "Testing Contracts, Not Implementations"
    
    five_protection_mechanisms:
      mechanism_1:
        name: "Tests verify actual behavior, not just interfaces"
        implementation:
          - "Use assert_called(), assert_called_once() to verify methods executed"
          - "Check return values match expected behavior, not just types"
          - "Verify state changes (files created, data modified)"
        examples:
          good: "assert mock_provider.generate_code.assert_called_once()"
          bad: "assert hasattr(orchestrator, 'ai_provider')"
      
      mechanism_2:
        name: "Tests check side effects (files exist, APIs called)"
        implementation:
          - "Verify files created on disk: Path.exists(), Path.glob()"
          - "Verify API calls made: mock.assert_called_with(...)"
          - "Verify subprocess executed: subprocess.run.assert_called()"
        examples:
          good: "assert len(list(test_dir.glob('test_*.py'))) > 0"
          bad: "assert result['tests_generated']  # just checks key exists"
      
      mechanism_3:
        name: "Tests use mocks to VERIFY calls, not just STUB returns"
        implementation:
          - "Always use mock.assert_called() after operation"
          - "Use mock.assert_called_with() to verify parameters"
          - "Use mock.call_count to verify number of calls"
        examples:
          good: "mock_factory.create.assert_called_once_with('anthropic', config)"
          bad: "mock_factory.create.return_value = mock_provider  # stub only"
      
      mechanism_4:
        name: "Integration tests run with real dependencies"
        implementation:
          - "Use real file system (tempfile.TemporaryDirectory)"
          - "Use real YAML parsing (yaml.safe_load)"
          - "Use real Path operations (not mocked)"
          - "Mock only external services (AI APIs, network calls)"
        examples:
          good: "with tempfile.TemporaryDirectory() as tmpdir: ..."
          bad: "mock_path = Mock()  # mocking file system"
      
      mechanism_5:
        name: "Manual verification confirms system works"
        implementation:
          - "Document how to run tests manually"
          - "Document how to verify file creation"
          - "Document how to inspect YAML reports"
          - "Provide example commands for smoke testing"
        examples:
          - "ls -la /tmp/test_output/tests/  # verify test files"
          - "cat requirements_verification.yaml  # verify content"
          - "pytest -v  # verify tests pass"
    
    enforcement:
      code_review_checklist:
        - "Does test verify method was called? (mock.assert_called)"
        - "Does test check file exists on disk? (Path.exists)"
        - "Does test verify actual content? (file.read_text, yaml.safe_load)"
        - "Does test use real file system? (tempfile, not mocks)"
        - "Can I manually verify this behavior? (documented steps)"
      
      test_writing_rules:
        - "Rule 1: Every mock must have an assert_called() verification"
        - "Rule 2: Every file operation must verify file exists"
        - "Rule 3: Every YAML report must verify content, not just existence"
        - "Rule 4: Integration tests use real Path/file operations"
        - "Rule 5: Document manual verification steps in test docstring"

