anti_patterns_to_avoid:
  testing_for_coverage_numbers:
    problem: "Writing tests just to hit 95% coverage target"
    solution: "Write tests that catch real bugs, ignore coverage metrics"
    
  over_mocking:
    problem: "Mocking so much that tests don't verify real behavior"
    solution: "Use real objects where possible (file system, yaml parsing)"
    
  testing_implementation_details:
    problem: "Tests break when refactoring internal structure"
    solution: "Test public interfaces and behaviors, not internals"
    
  slow_test_suites:
    problem: "Developers skip running tests because they're too slow"
    solution: "Keep unit/integration fast (<5s), mark E2E as slow"

examples:
  integration_test_error_handling:
    file: "test_orchestrator_ai_provider_integration_RED.py"
    code: |
      def test_red_phase_handles_ai_provider_failure(self):
          """Test RED phase handles AI provider failures gracefully."""
          with patch('layer.orchestrator.ai_code_generator_orchestrator.AIProviderFactory') as mock_factory:
              mock_provider = Mock()
              mock_provider.generate_code.side_effect = RuntimeError("API rate limit exceeded")
              mock_factory.create.return_value = mock_provider
              
              orchestrator = AICodeGeneratorOrchestrator(
                  provider_type='anthropic',
                  provider_config={'api_key': 'test_key'}
              )
              
              requirements = {
                  'feature_name': 'calculator',
                  'feature_description': 'Simple calculator',
                  'acceptance_criteria': ['Can add two numbers'],
                  'output_path': str(self.temp_dir)
              }
              
              with pytest.raises(RuntimeError, match="API rate limit"):
                  orchestrator.execute_red_phase(requirements)
  
  e2e_test_simple_feature:
    file: "test_orchestrator_e2e.py"
    code: |
      import pytest
      import os
      from pathlib import Path
      
      @pytest.mark.e2e
      @pytest.mark.slow
      def test_complete_red_green_cycle_calculator():
          """E2E test: Complete RED → GREEN cycle for simple calculator."""
          if not os.getenv('ANTHROPIC_API_KEY'):
              pytest.skip("ANTHROPIC_API_KEY not set - skipping E2E test")
          
          orchestrator = AICodeGeneratorOrchestrator(
              provider_type='anthropic',
              provider_config={
                  'api_key': os.getenv('ANTHROPIC_API_KEY'),
                  'model': 'claude-3-5-sonnet-20241022'
              }
          )
          
          # RED phase: Generate failing tests
          requirements = {
              'feature_name': 'calculator',
              'feature_description': 'Calculator with add and subtract operations',
              'acceptance_criteria': [
                  'Can add two positive numbers',
                  'Can subtract two positive numbers'
              ],
              'output_path': str(temp_dir)
          }
          
          red_result = orchestrator.execute_red_phase(requirements)
          
          # Verify RED phase results
          assert red_result['phase'] == 'RED'
          assert len(red_result['tests_generated']) > 0
          assert red_result['tests_failed'] > 0  # Tests should fail
          
          # GREEN phase: Generate implementation
          green_result = orchestrator.execute_green_phase(requirements, red_result)
          
          # Verify GREEN phase results
          assert green_result['phase'] == 'GREEN'
          assert len(green_result['files_written']) > 0
          assert green_result['tests_passed'] > 0  # Tests should now pass
          assert green_result['coverage'] > 0.0
          
          # Verify actual files exist
          test_files = list(Path(temp_dir).glob('tests/test_*.py'))
          impl_files = list(Path(temp_dir).glob('src/*.py'))
          assert len(test_files) > 0
          assert len(impl_files) > 0

