================================================================================
TESTING PYRAMID STRATEGY
================================================================================

layer_level_testing:
  description: |
    Each layer maintains its own testing pyramid with unit tests forming
    the foundation and focused integration tests for critical paths.
  
  unit_test_strategy:
    purpose: "Test individual methods and classes in isolation"
    coverage_target: "95-100%"
    characteristics:
      - Fast execution (<100ms per test)
      - No external dependencies
      - Mock/stub dependencies
      - Test single responsibility
      - Cover edge cases and error conditions
    
    layer_001_approach:
      focus:
        - Orchestrator initialization and configuration
        - Phase execution logic (RED, GREEN, REFACTOR)
        - Requirements loading and validation
        - Error handling and recovery
        - Results collection and storage
      mocking_strategy:
        - Mock file system operations
        - Mock subprocess execution (pytest, test generators)
        - Mock external dependencies (other layers)
      edge_cases:
        - Invalid YAML requirements
        - Missing configuration
        - Phase transition failures
        - Empty test results
    
    layer_002_approach:
      focus:
        - Concurrent executor initialization
        - Thread-safe layer execution
        - Semaphore limiting (max 5 concurrent)
        - Queue management (FIFO)
        - Progress tracking and reporting
      mocking_strategy:
        - Mock layer execution (lightweight simulation)
        - Mock time-based operations
        - Stub progress callbacks
      edge_cases:
        - Empty layer lists
        - Invalid concurrency limits (0, 11)
        - Null executor in reporter
        - Race conditions in progress updates
  
  integration_test_strategy:
    purpose: "Test component interactions and workflows"
    coverage_target: "90%+"
    characteristics:
      - Moderate execution time (<1s per test)
      - Real component interactions
      - Minimal mocking (only external systems)
      - End-to-end workflows within layer
    
    layer_001_approach:
      focus:
        - Full TDD cycle execution (RED→GREEN→REFACTOR)
        - Report generation with real file I/O
        - Multi-phase workflows
      real_dependencies:
        - Actual YAML file reading
        - Real directory structure
        - Actual report generation
      mocked_dependencies:
        - Test execution (subprocess calls)
        - Other layers (not yet integrated)
    
    layer_002_approach:
      focus:
        - Concurrent execution with progress reporting
        - End-to-end layer processing workflow
        - Real thread management and synchronization
      real_dependencies:
        - Threading primitives (Semaphore, Lock, Thread)
        - Queue operations
        - Progress state management
      mocked_dependencies:
        - Actual layer implementation (use test stubs)

feature_level_testing:
  description: |
    Feature-level testing validates integration between layers and
    complete feature workflows. This adds a cross-layer testing dimension.
  
  feature_integration_tests:
    purpose: "Validate LAYER-001 ↔ LAYER-002 integration"
    count_target: "3-5 tests"
    location: "tests/feature/test_tdd_cycle_orchestration_integration.py"
    
    test_scenarios:
      - test_orchestrator_uses_concurrent_executor:
          description: "Orchestrator delegates layer execution to ConcurrentLayerExecutor"
          components:
            - AICodeGeneratorOrchestrator (LAYER-001)
            - ConcurrentLayerExecutor (LAYER-002)
          validates:
            - Orchestrator creates executor with correct concurrency
            - Executor processes layers concurrently
            - Progress updates flow back to orchestrator
            - Results collected correctly
      
      - test_concurrent_tdd_cycle_execution:
          description: "Execute multiple TDD cycles concurrently"
          components:
            - AICodeGeneratorOrchestrator (LAYER-001)
            - ConcurrentLayerExecutor (LAYER-002)
            - ProgressReporter (LAYER-002)
          validates:
            - Multiple layers execute RED phase concurrently
            - Progress reporting tracks all concurrent operations
            - Phase transitions coordinated correctly
            - No race conditions in result collection
      
      - test_orchestrator_with_real_progress_reporting:
          description: "Integration of orchestration with live progress updates"
          components:
            - AICodeGeneratorOrchestrator (LAYER-001)
            - ProgressReporter (LAYER-002)
          validates:
            - Real-time progress updates during TDD cycle
            - Accurate percentage calculations
            - Timestamp tracking
            - Status consistency
      
      - test_error_propagation_across_layers:
          description: "Errors in executor propagate correctly to orchestrator"
          components:
            - AICodeGeneratorOrchestrator (LAYER-001)
            - ConcurrentLayerExecutor (LAYER-002)
          validates:
            - Executor failures reported to orchestrator
            - Orchestrator handles executor errors gracefully
            - Proper error logging and recovery
            - Partial results preserved on failure
      
      - test_end_to_end_multi_layer_workflow:
          description: "Complete workflow with real file operations"
          components:
            - AICodeGeneratorOrchestrator (LAYER-001)
            - ConcurrentLayerExecutor (LAYER-002)
            - File system (real)
          validates:
            - YAML requirements loading
            - Concurrent execution of multiple layers
            - Report generation with real files
            - Verification artifact creation
  
  feature_e2e_tests:
    purpose: "Minimal end-to-end validation of complete feature"
    count_target: "0-2 tests (optional)"
    rationale: |
      E2E tests are expensive and slow. For this feature, comprehensive
      integration tests cover most scenarios. E2E tests only needed if:
      - Testing deployment scenarios
      - Validating external system integration
      - Demonstrating feature to stakeholders
    
    optional_scenarios:
      - test_complete_tdd_orchestration_workflow:
          description: "Full TDD cycle from YAML to verification reports"
          setup:
            - Real YAML requirements file
            - Real source code structure
            - Real test framework (pytest)
          execution:
            - Load requirements
            - Execute RED phase (create failing tests)
            - Execute GREEN phase (implement code)
            - Execute REFACTOR phase (improve code)
            - Generate verification reports
          validation:
            - All reports generated
            - Tests pass
            - Coverage meets targets
            - Artifacts created
          duration: "5-10 seconds"
          run_frequency: "Manual or nightly builds"

