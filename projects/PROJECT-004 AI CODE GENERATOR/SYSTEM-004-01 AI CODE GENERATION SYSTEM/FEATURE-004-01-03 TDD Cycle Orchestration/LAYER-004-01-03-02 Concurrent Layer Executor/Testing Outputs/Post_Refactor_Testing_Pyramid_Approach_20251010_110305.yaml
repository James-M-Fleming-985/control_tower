  integration_tests: "test_integration_<workflow_description>"
  e2e_tests: "test_complete_<feature_name>"
  
  examples:
    unit: "test_execute_layers_empty_list"
    integration: "test_integration_concurrent_execution_and_progress"
    e2e: "test_complete_tdd_orchestration_workflow"

test_independence:
  principle: "Each test must run independently"
  practices:
    - No shared state between tests
    - Setup/teardown in fixtures or setUp/tearDown
    - Clean test data after each test
    - No test execution order dependencies

mocking_strategy:
  unit_tests:
    mock_level: "HIGH"
    mock_targets:
      - External dependencies (file system, subprocess)
      - Other layers
      - Time-dependent operations
    real_components:
      - Business logic
      - Data structures
      - Algorithms
  
  integration_tests:
    mock_level: "MINIMAL"
    mock_targets:
      - External systems only
    real_components:
      - All layer components
      - File I/O (with temp directories)
      - Threading primitives

coverage_targets:
  unit_tests:
    minimum: "95%"
    target: "100%"
    exclusions:
      - "Defensive error handling (unreachable in practice)"
      - "Logging statements"
  
  integration_tests:
    minimum: "90%"
    target: "95%"
    focus:
      - "Integration paths"
      - "Cross-component workflows"

performance_targets:
  unit_tests:
    max_duration_per_test: "100ms"
    total_suite_duration: "< 2 seconds"
  
  integration_tests:
    max_duration_per_test: "1 second"
    total_suite_duration: "< 10 seconds"
  
  e2e_tests:
