# LAYER-004-01-02-01: Test Code Generator
# EXECUTABLE REQUIREMENTS SPECIFICATION

metadata:
  requirement_id: LAYER-004-01-02-01
  requirement_name: Test Code Generator
  requirement_type: Layer
  parent_feature: FEATURE-004-01-02
  parent_system: SYSTEM-004-01
  parent_project: PROJECT-004 AI CODE GENERATOR
  
  team_size: small
  risk_level: high
  
  estimated_effort_hours: 4
  actual_effort_hours: 0
  progress_percentage: 0
  status: planned

# EXECUTABLE TESTING PYRAMID REQUIREMENTS
testing_requirements:
  test_pyramid:
    enforce_pyramid_ratio: true
    unit_to_integration_ratio: 2.0
    
  unit_tests:
    required: true
    minimum_count: 12
    maximum_count: 18
    coverage_threshold: 0.95
    mock_usage_allowed: true
    focus_areas:
      - Core functionality testing
      - Edge case handling
      - Error scenarios
    expected_test_methods:
      -       - test_prompt_template_engine_test_generation
      - test_parse_yaml_acceptance_criteria
      - test_extract_expected_test_methods
      - test_build_test_generation_prompt
      - test_generate_unit_test_file
      - test_generate_integration_test_file
      - test_validate_generated_test_syntax
      - test_format_generated_test_code
      - test_add_docstrings_to_tests
      - test_add_imports_to_test_file
      - test_handle_empty_acceptance_criteria
      - test_handle_invalid_yaml_structure
  
  integration_tests:
    required: true
    minimum_count: 6
    maximum_count: 10
    coverage_threshold: 0.90
    focus_areas:
      - Component integration
      - End-to-end workflows
      - Real API interactions
    expected_test_methods:
      -       - test_generate_tests_from_real_yaml
      - test_generated_tests_fail_without_implementation
      - test_ai_provider_integration_for_tests
      - test_save_generated_test_files
      - test_multi_file_test_generation
      - test_end_to_end_test_generation
  
  e2e_tests:
    required: false
    minimum_count: 0

# EXECUTABLE QUALITY GATES
quality_gates:
  enforcement_level: strict
  
  red_phase:
    tests_must_fail: true
    fail_reason_must_be_clear: true
    no_implementation_allowed: true
    
  green_phase:
    all_tests_must_pass: true
    coverage_thresholds_met: true
    no_skipped_tests: true
    
  refactor_phase:
    tests_still_passing: true
    coverage_maintained_or_improved: true
    no_regression_allowed: true
    
  verification:
    full_traceability_required: true
    all_acceptance_criteria_tested: true
    evidence_collection_complete: true
    test_pyramid_ratio_valid: true

# EXECUTABLE ACCEPTANCE CRITERIA
acceptance_criteria:
  - criterion_id: AC-001
    criterion: "Generate pytest test files from YAML acceptance criteria"
    status: planned
    priority: critical
    verification_method: unit_tests
    required_tests:
      - test_generate_unit_test_file
      - test_generate_integration_test_file
      - test_generate_tests_from_real_yaml
    implementation_method: TestCodeGenerator
    traceability:
      feature_ac: FEATURE-004-01-02.AC-001

  - criterion_id: AC-002
    criterion: "Generated tests must fail in RED phase"
    status: planned
    priority: critical
    verification_method: unit_tests
    required_tests:
      - test_generated_tests_fail_without_implementation
    implementation_method: TestCodeGenerator
    traceability:
      feature_ac: FEATURE-004-01-02.AC-002

  - criterion_id: AC-003
    criterion: "Build prompts from YAML using template engine"
    status: planned
    priority: critical
    verification_method: unit_tests
    required_tests:
      - test_prompt_template_engine_test_generation
      - test_build_test_generation_prompt
    implementation_method: PromptTemplateEngine
    traceability:
      feature_ac: FEATURE-004-01-02.AC-003


# EXECUTABLE TRACEABILITY
traceability:
  requirement_to_test_mapping:
    AC-001:
      acceptance_criterion: "Generate pytest test files from YAML acceptance criteria"
      implementation_method: TestCodeGenerator
      unit_tests:
        - test_generate_unit_test_file
        - test_generate_integration_test_file
        - test_generate_tests_from_real_yaml
      integration_tests: []

    AC-002:
      acceptance_criterion: "Generated tests must fail in RED phase"
      implementation_method: TestCodeGenerator
      unit_tests:
        - test_generated_tests_fail_without_implementation
      integration_tests: []

    AC-003:
      acceptance_criterion: "Build prompts from YAML using template engine"
      implementation_method: PromptTemplateEngine
      unit_tests:
        - test_prompt_template_engine_test_generation
        - test_build_test_generation_prompt
      integration_tests: []


# REQUIREMENTS VERIFICATION
requirements_verification:
  verification_checklist:
    - item: "All acceptance criteria have corresponding tests"
      automated: true
    - item: "Test pyramid ratio is valid (2:1 unit:integration)"
      automated: true
    - item: "Coverage thresholds met (95% unit, 90% integration)"
      automated: true
    - item: "All tests pass in GREEN phase"
      automated: true
    - item: "No skipped tests"
      automated: true
    - item: "Traceability matrix complete"
      automated: true
    - item: "Evidence collection complete"
      automated: true
    - item: "Verification files generated"
      automated: true

# EXECUTABLE OUTPUT SPECIFICATION
output_specification:
  base_path: "LAYER-004-01-02-01 Test Code Generator"
  
  testing_outputs_dir: "Testing Outputs"
  testing_files:
    red_phase:
      - file: "red_phase_results_{timestamp}.xml"
        type: junit_xml
      - file: "red_phase_log_{timestamp}.txt"
        type: execution_log
    green_phase:
      - file: "green_phase_results_{timestamp}.txt"
        type: test_results
      - file: "coverage_report_{timestamp}.txt"
        type: coverage_report
      - file: "test_pyramid_validation_{timestamp}.json"
        type: validation_report
    refactor_phase:
      - file: "refactor_phase_results_{timestamp}.xml"
        type: junit_xml
      - file: "refactor_phase_log_{timestamp}.txt"
        type: execution_log
  
  requirements_verification_dir: "Requirements Verification"
  verification_files:
    - file: "requirements_verification_template.yaml"
      required: true
      phase: "refactor_phase"
    - file: "execution_evidence.json"
      required: true
      phase: "refactor_phase"
    - file: "traceability_matrix_{timestamp}.yaml"
      required: true
      phase: "refactor_phase"
    - file: "test_pyramid_report_{timestamp}.yaml"
      required: true
      phase: "green_phase"
    - file: "quality_gates_report_{timestamp}.yaml"
      required: true
      phase: "refactor_phase"
    - file: "requirements_verification_complete.yaml"
      required: true
      phase: "refactor_phase"
      description: "Final marker file - layer complete when this exists"
