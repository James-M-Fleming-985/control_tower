# AI-Generated Automation Requirements
# =====================================
# Complete specification for fully automated TDD workflow execution
# using AI to generate tests, implementations, and refactorings from YAML requirements

metadata:
  requirement_id: SYSTEM-003-03-AI-GEN
  requirement_name: AI-Powered Executable YAML Requirements
  requirement_type: System Enhancement
  created_date: 2025-10-08
  status: required
  priority: critical
  
  purpose: |
    Enable YAML requirements files to be fully executable, where a single command
    triggers AI to generate tests, implementations, refactorings, validations,
    and verification reports automatically from the documented requirements.

core_requirement:
  summary: |
    The YAML file should be EXECUTABLE - it generates:
    1. RED phase failing tests based on requirements documented within itself
    2. GREEN phase real implementations to make tests pass
    3. REFACTOR phase code enhancements
    4. Testing pyramid validation and results
    5. Requirements verification and traceability
    6. All files saved to appropriate directories
    
    From ONE command: `python scripts/execute_requirements.py --yaml LAYER-XXX.yaml`
    or: `./LAYER-XXX.yaml` (if made executable)

execution_model:
  command_format: |
    python scripts/execute_requirements.py --yaml <YAML_FILE_PATH>
    
    OR
    
    python scripts/execute_layer.py --layer <LAYER_ID> --phase full-cycle --ai-generate
  
  expected_behavior:
    - Load YAML requirements file
    - Parse acceptance criteria, test methods, implementation specifications
    - Use AI (GitHub Copilot/Claude/GPT-4) to generate code
    - Execute full TDD cycle automatically
    - Validate all quality gates
    - Generate verification reports
    - Save all outputs to specified directories
  
  success_criteria:
    - All phases complete without human intervention
    - All tests pass
    - All quality gates satisfied
    - All verification files generated
    - requirements_verification_complete.yaml exists

ai_generation_phases:
  
  red_phase:
    trigger: "Execute RED phase"
    ai_task: "Generate failing tests from YAML requirements"
    
    inputs:
      - acceptance_criteria (from YAML)
      - expected_test_methods (from YAML)
      - unit_tests.focus_areas (from YAML)
      - integration_tests.focus_areas (from YAML)
      - test_count_requirements (min/max from YAML)
    
    ai_generation_steps:
      1:
        action: "Parse acceptance criteria from YAML"
        ai_prompt: |
          Generate pytest unit tests for the following acceptance criteria:
          {acceptance_criteria}
          
          Requirements:
          - Generate {unit_tests.minimum_count} to {unit_tests.maximum_count} unit tests
          - Include these specific test methods: {expected_test_methods}
          - Focus on: {unit_tests.focus_areas}
          - Tests must FAIL initially (no implementation exists)
          - Use pytest fixtures and proper assertions
      
      2:
        action: "Generate integration tests"
        ai_prompt: |
          Generate pytest integration tests for:
          {acceptance_criteria}
          
          Requirements:
          - Generate {integration_tests.minimum_count} to {integration_tests.maximum_count} integration tests
          - Focus on: {integration_tests.focus_areas}
          - Test cross-component interactions
          - Tests must FAIL initially
      
      3:
        action: "Save test files"
        outputs:
          - tests/layer/{layer_name}/test_{layer_name}_unit.py
          - tests/layer/{layer_name}/test_{layer_name}_integration.py
      
      4:
        action: "Run tests (expect failures)"
        validation:
          - All tests must FAIL
          - quality_gates.red_phase.tests_must_fail: true
      
      5:
        action: "Save RED phase results"
        outputs:
          - Testing Outputs/red_phase_results_{timestamp}.xml
          - Testing Outputs/red_phase_log_{timestamp}.txt
    
    success_criteria:
      - Test files generated
      - All tests fail as expected
      - Test counts meet minimum requirements
      - RED phase quality gate passed
  
  green_phase:
    trigger: "Execute GREEN phase"
    ai_task: "Generate real implementations to make tests pass"
    
    inputs:
      - acceptance_criteria (from YAML)
      - traceability.requirement_to_test_mapping (from YAML)
      - implementation_method names (from YAML)
      - failing_tests (from RED phase)
      - coverage_thresholds (from YAML)
    
    ai_generation_steps:
      1:
        action: "Analyze failing tests"
        ai_prompt: |
          Analyze these failing tests:
          {test_files}
          
          Determine what functions/classes need to be implemented.
      
      2:
        action: "Generate minimal implementations"
        ai_prompt: |
          Generate minimal Python implementation to make these tests pass:
          
          Acceptance Criteria:
          {acceptance_criteria}
          
          Test-to-Implementation Mapping:
          {traceability.requirement_to_test_mapping}
          
          Requirements:
          - Implement only what's needed to pass tests (TDD principle)
          - Achieve {coverage_threshold}% code coverage
          - Follow Python best practices
          - Include docstrings
          - No over-engineering
          
          Generate implementation for:
          - src/layer/{layer_name}/{layer_name}.py
      
      3:
        action: "Save implementation files"
        outputs:
          - src/layer/{layer_name}/{layer_name}.py
          - src/layer/{layer_name}/__init__.py
      
      4:
        action: "Run tests (expect passes)"
        validation:
          - All tests must PASS
          - Coverage >= {coverage_threshold}%
          - Test counts within bounds
          - Test pyramid ratio valid (2:1 unit:integration)
      
      5:
        action: "Validate quality gates"
        checks:
          - quality_gates.green_phase.all_tests_must_pass: true
          - quality_gates.green_phase.coverage_thresholds_met: true
          - quality_gates.green_phase.no_skipped_tests: true
          - quality_gates.green_phase.test_pyramid_ratio_valid: true
      
      6:
        action: "Generate test pyramid validation"
        outputs:
          - Testing Outputs/test_pyramid_validation_{timestamp}.json
          - Requirements Verification/test_pyramid_report_{timestamp}.yaml
      
      7:
        action: "Save GREEN phase results"
        outputs:
          - Testing Outputs/green_phase_results_{timestamp}.txt
          - Testing Outputs/coverage_{timestamp}.json
    
    success_criteria:
      - Implementation files generated
      - All tests pass
      - Coverage thresholds met
      - Test pyramid ratio valid
      - GREEN phase quality gates passed
  
  refactor_phase:
    trigger: "Execute REFACTOR phase"
    ai_task: "Enhance code quality while keeping tests passing"
    
    inputs:
      - implementation_files (from GREEN phase)
      - test_files (from RED phase)
      - quality_gates.refactor_phase (from YAML)
    
    ai_generation_steps:
      1:
        action: "Analyze code for refactoring opportunities"
        ai_prompt: |
          Analyze this implementation for refactoring opportunities:
          {implementation_files}
          
          Look for:
          - Code duplication
          - Complex functions that could be simplified
          - Better variable names
          - Improved error handling
          - Better separation of concerns
          - Documentation improvements
      
      2:
        action: "Generate refactored code"
        ai_prompt: |
          Refactor this code to improve quality:
          {implementation_files}
          
          Requirements:
          - Keep ALL tests passing
          - Improve code readability
          - Reduce complexity
          - Add better error handling
          - Improve documentation
          - DO NOT change functionality
          - DO NOT break tests
      
      3:
        action: "Save refactored files"
        outputs:
          - src/layer/{layer_name}/{layer_name}.py (updated)
      
      4:
        action: "Run tests (must still pass)"
        validation:
          - All tests must still PASS
          - No regressions introduced
          - Coverage maintained or improved
      
      5:
        action: "Validate quality gates"
        checks:
          - quality_gates.refactor_phase.tests_still_passing: true
          - quality_gates.refactor_phase.coverage_maintained_or_improved: true
          - quality_gates.refactor_phase.no_regression_allowed: true
      
      6:
        action: "Save REFACTOR phase results"
        outputs:
          - Testing Outputs/refactor_phase_results_{timestamp}.xml
          - Testing Outputs/refactor_phase_log_{timestamp}.txt
    
    success_criteria:
      - Code refactored successfully
      - All tests still pass
      - No regressions
      - Code quality improved
      - REFACTOR phase quality gates passed
  
  verification_phase:
    trigger: "Execute verification after REFACTOR"
    ai_task: "Generate traceability and verification reports"
    
    inputs:
      - acceptance_criteria (from YAML)
      - test_files (from RED phase)
      - implementation_files (from GREEN/REFACTOR phase)
      - traceability.requirement_to_test_mapping (from YAML)
      - requirements_verification.verification_checklist (from YAML)
    
    ai_generation_steps:
      1:
        action: "Validate traceability"
        process:
          - Map each acceptance criterion to tests
          - Map each test to implementation methods
          - Detect orphaned code
          - Detect missing tests
        outputs:
          - Requirements Verification/traceability_matrix_{timestamp}.yaml
      
      2:
        action: "Validate quality gates for all phases"
        process:
          - Aggregate quality gate results from RED/GREEN/REFACTOR
          - Determine overall status (ALL_GATES_PASSED or FAILED)
        outputs:
          - Requirements Verification/quality_gates_report_{timestamp}.yaml
      
      3:
        action: "Execute verification checklist"
        process:
          - Run each automated check from requirements_verification.verification_checklist
          - Validate all items pass
        outputs:
          - Requirements Verification/requirements_verification_complete.yaml
      
      4:
        action: "Generate final summary"
        ai_prompt: |
          Generate a comprehensive verification summary report including:
          - All acceptance criteria met
          - All tests passing
          - Coverage achieved
          - Quality gates status
          - Traceability verification
          - Files generated
        outputs:
          - Requirements Verification/layer_verification_summary_{timestamp}.md
    
    success_criteria:
      - Full traceability validated
      - All quality gates passed
      - All verification checklist items passed
      - requirements_verification_complete.yaml exists

yaml_structure_requirements:
  
  required_sections:
    metadata:
      description: "Layer identification and status"
      required_fields:
        - requirement_id
        - requirement_name
        - parent_feature
        - status
    
    testing_requirements:
      description: "Executable test specifications"
      required_fields:
        - test_pyramid.enforce_pyramid_ratio
        - test_pyramid.unit_to_integration_ratio
        - unit_tests.minimum_count
        - unit_tests.maximum_count
        - unit_tests.expected_test_methods (list of method names to generate)
        - integration_tests.minimum_count
        - integration_tests.maximum_count
        - integration_tests.expected_test_methods
    
    quality_gates:
      description: "Executable quality gate definitions"
      required_fields:
        - enforcement_level: strict
        - red_phase (tests_must_fail, no_implementation_allowed)
        - green_phase (all_tests_must_pass, coverage_thresholds_met)
        - refactor_phase (tests_still_passing, no_regression_allowed)
        - verification (full_traceability_required)
    
    acceptance_criteria:
      description: "What to implement"
      required_fields:
        - criterion (description)
        - status
      ai_usage: "AI uses these to generate tests and implementations"
    
    traceability:
      description: "Executable traceability mapping"
      required_fields:
        - requirement_to_test_mapping
          - Each AC maps to:
            - implementation_method (function name to generate)
            - unit_tests (list of test methods)
            - integration_tests (list of test methods)
      ai_usage: "AI uses this to know what to generate"
    
    requirements_verification:
      description: "Automated verification checklist"
      required_fields:
        - verification_checklist (list of automated checks)
      ai_usage: "Script validates all items after execution"
    
    output_specification:
      description: "Where to save generated files"
      required_fields:
        - testing_outputs_dir
        - requirements_verification_dir
        - testing_files (per phase)
        - verification_files
      ai_usage: "Script knows where to save each generated file"

ai_integration_options:
  
  option_1_github_copilot:
    description: "Use GitHub Copilot Chat API"
    implementation:
      - Use @workspace context
      - Feed YAML requirements as context
      - Generate code via chat completions
      - Save generated code to files
    pros:
      - Already integrated in VS Code
      - Understands workspace context
      - Fast generation
    cons:
      - Requires GitHub Copilot subscription
      - Limited to VS Code environment
  
  option_2_openai_api:
    description: "Use OpenAI GPT-4 API directly"
    implementation:
      - Use openai Python library
      - Feed YAML as structured prompt
      - Generate code via completion API
      - Save to files
    pros:
      - Programmable
      - Can run in CI/CD
      - Highly capable
    cons:
      - Requires OpenAI API key
      - Cost per generation
  
  option_3_anthropic_claude:
    description: "Use Anthropic Claude API"
    implementation:
      - Use anthropic Python library
      - Feed YAML as context
      - Generate code via messages API
      - Save to files
    pros:
      - Large context window (200k tokens)
      - Excellent code generation
      - Can handle entire YAML file
    cons:
      - Requires Anthropic API key
      - Cost per generation
  
  option_4_local_llm:
    description: "Use local LLM (Ollama, LLaMA)"
    implementation:
      - Run local model via Ollama
      - Use llama-cpp-python or similar
      - Generate code locally
    pros:
      - No API costs
      - Privacy
      - Offline capability
    cons:
      - Requires local compute resources
      - Slower generation
      - May be lower quality

recommended_implementation:
  
  architecture:
    component_name: "AICodeGenerator"
    location: "scripts/ai_code_generator.py"
    
    class_structure: |
      class AICodeGenerator:
          def __init__(self, yaml_file: Path, ai_provider: str):
              self.yaml_data = self.load_yaml(yaml_file)
              self.ai_provider = self.initialize_ai(ai_provider)
          
          def generate_tests_from_yaml(self, phase: str) -> List[Path]:
              """Generate test files using AI based on YAML requirements"""
              
          def generate_implementation_from_yaml(self) -> List[Path]:
              """Generate implementation files using AI based on YAML"""
              
          def refactor_code_with_ai(self) -> List[Path]:
              """Refactor code using AI suggestions"""
              
          def execute_full_cycle(self) -> VerificationReport:
              """Execute complete RED->GREEN->REFACTOR->VERIFY cycle"""
    
    integration_with_execute_layer:
      modify_file: "scripts/execute_layer.py"
      changes:
        - Add --ai-generate flag
        - Add AICodeGenerator integration
        - Replace stub generation with AI generation
        - Keep all validation logic
      
      example_usage: |
        # Current (manual implementation required)
        python scripts/execute_layer.py --layer LAYER-003-03-02-02 --phase full-cycle
        
        # New (AI generates everything)
        python scripts/execute_layer.py --layer LAYER-003-03-02-02 --phase full-cycle --ai-generate
        
        # Or use new script
        python scripts/execute_requirements.py --yaml LAYER-003-03-02-02.yaml --ai-provider openai

script_requirements:
  
  new_script:
    name: "execute_requirements.py"
    location: "scripts/execute_requirements.py"
    purpose: "Execute YAML requirements file with AI code generation"
    
    command_line_interface:
      arguments:
        - --yaml: "Path to YAML requirements file"
        - --ai-provider: "AI provider (openai, anthropic, copilot, local)"
        - --api-key: "API key for AI provider (optional, can use env var)"
        - --dry-run: "Show what would be generated without executing"
        - --skip-phase: "Skip specific phase (red, green, refactor, verify)"
        - --output-dir: "Override output directory"
      
      examples:
        - "python scripts/execute_requirements.py --yaml LAYER-003-03-02-02.yaml --ai-provider openai"
        - "python scripts/execute_requirements.py --yaml LAYER-003-03-02-02.yaml --ai-provider copilot --dry-run"
        - "python scripts/execute_requirements.py --yaml LAYER-003-03-02-02.yaml --ai-provider anthropic --api-key sk-xxx"
  
  modified_script:
    name: "execute_layer.py"
    changes:
      - Add --ai-generate flag
      - If --ai-generate, use AICodeGenerator instead of stub generation
      - Keep all existing validation logic
      - Keep all quality gate enforcement
      - Keep all file output logic
    
    backward_compatibility:
      - Without --ai-generate: works as before (generates stubs)
      - With --ai-generate: uses AI to generate real code
      - All existing commands still work

configuration_file:
  name: "ai_generation_config.yaml"
  location: "scripts/ai_generation_config.yaml"
  
  structure:
    ai_provider:
      default: "openai"
      options: ["openai", "anthropic", "copilot", "local"]
    
    api_keys:
      openai: "${OPENAI_API_KEY}"
      anthropic: "${ANTHROPIC_API_KEY}"
    
    generation_settings:
      model:
        openai: "gpt-4-turbo-preview"
        anthropic: "claude-3-opus-20240229"
      temperature: 0.2
      max_tokens: 4000
    
    prompts:
      red_phase_unit_test: "prompts/generate_unit_tests.txt"
      red_phase_integration_test: "prompts/generate_integration_tests.txt"
      green_phase_implementation: "prompts/generate_implementation.txt"
      refactor_phase: "prompts/refactor_code.txt"

success_metrics:
  
  layer_execution:
    metric: "Successful full-cycle execution"
    measurement:
      - Command: `python scripts/execute_requirements.py --yaml LAYER-XXX.yaml`
      - Result: requirements_verification_complete.yaml exists
      - Time: < 5 minutes per layer
      - Quality: All tests pass, all gates pass
  
  automation_level:
    metric: "Human intervention required"
    target: "Zero human intervention from YAML to verification"
    measurement:
      - 0 manual edits to generated code
      - 0 manual test creation
      - 0 manual implementation
      - 0 manual validation
  
  code_quality:
    metric: "Generated code quality"
    measurement:
      - All tests pass: 100%
      - Coverage >= thresholds: 100%
      - Linting errors: 0
      - Type errors: 0
      - Test pyramid ratio: Valid
  
  traceability:
    metric: "Requirements traceability"
    measurement:
      - AC without tests: 0
      - Tests without AC: 0
      - Orphaned code: 0
      - Traceability validation: PASSED

rollout_strategy:
  
  phase_1_prototype:
    scope: "Single layer with OpenAI API"
    tasks:
      - Create AICodeGenerator class
      - Implement RED phase test generation
      - Test on LAYER-003-03-02-02
      - Validate generated tests fail
    success: "Tests generated and fail as expected"
  
  phase_2_green_implementation:
    scope: "Add GREEN phase implementation generation"
    tasks:
      - Implement implementation generation
      - Run on LAYER-003-03-02-02
      - Validate tests pass
    success: "Implementation generated, tests pass"
  
  phase_3_refactor_and_verify:
    scope: "Add REFACTOR and VERIFY phases"
    tasks:
      - Implement refactoring generation
      - Implement verification automation
      - Complete full cycle on one layer
    success: "Full cycle completes, verification passes"
  
  phase_4_all_layers:
    scope: "Run on all 12 layers in Prerequisites Validation"
    tasks:
      - Execute all layers concurrently
      - Validate all verification files generated
    success: "All 12 layers complete successfully"
  
  phase_5_entire_system:
    scope: "Scale to all features and systems"
    tasks:
      - Run on all features in SYSTEM-003-03
      - Parallel execution
      - Aggregate reports
    success: "Entire system validated"

concurrent_execution:
  description: "Specifications for running multiple layers simultaneously with AI generation"
  
  limits:
    maximum_concurrent_layers: 5
    rationale: |
      Based on:
      - AI API rate limits (OpenAI GPT-4: 3500 req/min ÷ 5 layers = 700 req/layer/min)
      - Memory: ~2GB per layer × 5 = 10GB total (leaves headroom on typical systems)
      - CPU: ~2 cores per layer × 5 = 10 cores (typical CI/CD limit)
      - AI generation time: ~3-5 min per layer, running 5 concurrent = efficient throughput
    
    adjustable_limits:
      - Can be configured in ai_generation_config.yaml
      - Can be overridden via CLI: --max-concurrent N
      - System auto-adjusts if resources insufficient
  
  resource_management:
    per_layer_allocation:
      memory: "2GB"
      cpu_cores: 2
      disk_space: "500MB"  # For generated code + reports
    
    api_rate_limits:
      openai_gpt4:
        requests_per_minute: 700  # Per layer
        tokens_per_minute: 150000  # Per layer
      anthropic_claude:
        requests_per_minute: 400
        tokens_per_minute: 200000  # Larger context = fewer requests
      github_copilot:
        requests_per_minute: 1000
      local_llm:
        unlimited: true
        note: "Limited only by local compute resources"
    
    resource_monitoring:
      - Monitor CPU, memory, disk usage per layer
      - Auto-throttle if system resources > 90% utilized
      - Alert if API rate limit approaching
  
  queueing_strategy:
    type: "priority_fifo"
    description: "First-in-first-out within same priority level"
    
    queue_implementation:
      - "Layers queued when concurrent limit (5) reached"
      - "Execute in FIFO order within same priority"
      - "Higher priority layers jump queue"
    
    priority_levels:
      critical: 1  # Core prerequisites (environment validation)
      high: 2      # Feature prerequisites
      normal: 3    # Business logic layers
      low: 4       # Enhancement layers
    
    queue_monitoring:
      display_queue_status: true
      show_eta: true
      update_frequency: "every 10 seconds"
      example: |
        Queue Status:
        ✓ LAYER-003-03-02-01 COMPLETE (GREEN phase, 2m 45s)
        ▶ LAYER-003-03-02-02 IN PROGRESS (GREEN phase, 1m 30s elapsed)
        ▶ LAYER-003-03-02-03 IN PROGRESS (RED phase, 0m 45s elapsed)
        ▶ LAYER-003-03-02-04 IN PROGRESS (REFACTOR phase, 2m 10s elapsed)
        ▶ LAYER-003-03-02-05 IN PROGRESS (VERIFY phase, 0m 20s elapsed)
        ⏸ LAYER-003-03-02-06 QUEUED (ETA: 2m 15s)
        ⏸ LAYER-003-03-02-07 QUEUED (ETA: 4m 30s)
        [5/12 complete, 5 running, 2 queued]
  
  error_handling:
    continue_on_failure: true
    description: "If one layer fails, others continue executing"
    
    retry_strategy:
      max_retries: 2
      retry_delay: 30  # seconds
      exponential_backoff: true
      backoff_multiplier: 2  # 30s, 60s, 120s
      retry_conditions:
        - "AI API timeout"
        - "AI API rate limit exceeded"
        - "Transient network error"
      
      no_retry_conditions:
        - "YAML parsing error"
        - "Invalid acceptance criteria"
        - "AI generated invalid code (syntax errors after 2 attempts)"
    
    failure_reporting:
      aggregate_errors: true
      partial_success_allowed: true
      final_report_format: |
        Concurrent Execution Report
        ===========================
        ✅ Successful: 10/12 layers
        ❌ Failed: 2/12 layers
        
        Successful Layers:
        - LAYER-003-03-02-01 (3m 15s)
        - LAYER-003-03-02-02 (2m 45s)
        ...
        
        Failed Layers:
        - LAYER-003-03-02-06: AI generated code with syntax errors (2 retries)
        - LAYER-003-03-02-09: API rate limit exceeded (will retry)
        
        Total Time: 12m 30s (vs 36m sequential)
        Time Saved: 23m 30s (63% faster)
  
  progress_reporting:
    real_time_updates: true
    update_frequency: "every 10 seconds"
    
    display_information:
      overall_progress:
        - "X of N layers complete"
        - "Y layers in progress"
        - "Z layers queued"
        - "Overall ETA: M minutes"
      
      per_layer_progress:
        - "Layer name"
        - "Current phase: RED/GREEN/REFACTOR/VERIFY"
        - "Phase progress: X% complete"
        - "Time elapsed"
        - "ETA for layer completion"
      
      resource_usage:
        - "CPU: X%"
        - "Memory: Y GB / Z GB"
        - "API calls: N / rate limit"
        - "API quota remaining: X%"
    
    example_output: |
      ╔════════════════════════════════════════════════════════════╗
      ║  Concurrent Layer Execution: 5/12 Complete, 5 Running     ║
      ║  Overall ETA: 7m 30s | CPU: 65% | Memory: 8.5/16 GB       ║
      ╚════════════════════════════════════════════════════════════╝
      
      ✓ LAYER-003-03-02-01 [COMPLETE] 3m 15s
      ▶ LAYER-003-03-02-02 [GREEN] 1m 30s | Generating implementations... 65%
      ▶ LAYER-003-03-02-03 [RED] 0m 45s | Generating tests... 80%
      ▶ LAYER-003-03-02-04 [REFACTOR] 2m 10s | AI refactoring... 40%
      ▶ LAYER-003-03-02-05 [VERIFY] 0m 20s | Generating reports... 90%
      ⏸ LAYER-003-03-02-06 [QUEUED] ETA: 2m 15s
      ⏸ LAYER-003-03-02-07 [QUEUED] ETA: 4m 30s
      ...
  
  scaling_strategy:
    description: "How to scale beyond 5 concurrent layers"
    
    dynamic_concurrency:
      enabled: true
      description: "Auto-adjust concurrent limit based on resources"
      
      adjust_based_on:
        available_api_quota:
          - "If API quota low, reduce concurrent layers"
          - "If API quota high, increase up to max"
        
        system_resources:
          - "If CPU > 90%, reduce concurrent layers"
          - "If memory > 90%, reduce concurrent layers"
          - "If resources < 70%, increase up to max"
        
        failure_rate:
          - "If >30% layers failing, reduce concurrency (less AI load)"
          - "If <5% layers failing, safe to increase"
      
      adjustment_algorithm: |
        if api_quota_remaining < 20%:
            concurrent = max(2, concurrent - 1)
        elif cpu_usage > 90% or memory_usage > 90%:
            concurrent = max(2, concurrent - 1)
        elif failure_rate > 0.3:
            concurrent = max(2, concurrent - 1)
        elif resources_ok and failure_rate < 0.05:
            concurrent = min(max_concurrent_layers, concurrent + 1)
    
    horizontal_scaling:
      description: "Run across multiple machines"
      
      distributed_execution:
        - "Multiple machines can process different layers"
        - "Shared queue coordination via Redis or file-based locks"
        - "Each machine respects its own resource limits"
        - "Aggregate results at the end"
      
      implementation:
        queue_coordination: "Redis pub/sub or shared filesystem"
        layer_assignment: "First machine to claim a layer processes it"
        result_aggregation: "Collect all verification files at end"
      
      example: |
        Machine 1: Processes 5 layers concurrently
        Machine 2: Processes 5 layers concurrently
        Machine 3: Processes 2 layers concurrently
        Total: 12 layers across 3 machines in ~5 minutes
  
  command_line_interface:
    single_layer:
      command: "python scripts/execute_requirements.py --yaml <yaml_file>"
      example: "python scripts/execute_requirements.py --yaml LAYER-003-03-02-02.yaml"
    
    multiple_layers_directory:
      command: "python scripts/execute_requirements.py --yaml-dir <directory> --concurrent <N>"
      example: "python scripts/execute_requirements.py --yaml-dir 'FEATURE-003-03-02 Prerequisites Validation' --concurrent 5"
      description: "Finds all .yaml files in directory, executes up to 5 concurrently"
    
    multiple_layers_explicit:
      command: "python scripts/execute_requirements.py --yaml <file1> <file2> <file3> --concurrent <N>"
      example: "python scripts/execute_requirements.py --yaml LAYER-*.yaml --concurrent 3"
      description: "Execute specified YAML files, max 3 concurrent"
    
    all_layers:
      command: "python scripts/execute_requirements.py --all --concurrent <N>"
      example: "python scripts/execute_requirements.py --all --concurrent 5"
      description: "Find all layer YAML files in project, execute with concurrency limit"

