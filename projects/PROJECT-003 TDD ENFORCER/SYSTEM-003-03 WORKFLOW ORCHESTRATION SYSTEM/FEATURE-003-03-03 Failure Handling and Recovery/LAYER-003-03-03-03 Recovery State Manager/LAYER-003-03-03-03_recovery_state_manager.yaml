dependencies:
  - requirement_id: LAYER-003-03-01-01
    name: Workflow State Management
    relationship: "Recovery manager extends workflow state with persistence"

# Workflow state schema for recovery
workflow_state_schema:
  type: object
  required: [workflow_id, current_stage, completed_stages, timestamp]
  properties:
    workflow_id:
      type: string
      description: "Unique identifier for workflow instance"
    
    current_stage:
      type: integer
      description: "Current stage number (1-10)"
    
    completed_stages:
      type: array
      items:
        type: object
        properties:
          stage_number: {type: integer}
          stage_name: {type: string}
          status: {type: string, enum: [passed, failed, skipped]}
          timestamp: {type: string, format: datetime}
          results: {type: object}
    
    failed_stage:
      type: object
      description: "Details of failed stage if applicable"
      properties:
        stage_number: {type: integer}
        violations: {type: array}
        can_retry: {type: boolean}
    
    timestamp:
      type: string
      format: datetime
      description: "Last state update time"
    
    recovery_checkpoint:
      type: string
      description: "File path to persisted state"

success_criteria:
  - "Workflow state persisted at each stage"
  - "Workflow can restart from checkpoints"
  - "State integrity validated"
  - "State included in actor responses"
