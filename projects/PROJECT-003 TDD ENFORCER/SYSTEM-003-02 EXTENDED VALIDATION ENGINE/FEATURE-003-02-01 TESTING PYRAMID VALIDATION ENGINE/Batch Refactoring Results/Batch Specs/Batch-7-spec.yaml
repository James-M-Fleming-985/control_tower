  review_only: true

objective: |
  REVIEW ONLY - Do not refactor automatically!
  
  Examine evidence file operations to determine:
  1. Are they writing .json/.xml/.html (EVIDENCE - OK to keep)?
  2. Are they writing .py test/code files (ACTOR - needs refactoring)?
  
  This is validator behavior IF creating validation evidence.
  This is actor behavior IF creating code/test files.

