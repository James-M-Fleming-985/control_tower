objective: |
  MANUAL REFACTORING OBJECTIVE:
  Refactor all test file generation behaviors from ACTOR (creating files) 
  to VALIDATOR (validating file paths). These methods should receive file 
  paths from PROJECT-002 instead of creating files themselves.
  
  YOU MUST MANUALLY:
  1. Open each file listed in behaviors section below
  2. Navigate to the line number
  3. Change the ACTOR code to VALIDATOR code (see refactoring_pattern)
  4. Update method signatures to accept file paths
  5. Return ValidationResult instead of creating files
  6. Run tests to verify refactoring is correct

refactoring_pattern: |
  BEFORE (ACTOR):
    test_file.write_text(test_content)  # Creates file
  
  AFTER (VALIDATOR):
    def validate_test_file(test_file_path: str) -> ValidationResult:
        if not Path(test_file_path).exists():
            return ValidationResult(status="FAIL", reason="File not found")
        # Validate content
        return ValidationResult(status="PASS")

