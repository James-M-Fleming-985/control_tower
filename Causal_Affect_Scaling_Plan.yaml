completion_percentage: 0

# ---------------------------------------------------------------------------
# Foundational Architecture: The Autonomous Business Loop
# ---------------------------------------------------------------------------
# Every capability in this programme exists to serve a single self-correcting
# loop. The system MUST operate this loop without human intervention; user
# input is restricted to read-only audit and program-level configuration.
autonomous_loop:
  principle: >
    When build quality is poor, the fix is to improve the loop's learning,
    never to insert a human gate.
  stages:
    - id: discovery
      definition: >
        Identify opportunities from external signals (causal models, trends,
        market data). Recommendations originate ONLY here.
    - id: adapt
      definition: >
        For each Discovery-sourced opportunity, generate a specification,
        acceptance criteria, and implementation plan. No human approval gate.
    - id: exploit
      definition: >
        Build, verify, and deploy the MVP from the spec. Verification
        artifacts (REQ traceability, AC pass/fail) are produced as internal
        evidence.
    - id: monitor
      definition: >
        The deployed MVP emits a beacon identifying its build_id. Engagement
        is collected via GA4 (system of record); revenue via Stripe; both
        joined back to the build_id.
    - id: learn
      definition: >
        Correlate verification status, telemetry outcomes, prompt versions,
        and spec attributes to identify what predicts engagement and revenue.
    - id: optimize
      definition: >
        Findings feed back into prompt selection, discovery signal weighting,
        and resource allocation. Initially surfaces recommendations (M3);
        auto-rotation deferred to M5+.

# ---------------------------------------------------------------------------
# Out-of-Scope Guardrails (Anti-Drift)
# ---------------------------------------------------------------------------
# To preserve the autonomous loop, the following are explicitly out of scope.
# Feature requests violating MUST_NOT items must be re-framed as either
# (a) a system-learning improvement, or (b) a read-only audit improvement.
out_of_scope:
  must_not:
    - Accept manually-entered ideas or recommendations from the user
    - Require user approval of specifications, acceptance criteria, or
      generated code before building
    - Allow editing of specs, ACs, or generated code via the UI
    - Treat verification artifacts as a user-facing approval gate
    - Interrupt the Discovery → Adapt → Exploit → Monitor → Learn → Optimize
      loop with synchronous user steps
    - Use mock, synthetic, or placeholder data anywhere in production
  must:
    - Originate every build from a Discovery-sourced recommendation
    - Verify every build against its acceptance criteria with PROJECT-004-style
      traceability artifacts
    - Bind every build to telemetry (GA4 engagement, Stripe revenue) keyed by
      build_id
    - Use telemetry plus verification status to learn and improve future builds
    - Expose all evidence (specs, ACs, verification reports, telemetry) as a
      read-only audit trail

