# ============================================================
# AI FEATURE BUILDER - Cross-Repository Workflow
# ============================================================
# Builds features in any repository using the AI Code Generator
#
# TRIGGER: Workflow dispatch from GitHub Actions tab or mobile
#
# REQUIRED SECRETS:
#   - ANTHROPIC_API_KEY: API key for Claude AI
#   - CROSS_REPO_PAT: Personal Access Token with 'repo' scope
#     (needed to push changes to target repositories)
#
# SETUP:
#   1. Go to GitHub Settings → Developer settings → Personal access tokens
#   2. Generate new token (classic) with 'repo' scope
#   3. Add as repository secret: CROSS_REPO_PAT
#   4. Add ANTHROPIC_API_KEY as repository secret

name: "🤖 AI Feature Builder"

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
        type: choice
        options:
          - 'James-M-Fleming-985/business_ventures'
          - 'James-M-Fleming-985/control_tower'
        default: 'James-M-Fleming-985/business_ventures'
      
      target_path:
        description: 'Path to project within repo (e.g., Causal_affect)'
        required: false
        type: string
        default: 'Causal_affect'
      
      feature_id:
        description: 'Feature to build'
        required: true
        type: choice
        options:
          - 'FEATURE-CA-002-06'
          - 'FEATURE-CA-002-08'
          - 'FEATURE-CA-002-09'
          - 'ALL_IN_ORDER'
      
      dry_run:
        description: 'Dry run (validate only, no AI generation)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: "Build ${{ inputs.feature_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      # ========================================
      # SETUP
      # ========================================
      - name: "📥 Checkout control_tower (AI Code Generator)"
        uses: actions/checkout@v4
        with:
          path: control_tower

      - name: "📥 Checkout target repository"
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: target_repo
          fetch-depth: 0

      - name: "🐍 Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: "� Set up Node.js (for frontend builds)"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml requests pytest numpy pandas scipy statsmodels
          
          # Install target repo dependencies if present
          TARGET_PATH="target_repo/${{ inputs.target_path }}"
          if [ -f "$TARGET_PATH/src/backend/requirements.txt" ]; then
            pip install -r "$TARGET_PATH/src/backend/requirements.txt"
          fi
          if [ -f "$TARGET_PATH/requirements.txt" ]; then
            pip install -r "$TARGET_PATH/requirements.txt"
          fi

      - name: "🔧 Configure git for automated commits"
        working-directory: target_repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ========================================
      # VALIDATION
      # ========================================
      - name: "✅ Validate configuration"
        id: validate
        run: |
          TARGET_PATH="target_repo/${{ inputs.target_path }}"
          FEATURE="${{ inputs.feature_id }}"
          
          echo "Target path: $TARGET_PATH"
          echo "Feature: $FEATURE"
          
          # Check target exists
          if [ ! -d "$TARGET_PATH" ]; then
            echo "::error::Target path not found: $TARGET_PATH"
            exit 1
          fi
          
          # Find feature YAMLs
          if [ "$FEATURE" = "ALL_IN_ORDER" ]; then
            FEATURES=("FEATURE-CA-002-06" "FEATURE-CA-002-08" "FEATURE-CA-002-09")
          else
            FEATURES=("$FEATURE")
          fi
          
          for F in "${FEATURES[@]}"; do
            YAML_PATH=$(find "$TARGET_PATH" -name "${F}*.yaml" -path "*/${F}_*/*" -type f 2>/dev/null | grep -v "LAYER-" | head -1)
            if [ -z "$YAML_PATH" ]; then
              echo "::error::Feature YAML not found for $F in $TARGET_PATH"
              find "$TARGET_PATH" -name "*.yaml" -type f 2>/dev/null | head -20
              exit 1
            fi
            echo "✓ Found: $YAML_PATH"
          done
          
          echo "validation_passed=true" >> $GITHUB_OUTPUT

      - name: "🔍 Deep validate feature YAMLs"
        id: deep_validate
        run: |
          TARGET_PATH="target_repo/${{ inputs.target_path }}"
          FEATURE="${{ inputs.feature_id }}"
          DRY_RUN="${{ inputs.dry_run }}"
          
          if [ "$FEATURE" = "ALL_IN_ORDER" ]; then
            FEATURES=("FEATURE-CA-002-06" "FEATURE-CA-002-08" "FEATURE-CA-002-09")
          else
            FEATURES=("$FEATURE")
          fi
          
          # Require production wiring for non-dry-run builds
          EXTRA_FLAGS=""
          if [ "$DRY_RUN" != "true" ]; then
            EXTRA_FLAGS="--require-production-wiring"
          fi
          
          FAILED=0
          for F in "${FEATURES[@]}"; do
            YAML_PATH=$(find "$TARGET_PATH" -name "${F}*.yaml" -path "*/${F}_*/*" -type f 2>/dev/null | grep -v "LAYER-" | head -1)
            if [ -z "$YAML_PATH" ]; then
              echo "::error::Feature YAML not found for $F"
              FAILED=1
              continue
            fi
            
            if ! python control_tower/validate_feature_yaml.py "$YAML_PATH" $EXTRA_FLAGS; then
              FAILED=1
            fi
          done
          
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Feature YAML validation failed — fix errors above before building"
            exit 1
          fi
          
          echo "✅ All feature YAMLs passed deep validation"

      # ========================================
      # BUILD SINGLE FEATURE
      # ========================================
      - name: "🔨 Build feature: ${{ inputs.feature_id }}"
        if: inputs.feature_id != 'ALL_IN_ORDER'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TARGET_PATH="$(pwd)/target_repo/${{ inputs.target_path }}"
          FEATURE="${{ inputs.feature_id }}"
          DRY_RUN="${{ inputs.dry_run }}"
          
          echo ""
          echo "========================================"
          echo "  Building: $FEATURE"
          echo "  Target: $TARGET_PATH"
          echo "  Dry run: $DRY_RUN"
          echo "========================================"
          echo ""
          
          # Find the feature YAML
          YAML_PATH=$(find "$TARGET_PATH" -name "${FEATURE}*.yaml" -path "*/${FEATURE}_*/*" -type f 2>/dev/null | grep -v "LAYER-" | head -1)
          
          echo "Feature YAML: $YAML_PATH"
          echo ""
          
          if [ "$DRY_RUN" = "true" ]; then
            echo "📋 DRY RUN - Validating YAML only"
            python -c "import yaml; data = yaml.safe_load(open('$YAML_PATH')); print('✓ YAML valid'); print(f'Feature: {data.get(\"name\", \"unknown\")}'); print(f'Layers: {len(data.get(\"layers\", []))}')"
          else
            echo "🚀 Starting AI code generation..."
            cd control_tower
            python build_feature.py "$YAML_PATH" --verbose
          fi

      # ========================================
      # BUILD ALL FEATURES IN ORDER
      # ========================================
      - name: "🔨 Build all features sequentially"
        if: inputs.feature_id == 'ALL_IN_ORDER'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Use absolute paths to avoid cd navigation issues
          WORKSPACE_ROOT="$(pwd)"
          TARGET_PATH="$WORKSPACE_ROOT/target_repo/${{ inputs.target_path }}"
          CONTROL_TOWER="$WORKSPACE_ROOT/control_tower"
          TARGET_REPO="$WORKSPACE_ROOT/target_repo"
          DRY_RUN="${{ inputs.dry_run }}"
          
          FEATURES=("FEATURE-CA-002-06" "FEATURE-CA-002-08" "FEATURE-CA-002-09")
          
          BUILD_RESULTS=""
          
          for FEATURE in "${FEATURES[@]}"; do
            echo ""
            echo "========================================"
            echo "  Building: $FEATURE"
            echo "========================================"
            echo ""
            
            YAML_PATH=$(find "$TARGET_PATH" -name "${FEATURE}*.yaml" -path "*/${FEATURE}_*/*" -type f 2>/dev/null | grep -v "LAYER-" | head -1)
            
            if [ -z "$YAML_PATH" ]; then
              echo "⚠️ Skipping $FEATURE - YAML not found"
              BUILD_RESULTS="$BUILD_RESULTS\n❌ $FEATURE: YAML not found"
              continue
            fi
            
            echo "Feature YAML: $YAML_PATH"
            
            if [ "$DRY_RUN" = "true" ]; then
              python -c "import yaml; yaml.safe_load(open('$YAML_PATH'))" && echo "✓ Valid"
              BUILD_RESULTS="$BUILD_RESULTS\n✓ $FEATURE: Valid YAML"
            else
              # Run build from control_tower directory
              cd "$CONTROL_TOWER"
              if python build_feature.py "$YAML_PATH" --verbose; then
                BUILD_RESULTS="$BUILD_RESULTS\n✅ $FEATURE: Success"
              else
                BUILD_RESULTS="$BUILD_RESULTS\n❌ $FEATURE: Build failed"
                echo "::warning::Build failed for $FEATURE, continuing with next feature"
              fi
              # Always return to workspace root for next iteration
              cd "$WORKSPACE_ROOT"
            fi
          done
          
          echo ""
          echo "========================================"
          echo "  BUILD SUMMARY"
          echo "========================================"
          echo -e "$BUILD_RESULTS"

      # ========================================
      # SYSTEM INTEGRATION VERIFICATION
      # ========================================
      - name: "🔗 Verify system integration"
        if: inputs.feature_id == 'ALL_IN_ORDER' && inputs.dry_run != true
        run: |
          TARGET_PATH="target_repo/${{ inputs.target_path }}"
          
          # Find the SYSTEM-* directory
          SYSTEM_DIR=$(find "$TARGET_PATH" -maxdepth 1 -type d -name "SYSTEM-*" | head -1)
          if [ -z "$SYSTEM_DIR" ]; then
            SYSTEM_DIR="$TARGET_PATH"
          fi
          
          echo "Verifying system integration in: $SYSTEM_DIR"
          python control_tower/verify_system_integration.py "$SYSTEM_DIR" \
            --repo-root target_repo || echo "::warning::System integration verification found issues"

      # ========================================
      # COMMIT & PUSH TO TARGET REPO
      # ========================================
      - name: "🚀 Commit and push to target repo"
        if: inputs.dry_run != true
        working-directory: target_repo
        run: |
          # Stage all changes
          git add -A
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi
          
          # Show what changed
          CHANGED=$(git diff --cached --stat | tail -1)
          echo "📝 Changes: $CHANGED"
          
          # Commit with traceability
          FEATURE="${{ inputs.feature_id }}"
          git commit -m "🤖 AI Feature Builder: ${FEATURE}" \
            -m "Automated build by AI Feature Builder workflow" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Push using CROSS_REPO_PAT (set during checkout)
          git push origin main
          
          echo "✅ Pushed to origin/main — Railway deployment triggered"

      # ========================================
      # ARTIFACTS & SUMMARY
      # ========================================
      - name: "📁 Upload build artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "build-${{ inputs.feature_id }}-${{ github.run_number }}"
          path: |
            target_repo/**/verification_*.md
            target_repo/**/verification_*.yaml
            target_repo/**/build_*.log
            control_tower/**/build_*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: "📊 Generate summary"
        if: always()
        run: |
          echo "## 🤖 AI Feature Builder Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Repo** | \`${{ inputs.target_repo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Path** | \`${{ inputs.target_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Feature** | \`${{ inputs.feature_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
